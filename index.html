function pickType(n){

  if(n>=4)pool.push(['brute',1.2+n*.15]);
  if(n>=6)pool.push(['bazooka',1.2+(n-6)*.25]); // バズーカ兵は後半から
  let r=Math.random()*pool.reduce((s,p)=>s+p[1],0);
  for(const p of pool){r-=p[1];if(r<=0)return p[0]}

function updateWave(dt){

      if(G.wave>=2&&!G.tut){G.rushT-=dt;if(G.rushT<=0&&G.rush<=0&&painted/GN<.9){G.rush=8;G.rushT=rand(40,55);callout('大群襲来！','雑魚の群れが押し寄せる——一気に薙ぎ払え','#ff8a30');G.callout.dur=1.8;SFX.alarm()}}
      if(G.rush>0){G.rush-=dt;G.rushSp-=dt;if(G.rushSp<=0&&alive<Math.min(5+Math.ceil(G.wave*.7),11)+8){G.rushSp=.22;queueSpawn(Math.random()<.6?'runner':'grunt');MARKS[MARKS.length-1].horde=true}}

/* ---------------- 血塗り判定（クリア条件） ----------------
   アリーナを床タイル(46px)単位で区切り、血が一定量たまったタイルを「塗りつぶし済み」にする。
   全タイルが塗られたら通常ウェーブはクリア（ボス戦はボス撃破でクリア）。 */
const TS=46,GC=Math.ceil((AX1-AX0)/TS),GR=Math.ceil((AY1-AY0)/TS),GN=GC*GR;

function tileRect(i){const x=AX0+(i%GC)*TS,y=AY0+Math.floor(i/GC)*TS;return{x,y,w:Math.min(TS,AX1-x),h:Math.min(TS,AY1-y)}}
function paint(x,y,r,amt){
  const c0=clamp(Math.floor((x-r-AX0)/TS),0,GC-1),c1=clamp(Math.floor((x+r-AX0)/TS),0,GC-1);
  const r0=clamp(Math.floor((y-r-AY0)/TS),0,GR-1),r1=clamp(Math.floor((y+r-AY0)/TS),0,GR-1);
  for(let cy=r0;cy<=r1;cy++)for(let cx=c0;cx<=c1;cx++){
    const i=cy*GC+cx;if(DONE[i])continue;const t=tileRect(i);
    if(Math.hypot(x-clamp(x,t.x,t.x+t.w),y-clamp(y,t.y,t.y+t.h))>r)continue;
    const inT=x>=t.x&&x<t.x+t.w&&y>=t.y&&y<t.y+t.h;
    PAINT[i]+=amt*PAINT_MUL*(inT?1:.5)*(painted/GN>=.85?2:1)*(1+Math.min(1,G.chain/40));if(PAINT[i]>=1)fillTile(i);
  }
}
function fillTile(i){
  if(DONE[i])return;
  DONE[i]=1;painted++;if(!capFilling)capNew.push(i);const t=tileRect(i),d=decG;
  d.fillStyle='rgba(85,0,10,.5)';d.fillRect(t.x,t.y,t.w,t.h);
  for(let k=0;k<6;k++){d.fillStyle=`rgba(${irand(90,140)},0,${irand(8,20)},${rand(.3,.55).toFixed(2)})`;d.beginPath();d.arc(t.x+rand(8,t.w-8),t.y+rand(8,Math.max(9,t.h-8)),rand(5,9),0,TAU);d.fill()}

}
function tileAt(x,y){const cx=Math.floor((x-AX0)/TS),cy=Math.floor((y-AY0)/TS);return cx<0||cy<0||cx>=GC||cy>=GR?-1:cy*GC+cx}

// 高圧洗浄機：直線上(幅1タイル)の血をまとめて洗い流す
const WASH_LEN=300;
const MOP_T=.6,MOP_SPD=1.35; // モップ係：1マス拭く秒数（旧1.5）／移動速度の倍率
function washLine(x,y,a){
  const hit=new Set();
  for(let l=0;l<=WASH_LEN;l+=10){const i=tileAt(x+Math.cos(a)*l,y+Math.sin(a)*l);if(i>=0)hit.add(i)}
  let n=0;for(const i of hit)if(DONE[i]||PAINT[i]>.15){cleanTile(i,true);n++}
  for(let k=0;k<26;k++){const l=rand(10,WASH_LEN),s=rand(-40,40);fx({k:'drop',x:x+Math.cos(a)*l,y:y+Math.sin(a)*l,vx:Math.cos(a)*220-Math.sin(a)*s,vy:Math.sin(a)*220+Math.cos(a)*s,life:.35,max:.35})}
  if(n)popText(x+Math.cos(a)*WASH_LEN*.5,y+Math.sin(a)*WASH_LEN*.5,'高圧洗浄 -'+n,'#7fc8ff',14,.9);
  addShake(4);
}
function washCount(x,y,a){let n=0;const hit=new Set();for(let l=0;l<=WASH_LEN;l+=10){const i=tileAt(x+Math.cos(a)*l,y+Math.sin(a)*l);if(i>=0&&!hit.has(i)){hit.add(i);if(DONE[i])n++}}return n}
// 漂白剤：対象タイルを中心に、ひし形（中心から2マス以内・13マス）を一気に消す
const BLEACH_T=.8; // 撒き終わるまでの秒数
const BLEACH_TILES=i=>{const cx=i%GC,cy=Math.floor(i/GC),out=[];for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){if(Math.abs(dx)+Math.abs(dy)>2)continue;const nx=cx+dx,ny=cy+dy;if(nx>=0&&ny>=0&&nx<GC&&ny<GR)out.push(ny*GC+nx)}return out};
function bleachArea(i){
  const c=tileRect(i),ox=c.x+c.w/2,oy=c.y+c.h/2;
  for(const j of BLEACH_TILES(i)){if(DONE[j]||PAINT[j]>.15){cleanTile(j,true);PAINT[j]=0}
    // 撒き終わりに、範囲全体へ泡と飛沫が広がる
    const t=tileRect(j);for(let k=0;k<3;k++)fx({k:'suds',x:t.x+rand(6,t.w-6),y:t.y+rand(6,t.h-6),vx:rand(-20,20),vy:rand(-20,20),life:rand(.6,1.1),max:1.1,sz:rand(4,9)})}
  for(let k=0;k<40;k++){const a=rand(0,TAU),v=rand(80,300),l=rand(.3,.6);fx({k:'drop',x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:l,max:l})}
  RINGS.push({x:ox,y:oy,r:10,R:TS*2.4,t:0,dur:.4,col:'235,245,255',w:8});SFX.wash();addShake(4);
  const t=tileRect(i);popText(t.x+t.w/2,t.y+t.h/2,'漂白','#e8f4ff',14,.9);
}
// 周囲を一気に血の海にする（掃除屋撃破・代紋ボーナス）
function bloodNova(x,y,r,hurt){
  for(let k=0;k<10;k++){const a=rand(0,TAU),l=rand(0,r*.8);splat(x+Math.cos(a)*l,y+Math.sin(a)*l,rand(12,20),a)}
  paint(x,y,r,1.2);bloodBurst(x,y,rand(0,TAU),30,500);
  RINGS.push({x,y,r:10,R:r,t:0,dur:.4,col:'255,30,60',w:10});addShake(10);SFX.kill(30);
  if(hurt)for(const e of [...E])if(dist(x,y,e.x,e.y)<r+e.r)hitEnemy(e,5,Math.atan2(e.y-y,e.x-x),600,{fin:true});
}
// 代紋タイル：床に描かれた鬼頭組の紋。血で塗るとボーナス
function pickCrests(){
  const kinds=['soul','heal','nova'].sort(()=>Math.random()-.5);
  for(let n=0;n<3;n++){
    for(let tries=0;tries<60;tries++){
      const i=irand(0,GN-1),cx=i%GC,cy=Math.floor(i/GC);
      if(cy<1||cy>=GR-1||G.crests.some(c=>Math.abs(c.i%GC-cx)+Math.abs(Math.floor(c.i/GC)-cy)<4))continue;
      G.crests.push({i,r:kinds[n],taken:false});break;
    }
  }
}
function crestReward(c){
  misAdd('crest');
  const t=tileRect(c.i),x=t.x+t.w/2,y=t.y+t.h/2;
  SFX.just();addShake(10);RINGS.push({x,y,r:10,R:120,t:0,dur:.45,col:'255,210,90',w:8});
  G.score+=Math.round(500*G.mult);
  if(c.r==='soul'){G.soul=Math.min(100,G.soul+50);callout('代紋 粉砕','SOUL +50','#ffd54a')}
  else if(c.r==='heal'){healP(30);callout('代紋 粉砕','HP +30','#ffd54a')}
  else{callout('代紋 粉砕','血の爆心 —— 周囲が血の海に','#ffd54a');bloodNova(x,y,120,true)}
}
function scorch(x,y,r){const d=decG,gr=d.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(0,0,0,.7)');gr.addColorStop(1,'rgba(0,0,0,0)');d.fillStyle=gr;d.beginPath();d.arc(x,y,r,0,TAU);d.fill()}
function popText(x,y,txt,col,size,dur){TEXTS.push({x,y,txt,col:col||'#fff',size:size||14,t:0,dur:dur||.7,vy:-60})}
function callout(txt,sub,col){G.callout={txt,sub,col:col||'#ff2f5f',t:0,dur:1.3}}
function healP(n){if(P.dead)return;const b=P.hp;P.hp=Math.min(P.maxhp,P.hp+n);if(P.hp-b>=1)popText(P.x,P.y-30,'+'+Math.round(P.hp-b),'#6dff9c',15)}
function rankOf(c){return c>=150?'UNDEAD GOD':c>=100?'MASSACRE':c>=50?'SAVAGE':c>=25?'BRUTAL':c>=10?'COOL':c>=5?'NICE':''}

/* ---------------- combat ---------------- */
function hitEnemy(e,dmg,ang,kb,o){
  o=o||{};if(e.dead)return;
  if(e.boss&&e.state==='dizzy')dmg*=1.6;
  e.hp-=dmg;e.flash=.11;let k=kb;
  if(e.armor){
    if(e.boss)k*=o.fin?.18:.06;
    else if(o.fin){k*=.6;e.stun=.6;if(e.state!=='enter')e.state='chase'}
    else k*=.15;
  }else{
    // 通常ヒットでは敵の予備動作をキャンセルしない（フィニッシュ/爆発/クリティカルのみ潰せる）
    const busy=e.state==='windup'||e.state==='aim'||e.state==='fuse'||e.state==='strike';
    e.stun=Math.max(e.stun,o.fin?.55:.2);if(e.state!=='enter'&&(o.fin||!busy))e.state='chase';
    if(k>=420){e.fly=.45;e.bset=new Set([e])}
  }
  e.vx=Math.cos(ang)*k;e.vy=Math.sin(ang)*k;
  G.chain++;G.chainT=2.4;G.chainPop=1;G.maxChain=Math.max(G.maxChain,G.chain);G.wchain=Math.max(G.wchain||0,G.chain);misAdd('chain',G.chain);
  G.mult=1+Math.min(4,Math.floor(G.chain/10)*.5);
  if([10,25,50,100,150,200,300].includes(G.chain))callout(rankOf(G.chain)+'!',G.chain+' HITS  x'+G.mult.toFixed(1));
  G.soul=Math.min(100,G.soul+soulMul()*(o.fin?3:1.6));
  const big=o.fin||o.crit||dmg>=3;
  bloodBurst(e.x,e.y,ang,big?14:8,big?340:230);
  spark(e.x-Math.cos(ang)*e.r*.5,e.y-Math.sin(ang)*e.r*.5,ang,big);
  // ダメージ数字はクリティカルの時だけ（床を見やすくするため）
  if(o.crit&&!o.wall)TEXTS.push({x:e.x+rand(-6,6),y:e.y-e.r-8,txt:String(Math.round(dmg*10)),col:'#ffd54a',size:20,t:0,dur:.55,vy:-90});
  SFX.hit(big);
  if(e.hp<=0)killEnemy(e,ang,Math.max(k,o.fin?720:480),o);
}
function killEnemy(e,ang,spd,o){
  o=o||{};if(e.dead)return;e.dead=true;
  const i=E.indexOf(e);if(i>=0)E.splice(i,1);
  if(e.boss){bossDown(e,ang);return}
  G.wk=(G.wk||0)+1;
  if(G.tut&&G.tut.step===2&&G.tut.gap>=0&&!DONE[G.tut.gap]){const t=tileRect(G.tut.gap);if(dist(e.x,e.y,t.x+t.w/2,t.y+t.h/2)<95)fillTile(G.tut.gap)}
  // お題用：仕掛け・怨念解放中・掃除屋の撃破を数える
  const cause=G.cause||(e.smoked>0?'ext':null);if(cause&&cause===G.gim)misAdd('gim');
  if(G.cause==='rage')misAdd('rage');
  if(lv('drain'))P.hp=Math.min(P.maxhp,P.hp+1.4*lv('drain'));
  if(o.fall){for(let i=0;i<8;i++){const a=rand(0,TAU),v=rand(30,120),l=rand(.3,.6);fx({k:'smoke',x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:l,max:l,sz:rand(8,14)})}}
  else{splat(e.x,e.y,e.r*1.5,ang);bloodBurst(e.x,e.y,ang,18,440)}
  if(e.type==='cleaner')misAdd('cleaner');
  {
    if(!o.fall)CORPSES.push({e,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,rot:0,vr:rand(-16,16),t:0,hit:new Set()});
    G.kills++;const pts=Math.round(e.val*G.mult);G.score+=pts;
    G.soul=Math.min(100,G.soul+soulMul()*(e.type==='brute'?20:10));
    dropOrbs(e.x,e.y,Math.random()<(P.hp<40?.24:.1)+(e.type==='brute'?.3:0));
    SFX.kill(G.chain);G.hitstop=Math.max(G.hitstop,.06);addShake(6);
  }
}
function explode(x,y,r,hostile){
  SFX.boom();addShake(15);G.hitstop=Math.max(G.hitstop,.07);G.flash=Math.max(G.flash,.25);G.flashCol='255,150,60';G.zoom=Math.max(G.zoom,.03);
  RINGS.push({x,y,r:10,R:r*1.15,t:0,dur:.35,col:'255,170,80',w:12});
  for(let i=0;i<26;i++){const a=rand(0,TAU),s=rand(60,380),l=rand(.25,.6);fx({k:'fire',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:l,max:l,sz:rand(10,24)})}
  for(let i=0;i<12;i++){const a=rand(0,TAU),s=rand(30,150),l=rand(.6,1.2);fx({k:'smoke',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:l,max:l,sz:rand(14,26)})}
  scorch(x,y,r*.75);
  for(const e of [...E]){if(dist(x,y,e.x,e.y)<r+e.r)hitEnemy(e,e.boss?6:8,Math.atan2(e.y-y,e.x-x),760,{fin:true})}
  if(hostile&&dist(x,y,P.x,P.y)<r*.85+P.r)hurtPlayer(16,x,y);
  for(const o of PROPS)if(o.k==='dyn'&&!o.used&&!o.lit&&dist(o.x,o.y,x,y)<r+20){o.lit=true;o.fuse=.18}
}
function slamAt(x,y,r,dmg){
  addShake(12);SFX.wall();RINGS.push({x,y,r:8,R:r,t:0,dur:.3,col:'255,80,80',w:9});
  for(let i=0;i<14;i++){const a=rand(0,TAU),s=rand(60,220),l=rand(.3,.6);fx({k:'smoke',x:x+Math.cos(a)*r*.5,y:y+Math.sin(a)*r*.5,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:l,max:l,sz:rand(8,16)})}
  scorch(x,y,r*.5);
  if(dist(x,y,P.x,P.y)<r+P.r*.5)hurtPlayer(dmg,x,y);
}
function fire(x,y,a,spd,dmg,big){
  const b={x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,dmg,friendly:false,life:3,dodged:false,big:!!big};B.push(b);
  fx({k:'f',x,y,r:18,life:.06,max:.06,a:0});SFX.gun();return b;
}
// 弾き返し：ヒットストップ＋スローで「決まった」瞬間を強調。体に届く寸前で弾くとPERFECT（威力2倍・演出強化）
// 跳ね返した弾は雑魚を貫通し続ける（装甲・ボスに当たると止まる）
function reflect(b){
  tutLater(4,500);
  const pf=dist(b.x,b.y,P.x,P.y)<P.r+26+15*lv('perfect');
  b.friendly=true;b.life=2;b.perfect=pf;b.kills=0;b.hits=new Set();b.trail=[];let t=null,bd=1e9;
  for(const e of E){const d=dist(b.x,b.y,e.x,e.y);if(d<bd){bd=d;t=e}}
  const sp=Math.hypot(b.vx,b.vy)*(pf?2.6:2.1)*(lv('perfect')?1.14:1),a=t?Math.atan2(t.y-b.y,t.x-b.x):Math.atan2(-b.vy,-b.vx);
  b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;misAdd('reflect');
  // 拡散反射（強化カード）：左右に2発追加
  if(lv('split')&&!b.rocket)for(const da of [-.3,.3])B.push({...b,vx:Math.cos(a+da)*sp,vy:Math.sin(a+da)*sp,hits:new Set(),trail:[],kills:0,noPierce:true});
  spark(b.x,b.y,a,true);spark(b.x,b.y,a+.6,true);spark(b.x,b.y,a-.6,true);SFX.reflect();if(pf)SFX.just();
  RINGS.push({x:b.x,y:b.y,r:6,R:pf?80:52,t:0,dur:.26,col:pf?'255,215,90':'127,243,255',w:pf?9:6});
  G.hitstop=Math.max(G.hitstop,pf?.13:.08);slow(pf?.55:.3,pf?.2:.35);
  G.flash=Math.max(G.flash,pf?.45:.25);G.flashCol=pf?'255,230,140':'150,240,255';G.zoom=Math.max(G.zoom,pf?.06:.04);addShake(pf?13:8);
  popText(b.x,b.y-18,pf?'PERFECT REFLECT!!':'REFLECT!!',pf?'#ffd54a':'#7ff3ff',pf?22:19,.85);
  G.score+=pf?300:100;
  G.chain++;G.chainT=2.4;G.chainPop=1;G.soul=Math.min(100,G.soul+soulMul()*(pf?8:4));
}
// 落とすのは回復ハートのみ（魂を吸い取る演出は廃止。SOULは撃破時に直接加算）
function dropOrbs(x,y,heal){
  if(heal)ORBS.push({k:'heal',x,y,vx:rand(-50,50),vy:rand(-50,50),t:0});
}
function hurtPlayer(dmg,sx,sy){
  if(P.dead||state!=='play')return;
  if(P.inv>0)return;
  dmg*=ENEMY_DMG;
  const a=Math.atan2(P.y-sy,P.x-sx);
  // ガードは正面（向いている方向±GUARD_ARC）からの攻撃だけ防げる
  const front=Math.abs(angDiff(P.face,a+Math.PI))<guardArc();
  if(P.guard&&!front)popText(P.x,P.y-50,'背後を取られた！','#ffb44a',13,.8);
  if(P.guard&&front){
    // ガード：ダメージを完全に防ぎ、受けるはずだったダメージのGUARD_HEAL倍だけ回復。ノックバック小、連撃は途切れない
    const heal=dmg*GUARD_HEAL;P.hp=Math.min(P.maxhp,P.hp+heal);misAdd('guard');P.guardLock=true;if(G.tut&&G.tut.step===3)tutNext();
    if(lv('counter')&&!P.crit){P.crit=.7;popText(P.x,P.y-48,'COUNTER!','#7fd8ff',15,.7)}
    // 防いだ相手（近接攻撃なら攻撃元の近くの敵）を弾き飛ばして少し怯ませ、間合いを作る
    let foe=null,fd=48;for(const e of E){if(e.boss)continue;const dd=dist(e.x,e.y,sx,sy);if(dd<fd){fd=dd;foe=e}}
    if(foe){const ka=Math.atan2(foe.y-P.y,foe.x-P.x);foe.vx+=Math.cos(ka)*(foe.armor?220:380);foe.vy+=Math.sin(ka)*(foe.armor?220:380);foe.stun=Math.max(foe.stun,foe.armor?.25:.45);if(foe.state!=='enter')foe.state='chase';foe.wait=false}P.inv=.3;P.guardFx=.25;P.kx=Math.cos(a)*150;P.ky=Math.sin(a)*150;
    spark(P.x-Math.cos(a)*18,P.y-Math.sin(a)*18,a+Math.PI,true);
    RINGS.push({x:P.x,y:P.y,r:14,R:46,t:0,dur:.22,col:'110,240,255',w:5});
    addShake(5);G.hitstop=Math.max(G.hitstop,.05);SFX.guard();
    popText(P.x,P.y-30,'GUARD +'+Math.max(1,Math.round(heal)),'#6dff9c',15,.7);
    return;
  }
  P.hp-=dmg;P.inv=.8;P.blinkT=.8;
  P.kx=Math.cos(a)*300;P.ky=Math.sin(a)*300;
  bloodBurst(P.x,P.y,a,14,300);addShake(11);G.flash=Math.max(G.flash,.35);G.flashCol='255,30,60';G.hitstop=Math.max(G.hitstop,.07);SFX.hurt();
  popText(P.x,P.y-30,'-'+Math.round(dmg),'#ff4060',18,.8);
  if(G.chain>=10)popText(P.x,P.y-50,'CHAIN BREAK','#ff8090',13,.9);
  G.chain=0;G.mult=1;
  if(P.hp<=0)die(a);
}
function die(a){P.hp=0;P.dead=true;P.guard=false;G.deathT=0;slow(2,.25);P.atk=null;bloodBurst(P.x,P.y,a,40,500);splat(P.x,P.y,26,a);SFX.death();G.flash=.7}
function bossDown(e,ang){
  G.boss=null;G.kills++;const pts=Math.round(e.val*G.mult);G.score+=pts;
  slow(1.7,.15);addShake(28);G.flash=.9;G.flashCol='255,255,255';G.hitstop=.18;G.zoom=.08;
  for(let i=0;i<4;i++)bloodBurst(e.x,e.y,rand(0,TAU),30,600);
  splat(e.x,e.y,50,ang);SFX.boom();SFX.kill(99);
  RINGS.push({x:e.x,y:e.y,r:10,R:260,t:0,dur:.6,col:'255,60,90',w:16});
  CORPSES.push({e,vx:Math.cos(ang)*520,vy:Math.sin(ang)*520,rot:0,vr:rand(-8,8),t:-.8,hit:new Set()});
  for(const o of [...E])killEnemy(o,Math.atan2(o.y-e.y,o.x-e.x),760,{});
  MARKS.length=0;B.length=0;
  dropOrbs(e.x,e.y,true);
  G.banner={top:BOSSES[e.type].name,main:'撃 破',sub:'+'+pts,t:0,dur:2.8,col:'#ff2f5f'};
  if(e.type==='kito'&&!G.endless){G.phase='ending';G.endT=3.4}
  else{G.phase='break';G.breakT=3.4;healP(35);G.res={boss:true,kills:G.wk,chain:G.wchain}}
}

];
const UP={};
const lv=id=>UP[id]||0;
const powMul=()=>1+.175*lv('power');
const soulMul=()=>.25*(1+.28*lv('soul')); // 戦闘で溜まるSOULの倍率（基本は当初の1/4）
const novaR=()=>215*(1+.175*lv('nova')); // 怨念解放の範囲
const guardArc=()=>GUARD_ARC+.245*lv('wide');
function openPick(){
  const pool=CARDS.filter(c=>lv(c.id)<c.max);if(!pool.length){startWave(G.wave+1);return}
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  G.cards=pool.slice(0,3);G.cardSel=0;state='pick';stateT=0;SFX.ui();
}
function pickCard(i){
  if(state!=='pick'||stateT<.5)return;const c=G.cards[i];if(!c)return;
  UP[c.id]=lv(c.id)+1;if(c.id==='vital'){P.maxhp+=18;P.hp=Math.min(P.maxhp,P.hp+18)}
  state='play';stateT=0;SFX.just();startWave(G.wave+1);popText(P.x,P.y-50,c.name+' 獲得','#ffd54a',16,1.2);
}
const CARD_R=i=>({x:W/2,y:300+i*128,w:380,h:112});
function cardAt(p){for(let i=0;i<(G.cards||[]).length;i++)if(inR(p,CARD_R(i)))return i;return -1}
function pickKey(k){
  const n=G.cards.length;
  if(['1','2','3'].includes(k)){pickCard(+k-1);return}
  if(['arrowup','w','arrowleft','a'].includes(k)){G.cardSel=(G.cardSel+n-1)%n;SFX.ui()}
  else if(['arrowdown','s','arrowright','d'].includes(k)){G.cardSel=(G.cardSel+1)%n;SFX.ui()}
  else if(['enter',' ','j','z'].includes(k))pickCard(G.cardSel);
}
function drawPick(){
  const a=clamp(stateT/.35,0,1);dim(.82*a);g.globalAlpha=a;
  txt('STAGE '+pad2(G.wave)+' CLEAR',W/2,92,28,'#ff2f5f','center',EN,['#000',5],true);
  const R=G.res;

    txt('RANK '+R.rank,W/2-70,128,22,R.rank==='S'?'#ffd54a':'#fff','center',EN,['#000',4],true);
    txt('TIME '+R.time.toFixed(1)+'s',W/2+60,126,15,'#fff','center',EN,null,true);
    if(R.isNew&&!R.first){const fl=.6+Math.sin(stateT*8)*.4;g.globalAlpha=a*fl;txt('★ NEW RECORD ★',W/2,150,14,'#ffd54a','center',EN,['#000',3],true);g.globalAlpha=a}
    else txt('自己ベスト '+R.best.toFixed(1)+'s',W/2,150,11,'#8b93a8','center',JP,null,false,700);
    txt('撃破 '+R.kills+'　最大連撃 '+R.chain+'　制圧 '+R.cap+'マス',W/2,172,12,'#c9cfdc','center',JP,null,false,700);
  }else if(R)txt('撃破 '+R.kills+'　最大連撃 '+R.chain,W/2,140,13,'#c9cfdc','center',JP,null,false,700);
  txt('強化を1つ選べ',W/2,204,18,'#fff','center',JP,null,false,900);
  txt('死ぬと、選んだ強化はすべて失う',W/2,226,11,'#8b93a8','center',JP,null,false,700);
  G.cards.forEach((c,i)=>{
    const r=CARD_R(i),sel=!touchMode&&i===G.cardSel,l=lv(c.id),x=r.x-r.w/2,y=r.y-r.h/2;
    if(sel)glow(r.x,r.y,210,c.col,.16);
    rr(x,y,r.w,r.h,10,sel?'rgba(58,22,32,.97)':'rgba(20,20,30,.95)');
    g.strokeStyle=c.col;g.lineWidth=sel?3.5:2;rrPath(x,y,r.w,r.h,10);g.stroke();
    if(!touchMode)txt(String(i+1),x+22,r.y+8,22,c.col,'center',EN,null,true);
    txt(c.name,x+44,y+40,21,c.col,'left',JP,['#000',4],false,900);
    txt(c.max>1?'Lv '+l+' → '+(l+1):'NEW',x+r.w-14,y+30,12,'#ffd54a','right',EN,null,true);
    txt(c.desc,x+44,y+76,13,'#e6e9f0','left',JP,null,false,700);
  });
  const own=CARDS.filter(c=>lv(c.id)).map(c=>c.name+(c.max>1?lv(c.id):''));
  if(own.length){const line='所持：'+own.join(' / ');const L1=line.slice(0,30),L2=line.slice(30);txt(L1,W/2,690,11,'#c9cfdc','center',JP,null,false,700);if(L2)txt(L2,W/2,706,11,'#c9cfdc','center',JP,null,false,700)}
  txt(touchMode?'カードをタップして決定':'1・2・3キー ／ 矢印で選んでEnter',W/2,740,12,'#8b93a8','center',JP,null,false,700);
  g.globalAlpha=1;
}

/* ---------------- ステージの仕掛け ----------------
   場所（床のテーマ）ごとに1種類。殴る・撃たせる・誘い込むことで、敵をまとめて倒せる */
const GIMMICKS={
  bottle: {name:'一升瓶',      hint:'瓶を殴ると倒れて酒がこぼれ、火が付いて敵を焼く',mis:'酒の炎で敵を%n体倒せ',     n:3},
  dyn:    {name:'ダイナマイト',hint:'殴る・撃たせると爆発、近くにも誘爆（近いと自分も被弾）',mis:'ダイナマイトの爆発で敵を%n体倒せ',n:4},
  oil:    {name:'ドラム缶',    hint:'殴ると穴が開いて油が漏れ出し、引火して広く燃える',mis:'ドラム缶の炎で敵を%n体倒せ',n:3},
  car:    {name:'放置車両',    hint:'車を殴ると滑り出し、敵を撥ね飛ばす',         mis:'車で敵を%n体倒せ',          n:3},
  beam:   {name:'落下する鉄骨',hint:'影の下に敵を誘い込め——自分は避けろ',       mis:'鉄骨で敵を%n体潰せ',        n:3},
  edge:   {name:'柵のない屋上',hint:'左右の端へ吹き飛ばすと、敵は転落する',       mis:'敵を%n体突き落とせ',        n:4},
  ext:    {name:'消火器',      hint:'殴ると煙が噴き出し、中の敵は動けなくなる',   mis:'煙に巻かれた敵を%n体倒せ',  n:4}
};
const DYN_FUSE=1.55; // ダイナマイトが点火から爆発するまでの秒数（弾が当たった場合は0.45秒短い。誘爆は0.18秒）
const PROP_N={bottle:3,dyn:4,oil:2,car:2,ext:3};
let PROPS=[],SMOKES=[],WARNS=[],SHOCKS=[],SPILLS=[];
function propSpot(){
  for(let k=0;k<40;k++){const x=rand(AX0+50,AX1-50),y=rand(AY0+70,AY1-50);if(dist(x,y,P.x,P.y)>130&&PROPS.every(o=>dist(x,y,o.x,o.y)>90))return{x,y}}
  return{x:rand(AX0+50,AX1-50),y:rand(AY0+70,AY1-50)};
}
function newProp(k){const p=propSpot();return{k,x:p.x,y:p.y,r:k==='car'?24:k==='oil'?20:16,used:false,lit:false,fuse:0,t:0,vx:0,vy:0,a:k==='car'?(Math.random()<.5?0:Math.PI/2):0,hits:new Set(),fall:null}}
function setupGimmick(){
  PROPS=[];SMOKES=[];WARNS=[];SHOCKS=[];SPILLS=[];G.beamT=rand(3,5);
  G.gim=G.isBossWave?null:(theme.gim||null);
  if(G.gim&&PROP_N[G.gim])for(let i=0;i<PROP_N[G.gim];i++)PROPS.push(newProp(G.gim));
}
// 仕掛けによるダメージ（倒した数をお題で数えるため、原因を付けて当てる）
function gimHit(cause,e,dmg,ang,kb,o){const pc=G.cause;G.cause=cause;hitEnemy(e,dmg,ang,kb,o);G.cause=pc}
function hitProp(pr,ang){
  if(pr.k==='car'){pr.vx=Math.cos(ang)*560;pr.vy=Math.sin(ang)*560;pr.hits=new Set();SFX.wall();addShake(6);return}
  if(pr.used||pr.lit)return;
  if(pr.k==='dyn'){pr.lit=true;pr.fuse=DYN_FUSE;return}
  pr.used=true;pr.t=0;
  if(pr.k==='bottle'){pr.fall={a:ang,t:0,done:false};SFX.wall()}
  // ドラム缶（200L）：殴ると穴が開き、殴った方向へ黒い油が噴き出して床に広がる→少し遅れて引火（一升瓶より広く、燃える力は弱め）
  else if(pr.k==='oil'){SFX.wall();addShake(5);noise(.6,.25,'lowpass',900,200);
    for(let i=0;i<10;i++){const a=ang+rand(-.5,.5),v=rand(80,240),l=rand(.25,.5);fx({k:'oild',x:pr.x+Math.cos(ang)*12,y:pr.y+4,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:l,max:l})}
    SPILLS.push({x:pr.x+Math.cos(ang)*6,y:pr.y+Math.sin(ang)*6+8,a:ang,len:175,w:100,t:0,tick:0,dur:5,lit:false,cause:'oil',dmg:.14,grow:.95,ign:1.25,oil:true})}
  else if(pr.k==='ext'){SMOKES.push({x:pr.x,y:pr.y,r:88,t:3.5});SFX.wash();addShake(4)}
}
function dynBoom(pr){
  pr.lit=false;pr.used=true;pr.t=0;
  const pc=G.cause;G.cause='dyn';explode(pr.x,pr.y,100,false);G.cause=pc;
  if(!P.dead&&dist(pr.x,pr.y,P.x,P.y)<60)hurtPlayer(10,pr.x,pr.y);
}
function updateGimmicks(dt){
  for(const pr of PROPS){
    pr.t+=dt;
    // 使った仕掛けは、しばらくすると別の場所に置き直される
    if(pr.used&&pr.t>(pr.k==='bottle'?11:pr.k==='oil'?13:9))Object.assign(pr,newProp(pr.k));
    if(pr.lit){pr.fuse-=dt;if(pr.fuse<=0)dynBoom(pr)}
    if(pr.fall&&!pr.fall.done){pr.fall.t+=dt;if(pr.fall.t>.22){pr.fall.done=true;
      // 瓶が割れて、倒れた方向へ酒が流れ出す（長さ150・幅46の帯）。少し遅れて火が付く
      SFX.glass();for(let i=0;i<10;i++){const a=pr.fall.a+rand(-.8,.8),v=rand(60,200),l=rand(.2,.4);fx({k:'drop',x:pr.x+Math.cos(pr.fall.a)*20,y:pr.y+Math.sin(pr.fall.a)*20,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:l,max:l})}
      SPILLS.push({x:pr.x,y:pr.y,a:pr.fall.a,len:150,w:46,t:0,tick:0,dur:5,lit:false,cause:'bottle',dmg:.22,grow:.45})}}
    if(pr.k==='car'){const v=Math.hypot(pr.vx,pr.vy);if(v>20){
      pr.x+=pr.vx*dt;pr.y+=pr.vy*dt;const f=Math.exp(-2.2*dt);pr.vx*=f;pr.vy*=f;pr.a=Math.atan2(pr.vy,pr.vx);
      if(pr.x<AX0+pr.r){pr.x=AX0+pr.r;pr.vx=Math.abs(pr.vx)*.5}else if(pr.x>AX1-pr.r){pr.x=AX1-pr.r;pr.vx=-Math.abs(pr.vx)*.5}
      if(pr.y<AY0+pr.r){pr.y=AY0+pr.r;pr.vy=Math.abs(pr.vy)*.5}else if(pr.y>AY1-pr.r){pr.y=AY1-pr.r;pr.vy=-Math.abs(pr.vy)*.5}
      if(v>140)for(const e of [...E]){if(pr.hits.has(e))continue;if(dist(pr.x,pr.y,e.x,e.y)<pr.r+e.r){pr.hits.add(e);gimHit('car',e,e.armor?6:e.hp+1,Math.atan2(e.y-pr.y,e.x-pr.x),560,{fin:true});popText(e.x,e.y-30,'撥ねた！','#ffd54a',14,.6)}}
    }}
  }
  for(const sm of SMOKES){sm.t-=dt;for(const e of E)if(dist(sm.x,sm.y,e.x,e.y)<sm.r){if(!e.boss)e.stun=Math.max(e.stun,.2);e.smoked=1.2}}
  SMOKES=SMOKES.filter(sm=>sm.t>0);
  for(const sp of SPILLS){sp.t+=dt;const L=sp.len*Math.min(1,sp.t/sp.grow),c=Math.cos(sp.a),sn=Math.sin(sp.a);
    if(sp.oil&&!sp.lit&&Math.random()<.8){const a=sp.a+rand(-.35,.35),v=rand(90,200),l=rand(.2,.4);fx({k:'oild',x:sp.x,y:sp.y-6,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:l,max:l})}
    if(!sp.lit&&sp.t>(sp.ign||.75)){sp.lit=true;SFX.boom();addShake(7);popText(sp.x+c*L*.5,sp.y+sn*L*.5-20,'着火！','#ffb040',16,.8);
      for(let l=0;l<L;l+=12){const v=rand(40,120),q=rand(-1,1);fx({k:'fire',x:sp.x+c*l,y:sp.y+sn*l,vx:-sn*v*q,vy:c*v*q-60,life:.5,max:.5,sz:rand(10,18)})}}
    if(sp.lit){if(Math.random()<.9*sp.w/46){const l=rand(0,L),q=rand(-.4,.4)*sp.w;fx({k:'fire',x:sp.x+c*l-sn*q,y:sp.y+sn*l+c*q,vx:rand(-10,10),vy:rand(-80,-40),life:.5,max:.5,sz:rand(6,12)})}
      sp.tick-=dt;if(sp.tick<=0){sp.tick=.4;for(const e of [...E]){const rx=e.x-sp.x,ry=e.y-sp.y,al=rx*c+ry*sn,sd=Math.abs(-rx*sn+ry*c);
        if(al>-14&&al<L+8&&sd<sp.w/2+e.r*.6)gimHit(sp.cause,e,e.boss?.4:e.max*sp.dmg,0,0,{})}}}}
  SPILLS=SPILLS.filter(sp=>sp.t<sp.dur);
  for(const e of E)if(e.smoked>0)e.smoked-=dt;
  // 廃工場：一定間隔で鉄骨が落ちてくる（影で予告。敵の近くを狙いやすい）
  if(G.gim==='beam'&&G.phase==='fight'){G.beamT-=dt;if(G.beamT<=0){G.beamT=rand(3.5,5.5);
    const tg=E.length&&Math.random()<.7?pick(E):null;
    WARNS.push({x:tg?clamp(tg.x,AX0+40,AX1-40):rand(AX0+40,AX1-40),y:tg?clamp(tg.y,AY0+50,AY1-40):rand(AY0+60,AY1-40),r:44,t:0,dur:1.4,a:rand(0,Math.PI),done:false})}}
  for(const w of WARNS){w.t+=dt;if(w.t>=w.dur&&!w.done){w.done=true;addShake(16);SFX.boom();scorch(w.x,w.y,40);
    RINGS.push({x:w.x,y:w.y,r:10,R:w.r*1.4,t:0,dur:.3,col:'210,210,220',w:8});
    for(const e of [...E])if(dist(w.x,w.y,e.x,e.y)<w.r+e.r*.6)gimHit('beam',e,e.armor?8:99,Math.atan2(e.y-w.y,e.x-w.x),200,{fin:true});
    if(!P.dead&&dist(w.x,w.y,P.x,P.y)<w.r+P.r*.4)hurtPlayer(20,w.x,w.y-1)}}
  WARNS=WARNS.filter(w=>w.t<w.dur+1.2);
  // 衝撃波（強化カード）：広がる輪に触れた敵を吹き飛ばし、敵弾を弾き返す
  for(const sh of SHOCKS){sh.r+=560*dt;
    for(const e of [...E]){if(sh.hit.has(e))continue;if(Math.abs(dist(sh.x,sh.y,e.x,e.y)-sh.r)<24+e.r){sh.hit.add(e);hitEnemy(e,1.26*powMul(),Math.atan2(e.y-sh.y,e.x-sh.x),400,{fin:true})}}
    for(const b of B)if(!b.friendly&&Math.abs(dist(sh.x,sh.y,b.x,b.y)-sh.r)<20)reflect(b)}
  SHOCKS=SHOCKS.filter(sh=>sh.r<sh.R);
}
function drawGimmicks(){
  for(const w of WARNS){
    if(!w.done){const p=clamp(w.t/w.dur,0,1),rr_=w.r*(1.3-p*.3);
      g.fillStyle=`rgba(0,0,0,${.25+p*.4})`;g.beginPath();g.ellipse(w.x,w.y,rr_,rr_*.6,0,0,TAU);g.fill();
      g.strokeStyle=`rgba(255,200,60,${.5+Math.sin(G.time*20)*.3})`;g.lineWidth=2;g.setLineDash([6,5]);g.beginPath();g.arc(w.x,w.y,w.r,0,TAU);g.stroke();g.setLineDash([]);
      if(p>.55){const fy=w.y-(1-p)*420;g.save();g.translate(w.x,fy);g.rotate(w.a);rr(-52,-9,104,18,2,'#6a707c');g.restore()}}
    else{g.globalAlpha=1-clamp((w.t-w.dur)/1.2,0,1);g.save();g.translate(w.x,w.y);g.rotate(w.a);rr(-52,-9,104,18,2,'#6a707c');g.strokeStyle='#2a2d33';g.lineWidth=2;g.strokeRect(-52,-9,104,18);g.restore();g.globalAlpha=1}
  }
  for(const sp of SPILLS){const L=sp.len*Math.min(1,sp.t/sp.grow),f=Math.min(1,(sp.dur-sp.t)/.6);g.save();g.translate(sp.x,sp.y);g.rotate(sp.a);g.globalAlpha=f;
    rr(0,-sp.w/2,L,sp.w,sp.w/2,sp.lit?'rgba(255,110,20,.28)':sp.oil?'rgba(24,16,10,.72)':'rgba(190,130,40,.5)');
    if(sp.oil&&!sp.lit){g.fillStyle='rgba(150,110,200,.16)';g.fillRect(L*.15,-sp.w*.18,L*.6,sp.w*.12);g.fillStyle='rgba(90,200,170,.1)';g.fillRect(L*.25,sp.w*.05,L*.5,sp.w*.08)}
    g.restore();g.globalAlpha=1;
    if(sp.lit){const c=Math.cos(sp.a),sn=Math.sin(sp.a);for(let l=10;l<L;l+=36)glow(sp.x+c*l,sp.y+sn*l,sp.w*.85,'#ff6a1a',.32*f)}}
  for(const pr of PROPS){
    const ready=!pr.used&&!pr.lit&&pr.k!=='car';
    if(ready){const pl=.25+Math.sin(G.time*4+pr.x)*.15;g.strokeStyle=`rgba(255,255,255,${pl})`;g.lineWidth=1.2;g.beginPath();g.arc(pr.x,pr.y,pr.r+9,0,TAU);g.stroke()}
    if(pr.k==='dyn'){if(pr.used)continue;
      // ダイナマイト1本：赤い筒＋導火線。点火すると導火線の先が火花を散らし、本体が点滅する
      shadow(pr.x,pr.y+6,12);g.save();g.translate(pr.x,pr.y);g.rotate(-.5);
      const on=pr.lit&&Math.floor(G.time*16)%2;rr(-6,-14,12,28,4,on?'#ffd0a0':'#c8201c');g.fillStyle='rgba(255,255,255,.25)';g.fillRect(-4,-12,2.5,24);
      g.fillStyle='#2a1810';g.fillRect(-6,-6,12,2);g.fillRect(-6,4,12,2);
      g.strokeStyle='#d8c8a0';g.lineWidth=1.6;g.beginPath();g.moveTo(0,-14);g.quadraticCurveTo(5,-20,2,-25);g.stroke();
      if(pr.lit){glow(2,-25,18,'#ffb030',.9);circ(2,-25,2.2,'#fff3b0')}
      g.restore()}
    else if(pr.k==='bottle'){
      const bottle=()=>{rr(-9,-12,18,30,5,'#1f5a32');rr(-4,-26,8,15,3,'#1f5a32');rr(-5,-29,10,4,1.5,'#c9a24a');rr(-7,-3,14,12,2,'#efe6cf');g.fillStyle='rgba(255,255,255,.25)';g.fillRect(-6,-10,3,24);rr(-5,1,10,3,1,'#b01818')};
      if(!pr.fall){shadow(pr.x,pr.y+16,13);g.save();g.translate(pr.x,pr.y);bottle();g.restore()}
      else{const p=clamp(pr.fall.t/.22,0,1),fade=1-clamp((pr.t-8)/2,0,1);g.globalAlpha=fade;g.save();g.translate(pr.x,pr.y);g.rotate(angDiff(0,pr.fall.a+Math.PI/2)*p);bottle();g.restore();g.globalAlpha=1}}
    else if(pr.k==='oil'){
      // 200Lドラム缶を横から見た形：赤い胴・補強の帯2本・上の縁・黄色い「火気注意」の菱形。穴が開くと少し傾いて残り、やがて消える
      const f=pr.used?1-clamp((pr.t-9)/2,0,1):1;if(f<=0)continue;
      g.globalAlpha=f;shadow(pr.x,pr.y+17,15);g.save();g.translate(pr.x,pr.y);if(pr.used)g.rotate(.14);
      rr(-13,-17,26,34,4,'#b0261c');g.fillStyle='rgba(255,255,255,.2)';g.fillRect(-10,-14,3.5,28);
      g.fillStyle='#6e140e';g.fillRect(-13,-8,26,2.5);g.fillRect(-13,6,26,2.5);
      g.fillStyle='#8c1c14';g.beginPath();g.ellipse(0,-17,13,3.6,0,0,TAU);g.fill();g.strokeStyle='#4a0c08';g.lineWidth=1.4;g.stroke();
      g.save();g.translate(0,-.5);g.rotate(Math.PI/4);g.fillStyle='#f2c21a';g.fillRect(-4.2,-4.2,8.4,8.4);g.restore();
      g.fillStyle='#c0261c';g.beginPath();g.moveTo(0,-3.6);g.quadraticCurveTo(3,.2,0,2.8);g.quadraticCurveTo(-3,.2,0,-3.6);g.fill();
      if(pr.used){circ(Math.cos(.1)*6,3,2.4,'#140a05')}
      g.restore();g.globalAlpha=1}
    else if(pr.k==='car'){shadow(pr.x,pr.y+6,26);g.save();g.translate(pr.x,pr.y);g.rotate(pr.a);rr(-27,-15,54,30,7,'#3d5168');rr(-8,-12,18,24,4,'#1a2330');rr(14,-12,7,24,3,'#253244');

/* ---------------- 囲い込み制圧 ----------------
   塗ったマスでぐるりと囲まれ、外周に通じていない未塗りの領域は、一気に血で染まる。
   3マス以上の制圧では、中にいた雑魚も血の海に沈む（用心棒・ボスには大ダメージ） */
// 判定するのは「今塗られたマス」の上下左右から始まる未塗り領域だけ。
// 掃除屋が塗り地帯の中に開けた穴は、プレイヤーがその隣を塗って閉じるまで穴のまま残る
let capNew=[],capFilling=false;
function captureCheck(){
  const starts=capNew;capNew=[];if(G.isBossWave||G.phase!=='fight'||state!=='play')return;
  const seen=new Uint8Array(GN),regions=[],from=[];
  for(const i of starts){const cx=i%GC,cy=(i/GC)|0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx>=0&&ny>=0&&nx<GC&&ny<GR)from.push(ny*GC+nx)}}
  for(const i of from){if(DONE[i]||seen[i])continue;
    const comp=[],st=[i];seen[i]=1;let edge=false;
    while(st.length){const j=st.pop();comp.push(j);const cx=j%GC,cy=(j/GC)|0;if(cx===0||cy===0||cx===GC-1||cy===GR-1)edge=true;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=GC||ny>=GR)continue;const k=ny*GC+nx;if(!DONE[k]&&!seen[k]){seen[k]=1;st.push(k)}}}
    if(!edge)regions.push(comp);
  }
  for(const r of regions){if(G.phase!=='fight')break;capture(r)}
}
// 制圧は、輪を閉じたマスの隣から波紋のように順番に染まっていく（中の敵は波が届いた瞬間に倒れる）
let CAPQ=[];
function capture(tiles){
  const n=tiles.length,set=new Set(tiles);let sx=0,sy=0;G.wcap=(G.wcap||0)+n;
  for(const j of tiles){const t=tileRect(j);sx+=t.x+t.w/2;sy+=t.y+t.h/2}
  const cx=sx/n,cy=sy/n,dd=new Map([[tiles[0],0]]),q=[tiles[0]];
  while(q.length){const j=q.shift(),x=j%GC,y=(j/GC)|0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const k=(y+dy)*GC+(x+dx);if(x+dx<0||x+dx>=GC||y+dy<0||y+dy>=GR||!set.has(k)||dd.has(k))continue;dd.set(k,dd.get(j)+1);q.push(k)}}
  for(const j of tiles){const k=dd.get(j)||0;CAPQ.push({i:j,at:G.time+k*.045,k,n,cx,cy})}
  const pts=100*n*G.wave;G.score+=pts;misAdd('capture',null,n);if(G.tut&&G.tut.step===2&&!G.tut.capQueued){G.tut.capQueued=true;setTimeout(tutNext,600)}
  if(n>=3){
    callout('制 圧 ！',n+'マスを一気に血で染めた　+'+pts,'#ff2f5f');G.callout.dur=1.6;
    SFX.boom();SFX.tile();addShake(Math.min(22,8+n));G.flash=Math.max(G.flash,.3);G.flashCol='255,20,50';G.hitstop=Math.max(G.hitstop,.06);
    RINGS.push({x:cx,y:cy,r:10,R:Math.sqrt(n)*TS*.75+40,t:0,dur:.45,col:'255,40,70',w:12});
    for(const j of tiles){const t=tileRect(j);bloodBurst(t.x+t.w/2,t.y+t.h/2,rand(0,TAU),4,200)}
  }else popText(cx,cy,'制圧 +'+pts,'#ff6a80',14,.8);
}
function updateCapQ(){
  if(!CAPQ.length)return;if(G.phase!=='fight'){CAPQ=[];return}
  CAPQ=CAPQ.filter(q=>{
    if(q.at>G.time)return true;
    if(!DONE[q.i]){capFilling=true;fillTile(q.i);capFilling=false}
    if(q.n>=3&&Math.random()<.5)tone(240+q.k*45,360+q.k*60,.07,'triangle',.06);
    for(const e of [...E]){if(tileAt(e.x,e.y)!==q.i)continue;const a=Math.atan2(e.y-q.cy,e.x-q.cx);
      if(q.n>=3)hitEnemy(e,e.boss?6:e.armor?6:e.hp+1,a,420,{fin:true});else hitEnemy(e,2,a,260,{})}
    return false;
  });
}
// 塗りの進み具合が25%・50%・75%を超えたら告知（演出のみ。75%からはBGMも激しくなる）
function checkMilestones(){

const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

// 導入の手順（ステージ1：①〜⑥、ステージ2：⑦）。操作の説明はスマホ／PCで出し分ける
const TUT_STEPS=7;
const tutText=st=>({1:['① 塗る','敵を倒すと、血で床が染まる。まず3マス塗ってみよう'],2:['② 囲う','光るマスを塗って輪を閉じろ。囲んだ中が一気に染まる'],

function tutWave(n){
  if(!G.tutMode||n!==1){G.tut=null;return}
  G.tut={step:1,t:0,gap:-1};G.mis=null;

function tutNext(){const T_=G.tut;if(!T_)return;T_.step++;T_.t=0;T_.foe=null;SFX.ui();
  if(T_.step===2)tutRing();else if(T_.step===3){P.hp=Math.min(P.hp,P.maxhp*.7);tutFoe('grunt',110)}else if(T_.step===4)tutFoe('gunner',230);
  else if(T_.step===5){G.soul=100;for(let k=0;k<4;k++){const a=k/4*TAU+.4;tutFoe('grunt',140,a)}}
  else if(T_.step===6){G.crewOut=true;queueSpawn('cleaner','mop');queueSpawn('cleaner','mop')}}
// 手順fromの達成から少し間を置いて次へ（同じ手順で何度呼ばれても1回だけ進む）
function tutLater(from,ms){const T_=G.tut;if(!T_||T_.step!==from||T_.later===from)return;T_.later=from;setTimeout(()=>{if(G.tut&&G.tut.step===from)tutNext()},ms)}
// 練習用の敵を、主人公の前方（または指定の向き）に出す
function tutFoe(type,d,a){
  const an=a==null?P.face:a,x=clamp(P.x+Math.cos(an)*d,AX0+30,AX1-30),y=clamp(P.y+Math.sin(an)*d,AY0+40,AY1-30);
  const e=makeEnemy(type,x,y);e.state='chase';if(type==='gunner'){e.cd=.6;G.aimer=null;G.shotGap=0}if(a==null)G.tut.foe=e;return e;
}
// 囲いの練習用に、内側2×2・外周8マスのうち7マスを塗った輪を用意する（残り1マスが光る）
function tutRing(){
  let best=null,bd=1e9;
  for(let r=2;r<=GR-4;r++)for(let c=2;c<=GC-4;c++){
    const inn=[[c,r],[c+1,r],[c,r+1],[c+1,r+1]].map(([x,y])=>y*GC+x);if(inn.some(i=>DONE[i]))continue;
    const t=tileRect(inn[0]),cx=t.x+TS,cy=t.y+TS,d=Math.abs(dist(cx,cy,P.x,P.y)-170);if(d<bd){bd=d;best=[c,r]}
  }
  if(!best){G.tut.step=3;return}
  const [c,r]=best,ring=[[c-1,r],[c-1,r+1],[c+2,r],[c+2,r+1],[c,r-1],[c+1,r-1],[c,r+2],[c+1,r+2]].map(([x,y])=>y*GC+x);
  let gap=ring[0],gd=1e9;for(const i of ring){const t=tileRect(i),d=dist(t.x+t.w/2,t.y+t.h/2,P.x,P.y);if(d<gd&&!DONE[i]){gd=d;gap=i}}
  capFilling=true;for(const i of ring)if(i!==gap&&!DONE[i])fillTile(i);capFilling=false;
  G.tut.gap=gap;G.tut.ring=ring;const g_=tileRect(gap);
  for(let k=0;k<2;k++){const e=makeEnemy('grunt',g_.x+g_.w/2+rand(-30,30),g_.y+g_.h/2+rand(-30,30));e.state='chase'}
}
function updateTut(dt){
  const T_=G.tut;if(!T_)return;T_.t+=dt;
  if(T_.step===1&&painted>=3&&T_.t>1)tutNext();
  if(T_.step===2&&T_.gap>=0&&DONE[T_.gap]&&!T_.ringDone){T_.ringDone=true}
  // 練習相手を先に倒してしまったら出し直す
  if((T_.step===3||T_.step===4)&&T_.t>1&&(!T_.foe||T_.foe.dead))tutFoe(T_.step===3?'grunt':'gunner',T_.step===3?110:230);
  if(T_.step===5&&G.soul<100&&T_.t>1)G.soul=100;
  // 練習中は床が埋まってもクリアを待たせ、⑥に来た時点でクリアにする
  if(T_.step===6&&T_.t>1.5&&!E.some(e=>e.type==='cleaner')&&!MARKS.some(m=>m.type==='cleaner'))tutNext();
  if(T_.step===7&&painted>=GN&&G.phase==='fight')waveClear();
}

const inp={kx:0,ky:0,tx:0,ty:0,px:0,py:0,stick:null,sx:0,sy:0,atkKey:false,atkMouse:false,padAtk:false,

function guarding(){const held=inp.guardKey||inp.guardMouse||inp.guardTouch!=null||inp.padGuard;if(!held)P.guardLock=false;return held&&!P.guardLock}

function mouseBtn(ev){const a=!!(ev.buttons&1),gd=!!(ev.buttons&2);if(a&&!inp.atkMouse)pressAttack();inp.atkMouse=a;inp.guardMouse=gd}
const SCR={endless:{x:W/2,y:612,w:260,h:52},title:{x:W/2,y:682,w:260,h:44},ptitle:{x:W/2,y:560,w:240,h:46},tstart:{x:W/2,y:522,w:250,h:46},ttut:{x:W/2,y:578,w:250,h:40}};
const inC=(p,c,pad)=>Math.hypot(p.x-c.x,p.y-c.y)<c.r+(pad||0);
const inR=(p,r)=>Math.abs(p.x-r.x)<r.w/2&&Math.abs(p.y-r.y)<r.h/2;
function toLocal(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left)*W/r.width,y:(ev.clientY-r.top)*H/r.height}}
// a: 攻撃する向き（タッチでタップした方向）。省略時は移動入力／今の向き
function pressAttack(a){P.atkBuf=.25;P.atkA=a==null?null:a}
function screenAction(p,key){
  if(state==='pick'){if(p){const i=cardAt(p);if(i>=0)pickCard(i)}else pickCard(G.cardSel);return}
  // タイトル：音がまだ鳴らせない状態なら、最初の1回は「音をONにするだけ」（BGMを聴かせるため）。2回目で開始
  if(state==='title'){if(!muted&&!(AC&&AC.state==='running')&&!G.titleTap){G.titleTap=1;return}
    if(p){if(inR(p,SCR.tstart))newGame(false);else if(inR(p,SCR.ttut))newGame(true);return}
    newGame(key==='tut');return}
  if(state==='over'){if(stateT>.9)newGame(G.tutMode);return}
  if(state==='pause'){
    if((p&&inR(p,SCR.ptitle))||key==='title'){state='title';stateT=0;resetRun();return}
    state='play';return;
  }
  if(state==='clear'){
    if(stateT<1.2)return;
    if((p&&inR(p,SCR.title))||key==='title'){state='title';stateT=0;resetRun();return}
    if(!p||inR(p,SCR.endless)||key==='go')goEndless();

const TOUCH=new Map(),TOUCH_HOLD=230,STICK_R=44;

  }

function doHit(a){

  }

  for(const pr of PROPS){const d=dist(P.x,P.y,pr.x,pr.y);if(d>range+pr.r)continue;const an=Math.atan2(pr.y-P.y,pr.x-P.x);
    if(S.arc<TAU&&Math.abs(angDiff(P.face,an))>S.arc/2&&d>pr.r+P.r+4)continue;hitProp(pr,an);n++}
  if(n>0){G.hitstop=Math.max(G.hitstop,Math.min(.025,G.chain/2400)+S.stop+(a.crit?.08:0)+Math.min(n-1,4)*.012);addShake(S.shake*(a.crit?1.6:1));if(fin)G.zoom=Math.max(G.zoom,.035)}
  if(a.st===3&&lv('shock'))SHOCKS.push({x:P.x,y:P.y,r:range*.6,R:range+63,hit:new Set()});

}
// 怨念解放：一撃の必殺技。周囲の雑魚を一掃し、敵弾を弾き返し、足元一帯を一気に血で染める（持続する強化は無し）

/* ---------------- enemies ---------------- */
const inside=e=>e.x>AX0+e.r&&e.x<AX1-e.r&&e.y>AY0+e.r&&e.y<AY1-e.r;
// 同時に近接攻撃（構え・斬りかかり中）しているチンピラ・走り屋の数
const MAX_MELEE=3;
// WAVE1だけ易しく：敵の出現数と攻撃の頻度を75%に（同時に出る数の上限×0.75と出現間隔×1.15で、画面上の数が約75%に。攻撃は1サイクル全体が÷0.75の長さになるよう休みを延ばす）
const waveEase=()=>G.wave===1?.75:1;
function meleeBusy(){let n=0;for(const o of E)if((o.type==='grunt'||o.type==='runner')&&(o.state==='windup'||o.state==='strike'))n++;return n}
function mv(e,a,s,dt){e.x+=Math.cos(a)*s*dt;e.y+=Math.sin(a)*s*dt;e.walk+=s*dt*.13}
function wallCheck(e,sp){
  let hit=false,nx=0,ny=0;
  if(e.x<AX0+e.r){e.x=AX0+e.r;hit=true;nx=1}else if(e.x>AX1-e.r){e.x=AX1-e.r;hit=true;nx=-1}
  if(e.y<AY0+e.r){e.y=AY0+e.r;hit=true;ny=1}else if(e.y>AY1-e.r){e.y=AY1-e.r;hit=true;ny=-1}
  if(!hit)return false;
  // 屋上：左右の端へ強く吹き飛ばされた敵は転落する
  if(nx&&G.gim==='edge'&&!e.boss&&sp>260){const pc=G.cause;G.cause='edge';popText(e.x,e.y-30,'転落！','#ffd54a',17,.9);G.score+=Math.round(150*G.mult);killEnemy(e,Math.atan2(0,-nx),0,{fall:true});G.cause=pc;return true}
  if(nx)e.vx=Math.abs(e.vx)*nx*.35;if(ny)e.vy=Math.abs(e.vy)*ny*.35;
  if(e.fly>0&&sp>360){
    e.fly=0;splat(e.x-nx*e.r,e.y-ny*e.r,e.r*1.4,Math.atan2(-ny,-nx));addShake(8);SFX.wall();
    const pts=Math.round(30*G.mult);G.score+=pts;popText(e.x,e.y-26,'WALL HIT!','#ffb44a',13,.6);
    hitEnemy(e,2,Math.atan2(ny,nx),120,{wall:true});
  }
  return true;
}
function bowl(e,sp){
  for(const o of [...E]){
    if(o===e||e.bset.has(o))continue;
    if(dist(e.x,e.y,o.x,o.y)<e.r+o.r+2){
      e.bset.add(o);const a=Math.atan2(o.y-e.y,o.x-e.x);G.score+=Math.round(50*G.mult);
      popText(o.x,o.y-26,'CRASH!','#ffd54a',13,.6);misAdd('crash');hitEnemy(o,2.5,a,sp*.8,{fin:sp>600});e.vx*=.7;e.vy*=.7;
    }
  }
}
function updateEnemy(e,dt){
  e.flash-=dt;e.st+=dt;e.fly-=dt;
  const sp=Math.hypot(e.vx,e.vy);
  if(sp>1){e.x+=e.vx*dt;e.y+=e.vy*dt;const f=Math.exp(-(e.armor?10:6.5)*dt);e.vx*=f;e.vy*=f}
  if(e.fly>0&&sp>330&&e.bset)bowl(e,sp);
  if(e.dead)return;
  if(e.state!=='enter'&&e.state!=='charge')wallCheck(e,sp);
  if(e.stun>0){e.stun-=dt;return}
  const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1,toP=Math.atan2(dy,dx);
  if(e.state==='enter'){e.ang=turn(e.ang,toP,10*dt);mv(e,toP,Math.max(e.spd,80),dt);if(inside(e))e.state='chase';return}
  if(P.dead){if(e.state!=='chase'){e.state='chase'}e.ang=turn(e.ang,toP+Math.PI,3*dt);return}
  if(e.boss){updateBoss(e,dt,d,toP);return}
  switch(e.type){
    case 'grunt':case 'runner':{
      const run=e.type==='runner',reach=run?56:50;
      if(e.state==='chase'){e.ang=turn(e.ang,toP,10*dt);
        if(d>reach+(e.wait?22:0))mv(e,toP,e.spd,dt);
        else if(meleeBusy()<MAX_MELEE){e.state='windup';e.st=0;e.wait=false}
        else{
          // 囲み過ぎ防止：同時に斬りかかれるのはMAX_MELEE体まで。順番待ちの敵は少し距離を取って周りを回る
          e.wait=true;const sa=toP+Math.PI/2*(e.v?1:-1);mv(e,sa,e.spd*.45,dt);if(d<reach+14)mv(e,toP+Math.PI,e.spd*.5,dt);
          if(Math.random()<dt*.4)e.v^=1;
        }}
      else if(e.state==='windup'){e.ang=turn(e.ang,toP,6*dt);e.aim=e.ang;if(e.st>(run?.26:.32)){e.state='strike';e.st=0;e.hitDone=false;const ls=run?470:380;e.vx=Math.cos(e.aim)*ls;e.vy=Math.sin(e.aim)*ls}}
      else if(e.state==='strike'){if(!e.hitDone&&d<e.r+P.r+16&&Math.abs(angDiff(e.aim,toP))<1.4){e.hitDone=true;hurtPlayer(e.dmg,e.x,e.y)}if(e.st>.2){e.state='recover';e.st=0}}
      else if(e.state==='recover'){const rc=run?.35:.5;if(e.st>rc+((run?.26:.32)+.2+rc)*(1/waveEase()-1))e.state='chase'}
      break;
    }
    case 'gunner':{

const GRAB_RATE=.3; // 掴める間合いに入った時に掴みを選ぶ確率

      e.state='grabEnd';e.st=0;

    return true;
  }
  if(e.state==='grabEnd'){if(e.st>.55){e.state='chase';e.grabCD=1.5}return true}
  // 間合いに入って次の攻撃を選ぶたびに1回だけ抽選し、3割で掴む（外れたら通常の攻撃）
  if(e.state!=='chase')e.grabRolled=false;

  for(const b of B){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    for(const pr of PROPS)if(pr.k==='dyn'&&!pr.used&&!pr.lit&&dist(b.x,b.y,pr.x,pr.y)<pr.r+4){pr.lit=true;pr.fuse=DYN_FUSE-.45;b.life=0}
    if(b.rocket){
      if(Math.random()<.6)fx({k:'smoke',x:b.x-b.vx*.04,y:b.y-b.vy*.04,vx:rand(-20,20),vy:rand(-20,20),life:.5,max:.5,sz:rand(6,11)});
      // 壁や寿命で爆発
      if(b.x<AX0||b.x>AX1||b.y<AY0||b.y>AY1||b.life<=0){b.life=0;explode(clamp(b.x,AX0,AX1),clamp(b.y,AY0,AY1),75,!b.friendly);continue}
    }
    if(b.friendly&&b.rocket){
      // 弾き返したロケット：最初に触れた敵の位置で大爆発
      const tr=b.trail||(b.trail=[]);tr.push({x:b.x,y:b.y});if(tr.length>10)tr.shift();
      for(const e of E){if(dist(b.x,b.y,e.x,e.y)<e.r+12){b.life=0;
        explode(b.x,b.y,b.perfect?130:105,false);
        for(const e2 of E)if(e2.boss&&dist(b.x,b.y,e2.x,e2.y)<130+e2.r)hitEnemy(e2,b.perfect?14:8,Math.atan2(e2.y-b.y,e2.x-b.x),300,{fin:true});
        popText(b.x,b.y-30,'ROCKET RETURN!!',b.perfect?'#ffd54a':'#ff9a40',21,1);G.score+=500;G.flash=Math.max(G.flash,.4);addShake(20);G.zoom=Math.max(G.zoom,.05);
        break}}
    }
    else if(b.friendly){
      const tr=b.trail||(b.trail=[]);tr.push({x:b.x,y:b.y});if(tr.length>10)tr.shift();
      for(const e of [...E]){
        if(b.hits&&b.hits.has(e))continue;if(dist(b.x,b.y,e.x,e.y)>=e.r+8)continue;
        const kill=!e.armor&&!e.boss;if(b.hits)b.hits.add(e);
        hitEnemy(e,kill?e.hp+1:(b.big?16:4)*(b.perfect?2:1),Math.atan2(b.vy,b.vx),520,{fin:true});
        if(!kill||b.noPierce){b.life=0;if(kill)popText(e.x,e.y-28,'SHOT KILL',b.perfect?'#ffd54a':'#7ff3ff',15,.8);break}
        b.kills=(b.kills||0)+1;G.score+=150*b.kills;G.hitstop=Math.max(G.hitstop,.06);G.zoom=Math.max(G.zoom,.03);addShake(9);
        popText(e.x,e.y-28,b.kills>1?'PIERCE ×'+b.kills:'SHOT KILL',b.perfect?'#ffd54a':'#7ff3ff',b.kills>1?19:15,.8);
      }
    }
    else if(!P.dead&&dist(b.x,b.y,P.x,P.y)<P.r+(b.big?9:5)){
      if(P.inv<=0){hurtPlayer(b.dmg,b.x-b.vx*.1,b.y-b.vy*.1);b.life=0;if(b.rocket)explode(b.x,b.y,70,false)}
    }
  }
  B=B.filter(b=>b.life>0&&b.x>-30&&b.x<W+30&&b.y>AY0-30&&b.y<H+30);
  // orbs
  for(const o of ORBS){
    o.t+=dt;const f=Math.exp(-5*dt);o.vx*=f;o.vy*=f;
    const d=dist(o.x,o.y,P.x,P.y),a=Math.atan2(P.y-o.y,P.x-o.x);
    if(!P.dead&&d<120){o.vx+=Math.cos(a)*1400*dt;o.vy+=Math.sin(a)*1400*dt}
    o.x+=o.vx*dt;o.y+=o.vy*dt;
    if(!P.dead&&d<P.r+8){o.got=true;healP(10);SFX.heal()}
  }
  ORBS=ORBS.filter(o=>!o.got&&o.t<12);
  // fx
  for(const f of FX){
    f.life-=dt;f.x+=f.vx*dt||0;f.y+=f.vy*dt||0;
    if(f.k==='b'){const k=Math.exp(-7*dt);f.vx*=k;f.vy*=k;if(f.life<=0&&Math.random()<.25){decG.fillStyle='rgba(110,0,15,.6)';decG.beginPath();decG.arc(f.x,f.y,f.sz*.7,0,TAU);decG.fill();paint(f.x,f.y,5,.04)}}
    else if(f.k==='fire'||f.k==='smoke'||f.k==='gold'){const k=Math.exp(-4*dt);f.vx*=k;f.vy*=k}
  }
  FX=FX.filter(f=>f.life>0);
  for(const r of RINGS)r.t+=dt;RINGS=RINGS.filter(r=>r.t<r.dur);
  for(const t of TEXTS){t.t+=rdt;t.y+=t.vy*rdt;t.vy*=Math.exp(-3*rdt);if(t.follow){t.x=t.follow.x;t.y=t.follow.y-t.follow.r-30}}
  TEXTS=TEXTS.filter(t=>t.t<t.dur);
  updateWave(dt);
}

/* ---------------- drawing helpers ---------------- */
// プレイ中の文字は一段階大きく（TXT_SCALE倍）。画面からはみ出す長さの文字は、画面内に収まるよう横幅を詰めて描く
let TXT_SCALE=1;
function txt(s,x,y,size,col,align,font,stroke,italic,weight,fitW){
  align=align||'left';
  g.font=(italic?'italic ':'')+(weight||900)+' '+(size*TXT_SCALE)+'px '+(font||EN);g.textAlign=align;g.textBaseline='alphabetic';
  // 原点を動かして描いている文字（中央の大きな告知・コンボ数など）は、x が画面の座標ではないので詰めない
  const tf=g.getTransform(),moved=Math.abs(tf.e/(cv.width/W))>20||Math.abs(tf.f/(cv.height/H))>20;
  const mw=fitW||(moved?undefined:align==='center'?Math.max(40,2*Math.min(x,W-x)-12):align==='right'?Math.max(40,x-6):Math.max(40,W-x-6));
  if(stroke){g.lineJoin='round';g.lineWidth=stroke[1];g.strokeStyle=stroke[0];mw?g.strokeText(s,x,y,mw):g.strokeText(s,x,y)}
  g.fillStyle=col;mw?g.fillText(s,x,y,mw):g.fillText(s,x,y);
}
function rrPath(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function rr(x,y,w,h,r,col){g.fillStyle=col;rrPath(x,y,w,h,r);g.fill()}
function circ(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}
function shadow(x,y,r){g.fillStyle='rgba(0,0,0,.45)';g.beginPath();g.ellipse(x,y+r*.35,r*1.15,r*.62,0,0,TAU);g.fill()}

// 主人公スプライト（画像/ゾンビ少女アニメーション素材集-1.png から切り出し、埋め込み済み）
const AS=window.DG_ASSETS||null;
const SPR=new Image(),FULL=new Image(),FACE=new Image();
if(AS){SPR.src=AS.atlas;FULL.src=AS.full;FACE.src=AS.face}
const imgOK=im=>im.complete&&im.naturalWidth>0;
// 素材はアニメごとに描かれた大きさが違うので、身長がそろうようにアニメ別の倍率をかける（切り出し時に計算済み）
const SH=64,SPRSC=(AS&&AS.scale)||{};
const TMP=document.createElement('canvas');TMP.width=TMP.height=256;const tg=TMP.getContext('2d');
function dirOf(a){const c=Math.cos(a),s=Math.sin(a);return Math.abs(c)>=Math.abs(s)*.85?(c>0?'right':'left'):(s>0?'down':'up')}
// 足元(x,y)を基準に1フレーム描く。tintで色を被せる（被弾フラッシュ・残像・怨念モード）
function drawFrame(anim,dir,idx,x,y,alpha,flip,tint,tintA){
  const fl=AS&&AS.frames[anim+'_'+dir];if(!fl||!imgOK(SPR))return false;
  const r=fl[((idx%fl.length)+fl.length)%fl.length],sc=SPRSC[anim],w=r[2]*sc,h=r[3]*sc;
  let srcI=SPR,sx=r[0],sy=r[1];
  if(tint){tg.globalCompositeOperation='source-over';tg.globalAlpha=1;tg.clearRect(0,0,256,256);tg.drawImage(SPR,r[0],r[1],r[2],r[3],0,0,r[2],r[3]);
    tg.globalCompositeOperation='source-atop';tg.globalAlpha=tintA==null?1:tintA;tg.fillStyle=tint;tg.fillRect(0,0,r[2],r[3]);srcI=TMP;sx=0;sy=0}
  g.save();g.translate(x,y);if(flip)g.scale(-1,1);g.globalAlpha=alpha;
  g.drawImage(srcI,sx,sy,r[2],r[3],-w/2,-h,w,h);
  g.restore();return true;
}
// 現在の状態から使うアニメ・向き・コマを決める
function girlPose(face){
  let anim='walk',idx=0,dir=dirOf(face),flip=false;
  const a=P.atk,sp=Math.hypot(P.vx,P.vy);
  if(P.dead){anim='die';idx=G.deathT<.35?0:1}
  else if(a){anim='atk';idx=Math.min(2,Math.floor(clamp(a.t/a.dur,0,.999)*3.4));
    // 素材の攻撃モーションはどの行も右向きなので、左は反転、上下は専用行を使う
    if(dir==='left'){dir='right';flip=true}else if(dir==='down'||dir==='up')flip=Math.cos(face)<0}
  else if(sp>30&&!P.guard){anim='run';idx=Math.floor(P.walk*.55)}
  else if(sp>12){anim='walk';idx=Math.floor(P.walk*1)}
  // 素材の「右向き」の行は実際には左を向いているため、右は左向きの絵を左右反転して使う
  if(anim!=='atk'&&dir==='right'){dir='left';flip=true}
  return{anim,idx,dir,flip};
}
// SOUL満タン中の金色のオーラ（炎のように揺らめく光＋立ちのぼる光の粒＋ときどき走る稲妻）
function drawGoldAura(x,y){
  const t=G.time,cy=y-16;
  g.save();g.globalCompositeOperation='lighter';
  for(let k=0;k<3;k++){
    g.beginPath();const n=14;
    for(let i=0;i<=n;i++){const a=-Math.PI/2+(i/n)*TAU,up=Math.max(0,-Math.sin(a)),flick=Math.sin(t*14+i*1.7+k)*.5+.5;
      const r=(24+k*6)*(1+up*(0.45+flick*0.45)),px=x+Math.cos(a)*r*.62,py=cy+Math.sin(a)*r;i?g.lineTo(px,py):g.moveTo(px,py)}
    g.closePath();g.fillStyle=`rgba(255,${205-k*30},${70-k*20},${.2-k*.05})`;g.fill();
  }
  g.restore();
  glow(x,cy,70,'#ffcc33',.26+Math.sin(t*8)*.07);
  if(Math.random()<.4)fx({k:'gold',x:x+rand(-16,16),y:y+rand(-6,14),vx:rand(-12,12),vy:rand(-150,-90),life:.5,max:.5,sz:rand(4,8)});
  if(Math.random()<.04){g.strokeStyle='rgba(255,240,170,.7)';g.lineWidth=1.6;g.beginPath();let px=x+rand(-18,18),py=cy+rand(-34,0);g.moveTo(px,py);
    for(let i=0;i<4;i++){px+=rand(-9,9);py+=rand(6,12);g.lineTo(px,py)}g.stroke()}
}

function drawSlash(){

  const S=a.S,p=clamp(a.t/a.dur,0,1),e=1-Math.pow(1-Math.min(1,p*1.6),3);

  const alpha=p<.6?1:1-(p-.6)/.4,dir=Math.sign(S.to-S.from)||1,tail=a1-dir*Math.min(Math.abs(a1-a0),2.6);

}
function drawOver(){
  const a=clamp(stateT/.6,0,1);dim(.82*a,'20,0,6');g.globalAlpha=a;
  txt('また、殺された。',W/2,250,36,'#ff2f5f','center',JP,null,false,900);
  txt('——でも、怒りは消えない。',W/2,286,15,'#c9cfdc','center',JP,null,false,700);
  drawStats(360);
  if(stateT>.9){g.globalAlpha=.55+Math.sin(stateT*4)*.45;txt(touchMode?'TAP TO RISE AGAIN':'ENTER TO RISE AGAIN',W/2,600,19,'#fff','center',EN,null,true)}
  g.globalAlpha=1;
}
function drawClear(){
  const a=clamp(stateT/1,0,1);dim(.85*a);g.globalAlpha=a;
  txt('復讐、完了。',W/2,190,40,'#fff','center',JP,null,false,900);
  txt('鬼頭組は、一夜にして壊滅した。',W/2,232,14,'#c9cfdc','center',JP,null,false,700);
  txt('……それでも、この渇きは消えない。',W/2,256,14,'#ff4d6d','center',JP,null,false,700);
  drawStats(320);
  if(stateT>1.2){button(SCR.endless,'ENDLESS MODE ▶','rgba(160,20,45,.92)',EN);button(SCR.title,'タイトルへ','rgba(30,32,44,.92)')}
  g.globalAlpha=1;
}

/* ---------------- main draw / loop ---------------- */
function draw(){
  g.setTransform(cv.width/W,0,0,cv.height/H,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';
  if(state==='title'){TXT_SCALE=1;drawTitle();return}
  TXT_SCALE=1.2;
  g.save();
  const sh=G.shake;if(sh>.3)g.translate(rand(-sh,sh),rand(-sh,sh));
  if(G.zoom>.002){g.translate(P.x,P.y);g.scale(1+G.zoom,1+G.zoom);g.translate(-P.x,-P.y)}
  drawWorld();drawSmokes();drawTutWorld();
  g.restore();
  drawOverlays();
  drawHUD();drawTutPanel();
  if(touchMode&&state==='play')drawControls();
  drawBanner();drawCallout();
  if(state==='pause')drawPause();else if(state==='over')drawOver();else if(state==='clear')drawClear();else if(state==='pick')drawPick();
}
function loop(ts){
  const rdt=Math.min(.05,(ts-last)/1000||0);last=ts;
  pollPad();update(rdt);draw();
  requestAnimationFrame(loop);
}
resetRun();resize();requestAnimationFrame(loop);
// 読み込み時点で音の準備を試す。ブラウザが許可していれば（再訪問時のPCなど）、操作なしでロゴと同時にBGMが鳴る
// iPhoneは操作前に作ると音が出なくなることがあるため、従来どおり最初のタップで準備する
if(!IOS)initAudio();
})();
</script></body></html>
