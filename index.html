// バージョン表記（タイトル画面右下に表示）。更新のたびに数字と日付を上げる

const bgC=document.createElement('canvas'),bgG=bgC.getContext('2d');
const decC=document.createElement('canvas'),decG=decC.getContext('2d');
let decReady=false;
function resize(){
  // スマホを横にしたらプレイを止める（横向きの間は「縦にして」の表示で覆う）
  // 「縦にして」の表示が実際に出る条件（スマホの横向き）と揃える。タブレット等の横長画面では止めない
  if(touchMode&&window.matchMedia&&matchMedia('(orientation:landscape) and (pointer:coarse) and (max-height:600px)').matches&&typeof pauseGame==='function')try{pauseGame('rotate')}catch(e){}
  const s=Math.min(innerWidth/W,innerHeight/H),dpr=Math.min(window.devicePixelRatio||1,2);
  const cw=Math.round(W*s),ch=Math.round(H*s);
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  const bw=Math.max(1,Math.round(cw*dpr)),bh=Math.max(1,Math.round(ch*dpr));
  let old=null;
  if(decReady){old=document.createElement('canvas');old.width=decC.width;old.height=decC.height;old.getContext('2d').drawImage(decC,0,0)}
  cv.width=bw;cv.height=bh;bgC.width=bw;bgC.height=bh;decC.width=bw;decC.height=bh;
  bgG.setTransform(bw/W,0,0,bh/H,0,0);renderBG();
  decG.setTransform(1,0,0,1,0,0);if(old)decG.drawImage(old,0,0,bw,bh);
  decG.setTransform(bw/W,0,0,bh/H,0,0);decReady=true;
}

  const g2=y.createRadialGradient(32,32,0,32,32,32);g2.addColorStop(0,col);g2.addColorStop(1,'rgba(0,0,0,0)');y.fillStyle=g2;y.fillRect(0,0,64,64);

}

function pickType(n){

}

function drawTire(x,y,z,hd,lean,rot,sd,alpha,noShadow){

      shadow(pr.x,pr.y+6,12);g.save();g.translate(pr.x,pr.y);g.rotate(-.5);
      const on=pr.lit&&Math.floor(G.time*16)%2;rr(-6,-14,12,28,4,on?'#ffd0a0':'#c8201c');g.fillStyle='rgba(255,255,255,.25)';g.fillRect(-4,-12,2.5,24);
      g.fillStyle='#2a1810';g.fillRect(-6,-6,12,2);g.fillRect(-6,4,12,2);
      g.strokeStyle='#d8c8a0';g.lineWidth=1.6;g.beginPath();g.moveTo(0,-14);g.quadraticCurveTo(5,-20,2,-25);g.stroke();
      if(pr.lit){glow(2,-25,18,'#ffb030',.9);circ(2,-25,2.2,'#fff3b0')}
      g.restore()}
    else if(pr.k==='bottle'){
      // 火炎瓶：茶色のガラス瓶に琥珀色の燃料、口に詰めた布の先で火がちらつく
      if(pr.fly&&pr.fly.done)continue;
      const bottle=()=>{rr(-8,-10,16,26,5,'rgba(120,70,30,.85)');rr(-7,-1,14,16,4,'rgba(230,150,40,.75)');rr(-3.5,-22,7,13,2.5,'rgba(120,70,30,.9)');
        g.fillStyle='rgba(255,255,255,.3)';g.fillRect(-5,-8,2.5,20);g.fillStyle='#d8cdb0';g.beginPath();g.moveTo(-3,-22);g.lineTo(3,-22);g.lineTo(5,-31);g.lineTo(-1,-28);g.closePath();g.fill();
        const fl=.8+Math.random()*.4;glow(3,-33,12*fl,'#ff9a30',.85);circ(3,-33,2.5*fl,'#fff2b0')};
      shadow(pr.x,pr.y+16,13);g.save();g.translate(pr.x,pr.y);if(pr.fly)g.rotate(pr.fly.t*18);bottle();g.restore()}
    else if(pr.k==='oil'){
      // 200Lドラム缶を横から見た形：赤い胴・補強の帯2本・上の縁・黄色い「火気注意」の菱形。穴が開くと少し傾いて残り、やがて消える
      const f=pr.used?1-clamp((pr.t-9)/2,0,1):1;if(f<=0)continue;
      if(theme.can){drawCan(pr);continue}
      g.globalAlpha=f;drawDrum(pr);g.globalAlpha=1}
    // 台車：灰色の荷台に小さな車輪4つ、後ろに持ち手。荷物（段ボール2箱）を積んでいる間は箱も描く
    else if(pr.k==='cart')drawCart(pr);
    // タイヤの山：4本を寝かせて積み上げ、少しずつずれている（使った後はしばらく消える）
    else if(pr.k==='tires'){if(pr.used)continue;
      [[0,0],[2.5,.8],[-2,-.5],[1.5,.3]].forEach(([ox,oy],i)=>drawTire(pr.x+ox,pr.y+oy,i*TIRE_W,i*.7,Math.PI/2,i*1.3,1,1,i>0))}
    else if(pr.k==='ext'){const f=pr.used?1-clamp((pr.t-3.5)/.6,0,1):1;if(f<=0)continue;g.globalAlpha=f;drawExt(pr);g.globalAlpha=1}
  }
  // 4段目の見た目の衝撃波は紫の二重の輪（強化カードの本物の衝撃波は金色）
  for(const sh of SHOCKS){const f=1-sh.r/sh.R,c=sh.vis?'200,90,255':'255,230,140';g.strokeStyle=`rgba(${c},${.85*f})`;g.lineWidth=8*f+2;g.beginPath();g.arc(sh.x,sh.y,sh.r,0,TAU);g.stroke();
    if(sh.vis){g.strokeStyle=`rgba(255,255,255,${.6*f})`;g.lineWidth=2;g.beginPath();g.arc(sh.x,sh.y,sh.r*.82,0,TAU);g.stroke()}}
}
function drawSmokes(){
  drawWJets();
  for(const sm of SMOKES){const a=Math.min(1,sm.t/.8)*.5;
    for(let i=0;i<6;i++){const an=i/6*TAU+G.time*.4;g.fillStyle=`rgba(230,235,240,${a*.5})`;g.beginPath();g.arc(sm.x+Math.cos(an)*sm.r*.45,sm.y+Math.sin(an)*sm.r*.45,sm.r*.55,0,TAU);g.fill()}}
}



/* ---------------- ステージごとの空気（見た目と音だけ。遊び方は変えない） ----------------
   その場所に本当にありそうな光・舞うもの・物音で、ステージごとの個性を出す。床や敵を見えにくくしないよう、どれも控えめに */
const AXM=(AX0+AX1)/2,AYM=(AY0+AY1)/2;
const newPetal=gust=>{const top=!gust&&Math.random()<.45;return{k:'petal',x:top?rand(AX0,AX1):AX0-10,y:top?AY0-8:rand(AY0,AY1-150),vx:gust?rand(170,260):rand(40,90),vy:gust?rand(-10,25):rand(18,40),
  rot:rand(0,TAU),vr:rand(-4,4),f:rand(0,TAU),fs:rand(4,9),sz:rand(3.8,6),t:0,life:gust?6:10,land:rand(AY0+80,AY1-20),col:pick(['#f8cad8','#f2b4c8','#fde4ec','#f6bed0'])}};
const lampsAt=(col,cols,rows)=>{const o=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)o.push({x:AX0+(AX1-AX0)*(c+.5)/cols,y:AY0+(AY1-AY0)*(r+.5)/rows,r:150,col,k:'lamp'});return o};
const AMB={

  '中庭':{parts:'leaf',kakon:true}, // 舞い落ちる紅葉と、ししおどし
  '事務所フロア':{lights:lampsAt('#e8f4ff',2,3),flick:true}, // 天井の蛍光灯がときどきまたたく
  '畳の大広間':{lights:[{x:AX0+40,y:AY0+120,r:150,col:'#ffb860',k:'candle'},{x:AX1-40,y:AY0+120,r:150,col:'#ffb860',k:'candle'},{x:AX0+40,y:AY1-120,r:150,col:'#ffb860',k:'candle'},{x:AX1-40,y:AY1-120,r:150,col:'#ffb860',k:'candle'}]}, // 四隅の行灯
  '賭場':{dark:.1,lights:[{x:AXM-90,y:AY0+250,r:140,col:'#ffd890',k:'sway'},{x:AXM+90,y:AY0+500,r:140,col:'#ffd890',k:'sway'}],parts:'smoke'}, // 吊り下げ灯の揺れる明かりと、紫煙
  '武器庫':{dark:.14,sweep:'beacon'}, // 回転する赤い警告灯
  '改装中のフロア':{parts:'dustfall',sparks:{x:AX1-26,y:AY0+300}}, // 天井から落ちる粉じんと、溶接の火花
  '厨房':{steam:[{x:AXM-80,y:AY0+120},{x:AXM+80,y:AY0+120}],lights:[{x:AXM,y:AY0+140,r:200,col:'#ffcf90',k:'steady'}]}, // コンロの湯気
  'リネン室':{parts:'lint'}, // 舞う糸くず
  '道場':{shafts:'#bcd4ff',parts:'incense'}, // 障子越しの月明かりと、線香の煙
  '屋上庭園':{parts:'petal'}, // 風に舞う花びら
  '屋上':{sweep:'heli',parts:'wind'}, // ヘリの探照灯と、吹き抜ける風

  '組長の間':{dark:.1,glow:'#a0102a'} // 赤黒い気配
};
let AMBP=[],AMBS={};
const ambOf=()=>G.tutMode||G.bonus?null:AMB[theme.name];
function resetAmbient(){AMBP=[];AMBS={kakon:rand(4,8),car:rand(2,5),flk:rand(3,7),flkI:-1,flkT:0,drip:rand(1,3),steam:rand(2,5),stI:0,spark:rand(2,5),heli:rand(1,3)}}
function updateAmbient(dt){
  const a=ambOf();if(!a)return;const S=AMBS;
  // 舞うもの
  const spawn={leaf:2.2,petal:7,dust:3,dustfall:3,smoke:1.6,incense:1.4,lint:2,wind:6}[a.parts]||0;
  if(spawn&&Math.random()<spawn*dt&&AMBP.length<(a.parts==='petal'?110:60)){const k=a.parts;
    if(k==='leaf')AMBP.push({k,x:rand(AX0,AX1),y:AY0-10,vx:rand(-12,12),vy:rand(22,38),rot:rand(0,TAU),vr:rand(-3,3),t:0,life:rand(14,18),land:rand(AY0+80,AY1-20),col:pick(['#b8281a','#d2481c','#e08a20','#9a1c14'])});
    else if(k==='petal')AMBP.push(newPetal(false));
    else if(k==='dust'||k==='lint')AMBP.push({k,x:rand(AX0,AX1),y:rand(AY0,AY1),vx:rand(-6,6),vy:rand(-6,4),t:0,life:rand(4,7)});
    else if(k==='dustfall')AMBP.push({k,x:rand(AX0,AX1),y:rand(AY0,AY1-200),vx:rand(-3,3),vy:rand(30,50),t:0,life:rand(2,3.5)});
    else if(k==='smoke'||k==='incense'){const src=k==='incense'?{x:AX0+40,y:AY1-60}:{x:rand(AX0+60,AX1-60),y:rand(AY0+100,AY1-100)};AMBP.push({k,x:src.x+rand(-4,4),y:src.y,vx:rand(-4,4),vy:rand(-18,-10),t:0,life:rand(5,8)})}
    else if(k==='wind')AMBP.push({k,x:AX0-40,y:rand(AY0,AY1),vx:rand(520,700),vy:rand(-20,20),t:0,life:1.2})}
  // 湯気・蒸気：数秒おきに噴き出す
  if(a.steam){S.steam-=dt;if(S.steam<=0){S.steam=rand(3,6);const v=a.steam[S.stI++%a.steam.length];
    for(let i=0;i<14;i++)AMBP.push({k:'steam',x:v.x+rand(-6,6),y:v.y+rand(-6,6),vx:(v.x<AXM?1:-1)*rand(20,70)*(theme.name==='厨房'?.2:1),vy:rand(-40,-14),t:0,life:rand(1.6,2.6)});
    if(theme.name==='ボイラー室')noise(1.2,.12,'highpass',2600,1800);else noise(1.6,.05,'bandpass',1800,1200)}}
  // 天井からの水滴：床に小さな波紋
  if(a.drip){S.drip-=dt;if(S.drip<=0){S.drip=rand(1.5,3.5);const x=rand(AX0+20,AX1-20),y=rand(AY0+40,AY1-20);AMBP.push({k:'ripple',x,y,t:0,life:1.1});tone(1900,900,.07,'sine',.035)}}
  // ししおどし：竹が石を打つ「カコーン」
  if(a.parts==='petal'){S.gust=(S.gust==null?rand(4,7):S.gust)-dt;if(S.gust<=0){S.gust=rand(8,12);for(let i=0;i<28;i++)AMBP.push(newPetal(true));noise(1.8,.07,'bandpass',600,1400)}} // 突風で花びらが一斉に舞う
  if(a.kakon){S.kakon-=dt;if(S.kakon<=0){S.kakon=rand(9,14);tone(520,470,.12,'triangle',.12);tone(780,700,.08,'square',.025);tone(470,440,.25,'triangle',.05,now(.16))}}
  // 蛍光灯：ときどき1本がまたたいて「チチッ」と鳴る
  if(a.flick){S.flk-=dt;if(S.flk<=0){S.flk=rand(4,9);S.flkI=Math.floor(Math.random()*a.lights.length);S.flkT=.6;tone(120,120,.05,'square',.03);tone(120,120,.04,'square',.025,now(.18))}if(S.flkT>0)S.flkT-=dt}
  // 通りを走り抜ける車：ヘッドライトが床をなめ、走行音が近づいて遠ざかる
  if(a.sweep==='car'){S.car-=dt;if(S.car<=0&&!S.carOn){S.carOn={t:0,dir:Math.random()<.5?1:-1,y:rand(AY0+80,AY1-200)};noise(1.6,.09,'bandpass',300,900)}
    if(S.carOn){S.carOn.t+=dt;if(S.carOn.t>1.6){S.carOn=null;S.car=rand(5,9)}}}
  // ヘリの探照灯：上空を旋回し、ときどきローター音
  if(a.sweep==='heli'){S.heli-=dt;if(S.heli<=0){S.heli=rand(6,10);for(let i=0;i<8;i++)tone(70,55,.09,'sine',.07,now(i*.11))}}
  // 溶接の火花
  if(a.sparks){S.spark-=dt;if(S.spark<=0){S.spark=rand(2.5,5);S.sparkT=.5;const p=a.sparks;for(let i=0;i<16;i++){const an=rand(Math.PI*.5,Math.PI*1.5),v=rand(80,220);AMBP.push({k:'spark',x:p.x,y:p.y,vx:Math.cos(an)*v,vy:Math.sin(an)*v-60,t:0,life:rand(.4,.8)})}noise(.4,.08,'highpass',4000,6000)}if(S.sparkT>0)S.sparkT-=dt}

    if(p.k==='leaf'){if(p.y<p.land){p.x+=(p.vx+Math.sin(p.t*1.6+p.rot)*18)*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt}}
    else if(p.k==='spark'){p.vy+=420*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
    else if(p.k==='petal'){if(!p.landed){p.x+=(p.vx+Math.sin(p.t*2+p.rot)*26)*dt;p.y+=(p.vy+Math.sin(p.t*3.1+p.rot)*16)*dt;p.rot+=p.vr*dt;p.f+=p.fs*dt;p.vx=lerp(p.vx,60,1-Math.exp(-.4*dt));
      if(p.y>=p.land&&p.t>1.2){p.landed=true;p.life=p.t+3.5}}}
    else if(p.x!=null&&p.vx!=null){p.x+=p.vx*dt;p.y+=p.vy*dt}}
  AMBP=AMBP.filter(p=>p.t<p.life);
}
function drawAmbient(){
  const a=ambOf();if(!a)return;const S=AMBS,t=G.time;
  if(a.dark){g.fillStyle=`rgba(0,0,10,${a.dark*.55})`;g.fillRect(AX0,AY0,AX1-AX0,AY1-AY0)}
  if(a.glow){const pl=.12+Math.sin(t*1.3)*.05,gr=g.createRadialGradient(AXM,AYM,120,AXM,AYM,520);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,a.glow+Math.round(pl*255).toString(16).padStart(2,'0'));g.fillStyle=gr;g.fillRect(AX0,AY0,AX1-AX0,AY1-AY0)}
  if(a.shafts){g.save();g.globalCompositeOperation='lighter';for(let i=0;i<3;i++){const x=AX0+40+i*140,gr=g.createLinearGradient(x,AY0,x+160,AY0+520);gr.addColorStop(0,a.shafts+'26');gr.addColorStop(1,a.shafts+'00');
    g.fillStyle=gr;g.beginPath();g.moveTo(x,AY0);g.lineTo(x+46,AY0);g.lineTo(x+46+200,AY0+560);g.lineTo(x+200,AY0+560);g.closePath();g.fill()}g.restore()}
  if(a.lights)a.lights.forEach((L,i)=>{let I=1,x=L.x;
    if(L.k==='neon'){const ph=Math.floor(t*14+i*7);I=(Math.sin(ph*12.9)>.92)?.15:.9+Math.sin(t*40)*.05}
    else if(L.k==='lamp'&&a.flick&&i===S.flkI&&S.flkT>0)I=Math.floor(S.flkT*30)%3?.15:1;
    else if(L.k==='sway')x+=Math.sin(t*.9+i)*14;
    else if(L.k==='candle')I=.8+Math.sin(t*9+i*3)*.08+Math.sin(t*23+i)*.06;
    glow(x,L.y,L.r,L.col,(L.k==='lamp'?.13:.2)*I)});
  if(a.sweep==='car'&&S.carOn){const c=S.carOn,p=c.t/1.6,x=c.dir>0?lerp(AX0-160,AX1+160,p):lerp(AX1+160,AX0-160,p);
    g.save();g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(x,c.y,10,x,c.y,170);gr.addColorStop(0,'rgba(255,250,225,.2)');gr.addColorStop(1,'rgba(255,250,225,0)');g.fillStyle=gr;g.beginPath();g.ellipse(x,c.y,170,90,0,0,TAU);g.fill();g.restore()}
  if(a.sweep==='beacon'){const ang=t*3.2,bx=AXM,by=AY0+6;g.save();g.globalCompositeOperation='lighter';
    const gr=g.createRadialGradient(bx,by,0,bx,by,520);gr.addColorStop(0,'rgba(255,40,30,.22)');gr.addColorStop(1,'rgba(255,40,30,0)');g.fillStyle=gr;
    g.beginPath();g.moveTo(bx,by);g.arc(bx,by,520,ang-.22,ang+.22);g.closePath();g.fill();circ(bx,by,5,'rgba(255,60,40,.9)');g.restore()}
  if(a.sweep==='heli'){const x=AXM+Math.sin(t*.37)*140,y=AYM+Math.sin(t*.23+1)*260;g.save();g.globalCompositeOperation='lighter';
    const gr=g.createRadialGradient(x,y,20,x,y,95);gr.addColorStop(0,'rgba(230,240,255,.2)');gr.addColorStop(1,'rgba(230,240,255,0)');g.fillStyle=gr;g.beginPath();g.ellipse(x,y,95,80,0,0,TAU);g.fill();g.restore()}
  if(a.sparks&&S.sparkT>0)glow(a.sparks.x,a.sparks.y,60,'#ffd27a',S.sparkT);
  for(const p of AMBP){const f=1-p.t/p.life,fa=Math.min(1,p.t*3)*Math.min(1,f*3);
    if(p.k==='leaf'){g.save();g.globalAlpha=fa*.9;g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle=p.col;g.beginPath();for(let k=0;k<5;k++){const an=-Math.PI/2+k*TAU/5;g.lineTo(Math.cos(an)*5,Math.sin(an)*5);g.lineTo(Math.cos(an+.63)*2,Math.sin(an+.63)*2)}g.closePath();g.fill();g.restore()}
    else if(p.k==='petal'){const z=p.sz,fy=p.landed?.45:Math.abs(Math.cos(p.f))*.85+.15; // 裏返りながら舞う（床に落ちたら平たく）
      if(!p.landed){g.globalAlpha=fa*.18;g.fillStyle='#000';g.beginPath();g.ellipse(p.x+6,p.y+14,z*.8,z*.35,0,0,TAU);g.fill()}
      g.save();g.globalAlpha=fa*.92;g.translate(p.x,p.y);g.rotate(p.rot);g.scale(1,fy);
      const gr=g.createLinearGradient(-z,0,z,0);gr.addColorStop(0,'#fff4f8');gr.addColorStop(1,p.col);g.fillStyle=gr;
      g.beginPath();g.moveTo(-z,0);g.quadraticCurveTo(-z*.4,-z*1.05,z*.75,-z*.45);g.lineTo(z*.42,0);g.lineTo(z*.75,z*.45);g.quadraticCurveTo(-z*.4,z*1.05,-z,0);g.fill();
      g.strokeStyle='rgba(220,120,150,.45)';g.lineWidth=.5;g.beginPath();g.moveTo(-z*.8,0);g.lineTo(z*.3,0);g.stroke();g.restore()}
    else if(p.k==='dust'||p.k==='lint'){g.globalAlpha=fa*(.35+Math.sin(p.t*3+p.x)*.15);circ(p.x,p.y,p.k==='lint'?1.4:1.1,'#fff6e0')}
    else if(p.k==='dustfall'){g.globalAlpha=fa*.45;circ(p.x,p.y,1.3,'#c8c0b4')}
    else if(p.k==='smoke'||p.k==='incense'){g.globalAlpha=fa*(p.k==='incense'?.12:.08);circ(p.x+Math.sin(p.t*1.2+p.y*.02)*6,p.y,4+p.t*3.4,'#d8d8dc')}
    else if(p.k==='steam'){g.globalAlpha=fa*.22;circ(p.x,p.y,6+p.t*12,'#f2f4f6')}
    else if(p.k==='ripple'){g.globalAlpha=f*.5;g.strokeStyle='#b8d8ff';g.lineWidth=1;g.beginPath();g.ellipse(p.x,p.y,3+p.t*16,(3+p.t*16)*.5,0,0,TAU);g.stroke()}
    else if(p.k==='wind'){g.globalAlpha=fa*.18;g.strokeStyle='#e8eef6';g.lineWidth=1;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-40,p.y-p.vy*.06);g.stroke()}
    else if(p.k==='spark'){g.globalAlpha=f;circ(p.x,p.y,1.3,'#ffd890')}
    g.globalAlpha=1}
}

/* ---------------- 囲い込み制圧 ----------------
   塗ったマスでぐるりと囲まれ、外周に通じていない未塗りの領域は、一気に血で染まる。
   3マス以上の制圧では、中にいた雑魚も血の海に沈む（用心棒・ボスには大ダメージ） */
// 判定するのは「今塗られたマス」の上下左右から始まる未塗り領域だけ。
// 掃除屋が塗り地帯の中に開けた穴は、プレイヤーがその隣を塗って閉じるまで穴のまま残る
let capNew=[],capFilling=false;
const EDGE_CAP=8;
function captureCheck(){
  const starts=capNew;capNew=[];if(G.isBossWave||G.phase!=='fight'||state!=='play')return;
  for(const r of enclosed(starts)){if(G.phase!=='fight')break;capture(r)}
}
// starts（塗られたマス）の隣から始まる未塗り領域のうち、囲いが成立しているものを返す
function enclosed(starts){
  const seen=new Uint8Array(GN),regions=[],from=[];
  for(const i of starts){const cx=i%GC,cy=(i/GC)|0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx>=0&&ny>=0&&nx<GC&&ny<GR)from.push(ny*GC+nx)}}
  for(const i of from){if(DONE[i]||seen[i])continue;
    const comp=[],st=[i];seen[i]=1;let edge=false;
    while(st.length){const j=st.pop();comp.push(j);const cx=j%GC,cy=(j/GC)|0;if(cx===0||cy===0||cx===GC-1||cy===GR-1)edge=true;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=GC||ny>=GR)continue;const k=ny*GC+nx;if(!DONE[k]&&!seen[k]){seen[k]=1;st.push(k)}}}
    // 壁に接する範囲も、小さければ（EDGE_CAPマス以下）壁を囲いの一部として制圧できる
    if(!edge||comp.length<=EDGE_CAP)regions.push(comp);
  }
  return regions;
}
// 「あと1マスで囲える」予告：未塗りのマスを1つ塗ったと仮定して囲いが成立するかを試し、取れるマスの多い順に最大2か所を光らせる
// 偶然の制圧を「狙って取る」ものにするため。塗りの状態が変わった時だけ計算し直す
let CAPPV=[],pvVer=-1,pvT=0;
function updateCapPreview(dt){
  pvT-=dt;
  if(G.isBossWave||G.tutMode||G.phase!=='fight'){CAPPV=[];return}
  if(pvVer===paintVer||pvT>0||CAPQ.length)return;
  pvVer=paintVer;pvT=.15;const c=[];
  for(let i=0;i<GN;i++){if(DONE[i])continue;
    DONE[i]=1;const rs=enclosed([i]);DONE[i]=0;
    const tiles=[].concat(...rs);if(tiles.length>=2)c.push({i,tiles,n:tiles.length+1})}
  // 同じ囲いを別のマスから閉じる候補は、取れる数の多い方だけ残す
  c.sort((a,b)=>b.n-a.n);CAPPV=[];const used=new Set();
  for(const v of c){if(CAPPV.length>=2)break;if(v.tiles.some(j=>used.has(j))||used.has(v.i))continue;CAPPV.push(v);for(const j of v.tiles)used.add(j);used.add(v.i)}
}
// マスの集まりの外周だけを線で描く
function tileOutline(set){
  g.beginPath();
  for(const j of set){const t=tileRect(j),cx=j%GC,cy=(j/GC)|0;
    if(cy===0||!set.has(j-GC)){g.moveTo(t.x,t.y);g.lineTo(t.x+t.w,t.y)}
    if(cy===GR-1||!set.has(j+GC)){g.moveTo(t.x,t.y+t.h);g.lineTo(t.x+t.w,t.y+t.h)}
    if(cx===0||!set.has(j-1)){g.moveTo(t.x,t.y);g.lineTo(t.x,t.y+t.h)}
    if(cx===GC-1||!set.has(j+1)){g.moveTo(t.x+t.w,t.y);g.lineTo(t.x+t.w,t.y+t.h)}}
  g.stroke();
}
function drawCapPreview(){
  const pl=.5+Math.sin(G.time*6)*.5;
  for(const c of CAPPV){if(DONE[c.i])continue;
    const set=new Set(c.tiles);
    // 囲える範囲：薄い赤＋点線の外周
    g.fillStyle=`rgba(255,30,60,${.07+pl*.07})`;for(const j of c.tiles){const t=tileRect(j);g.fillRect(t.x,t.y,t.w,t.h)}
    g.setLineDash([6,5]);g.lineDashOffset=-G.time*20;g.strokeStyle=`rgba(255,80,110,${.45+pl*.3})`;g.lineWidth=2;tileOutline(set);g.setLineDash([]);
    // ここを塗れば囲える
    const t=tileRect(c.i),x=t.x+t.w/2,y=t.y+t.h/2;
    glow(x,y,40,'#ff2848',.25+pl*.2);
    g.fillStyle=`rgba(255,40,70,${.18+pl*.15})`;g.fillRect(t.x+2,t.y+2,t.w-4,t.h-4);
    g.strokeStyle=`rgba(255,${150+pl*105|0},${170+pl*85|0},${.75+pl*.25})`;g.lineWidth=3;g.strokeRect(t.x+3,t.y+3,t.w-6,t.h-6);
    if(PAINT[c.i]>0){g.fillStyle='rgba(255,230,235,.85)';g.fillRect(t.x+6,t.y+t.h-9,(t.w-12)*clamp(PAINT[c.i],0,1),3)}
    txt('囲える',x,y-2,11,'#fff','center',JP,['#5a0010',3],false,900);
    txt('+'+c.n,x,y+13,12,'#ffd0da','center',EN,['#5a0010',3],false,900);
  }
}
// 制圧は、輪を閉じたマスの隣から波紋のように順番に染まっていく（中の敵は波が届いた瞬間に倒れる）
let CAPQ=[];
function capture(tiles){
  const n=tiles.length,set=new Set(tiles);let sx=0,sy=0;G.wcap=(G.wcap||0)+n;
  for(const j of tiles){const t=tileRect(j);sx+=t.x+t.w/2;sy+=t.y+t.h/2}
  const cx=sx/n,cy=sy/n,dd=new Map([[tiles[0],0]]),q=[tiles[0]];
  while(q.length){const j=q.shift(),x=j%GC,y=(j/GC)|0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const k=(y+dy)*GC+(x+dx);if(x+dx<0||x+dx>=GC||y+dy<0||y+dy>=GR||!set.has(k)||dd.has(k))continue;dd.set(k,dd.get(j)+1);q.push(k)}}
  for(const j of tiles){const k=dd.get(j)||0;CAPQ.push({i:j,at:G.time+k*.045,k,n,cx,cy})}
  const pts=100*n*G.wave;G.score+=pts;tutComplete(3,.7);
  // 囲った範囲の外周を光らせて、「どこを・なぜ取れたか」を見せる
  fx({k:'capline',set,cx,cy,R:Math.sqrt(n)*TS*.8+30,life:1,max:1});
  if(n>=3){
    callout('制 圧 ！',n+'マスを一気に血で染めた　+'+pts,'#ff2f5f');G.callout.dur=1.6;
    SFX.boom();SFX.tile();addShake(Math.min(22,8+n));G.flash=Math.max(G.flash,.3);G.flashCol='255,20,50';G.hitstop=Math.max(G.hitstop,.06);
    RINGS.push({x:cx,y:cy,r:10,R:Math.sqrt(n)*TS*.75+40,t:0,dur:.45,col:'255,40,70',w:12});
    for(const j of tiles){const t=tileRect(j);bloodBurst(t.x+t.w/2,t.y+t.h/2,rand(0,TAU),4,200,true)}
  }else{popText(cx,cy,'囲った！ +'+n+'マス','#ff8aa0',16,1);SFX.tile();addShake(5)}
}
// まだ囲われているか：未塗りのマスをたどって、壁際に出ても小さければ（EDGE_CAP以下）囲われているとみなす
function stillEnclosed(i){const seen=new Uint8Array(GN),st=[i];seen[i]=1;let n=0,edge=false;
  while(st.length){const j=st.pop();n++;const cx=j%GC,cy=(j/GC)|0;if(cx===0||cy===0||cx===GC-1||cy===GR-1)edge=true;if(edge&&n>EDGE_CAP)return false;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=GC||ny>=GR)continue;const k=ny*GC+nx;if(!DONE[k]&&!seen[k]){seen[k]=1;st.push(k)}}}
  return true}
function updateCapQ(){
  if(!CAPQ.length)return;if(G.phase!=='fight'){CAPQ=[];return}
  CAPQ=CAPQ.filter(q=>{
    if(q.at>G.time)return true;
    if(!DONE[q.i]){if(!stillEnclosed(q.i))return false;capFilling=true;fillTile(q.i);capFilling=false;G.soul=Math.min(SOUL_MAX,G.soul+soulMul()*2)} // 囲い込みで塗ったマスもSOULになる
    if(q.n>=3&&Math.random()<.5)tone(240+q.k*45,360+q.k*60,.07,'triangle',.06);
    const pc=G.cause;G.cause='cap'; // 囲い込みの撃破は「まとめ倒し」に数えない
    for(const e of [...E]){if(tileAt(e.x,e.y)!==q.i)continue;const a=Math.atan2(e.y-q.cy,e.x-q.cx);
      if(q.n>=3)hitEnemy(e,e.boss?6:e.armor?6:e.hp+1,a,420,{fin:true,sink:true});else hitEnemy(e,2,a,260,{sink:true})}
    G.cause=pc;return false;
  });
}
// 塗りの進み具合が25%・50%・75%を超えたら告知（演出のみ。75%からはBGMも激しくなる）
function checkMilestones(){
  if(G.isBossWave||G.phase!=='fight'||G.tutMode)return;const pr=prog(),m=pr>=.75?3:pr>=.5?2:pr>=.25?1:0;
  // 床の75%を塗った時だけ「あと25%」と知らせる（残りのマスが点滅し始める合図）
  if(m>G.mile){G.mile=m;if(m===3){G.flash=Math.max(G.flash,.18);G.flashCol='255,20,50';tone(70,40,.7,'sine',.6);callout('あと25%','光っているマスを、すべて血で塗れ','#ff2f5f')}}
}

FECT window, faster reflected shots", "U／右クリック長押し：ガード（1回防ぐと解除）": "Hold U/RMB: Guard (drops after one block)", "ロケット弾も弾き返せる——敵の群れに撃ち返せ！": "Rockets can be knocked back — send them into the crowd!", "光る主人公をタップ：怨念解放（紫なら怨霊の手）": "Tap the glowing girl: Wrath Burst (Hands when purple)", "冷たいアスファルトの上で、私の心臓は止まった。": "On the cold asphalt, my heart stopped.", "射線上の血を一気に洗い流す——撃たれる前に潰せ": "Blasts away the blood in a line — crush him before he fires", "銃撃手の弾は、当たる直前に攻撃すると跳ね返せる": "Attack a gunner's bullet just before it hits to send it back", "鬼頭組の「取引」を見てしまった私は、殺された。": "I saw the Kito clan's \"deal\". So they killed me.", "1回防ぐと解除される。続けて守るなら押し直す": "Guard drops after one block. Press again to keep guarding", "J／左クリックで攻撃。連打で4段の連撃になる": "J/LMB to attack. Keep pressing for a 4-hit combo", "で正面ガード。防ぐとライフとSOULがたまる": " to guard the front. Blocking gives HP and SOUL", "ならば、その骸に——異形の力をくれてやろう。": "Then I shall grant your corpse — the power of the abyss.", "反射弾が3方向に分裂（左右の弾は貫通しない）": "Reflected shots split in 3 (side shots don't pierce)", "周りの血を一気に洗い流す——撒かれる前に潰せ": "Bleaches all the blood around — crush him first", "塗り残しが少なくなると、残りのマスが点滅する": "When few tiles remain, they start blinking", "壁も囲いになる。光るマスを塗って角を切り取れ": "Walls count as a fence. Paint the glowing tile to cut off the corner", "左半分をドラッグで移動、右半分をタップで攻撃": "Drag the left half to move, tap the right half to attack", "弾と斧を18発弾き返せ。1発でも当たれば終了": "Reflect 18 bullets and axes. One hit and it's over", "敵を倒すと血が飛び散り、床のマスが赤く染まる": "Killing enemies splatters blood and turns tiles red", "画面の左半分をドラッグすると、その方向へ走る": "Drag on the left half of the screen to run that way", "1・2・3キー ／ 矢印で選んでEnter": "Keys 1/2/3 or arrows, then Enter", "WASD／矢印で移動、J／左クリックで攻撃": "WASD/Arrows to move, J/LMB to attack", "「あと1マスで囲える」マスは光って知らせる": "Tiles that would close a loop glow", "クリアで1枚。やり直す時は2枚選んで始める": "1 per clear. On retry, pick 2 before starting", "天井が崩れる——落ちてくる柱の影から離れろ": "The ceiling is collapsing — stay out of the falling shadows", "最初から通して遊ぶか、練習したい操作を選ぶ": "Play it all through, or pic // 手順を始める（「もう一度」でも同じ準備をやり直す）。②以降は前の敵を煙とともに消し、その手順に必要な敵だけを出す
function tutSetup(st){
  const T_=G.tut;Object.assign(T_,{t:0,foe:null,later:false,doneAt:null,gap:-1,targets:null,spawnCd:0});
  P.hp=P.maxhp; // 各手順はライフ満タンから始める
  if(st>=2){for(const e of E){for(let k=0;k<6;k++)fx({k:'smoke',x:e.x,y:e.y,vx:rand(-60,60),vy:rand(-60,60),life:.5,max:.5,sz:rand(8,14)})}E.length=0;MARKS.length=0;B.length=0}
  if(st===1){T_.mv=0;T_.atks=0;T_.lx=P.x;T_.ly=P.y;T_.lastAtk=null} // ① 操作：動いて攻撃してみる（敵は出さない）
  else if(st===2)T_.base=painted;
  else if(st===3){if(T_.rep>=2)tutCorner();else tutRing()} // 3回目は壁際の角で練習
  else if(st===4)tutFoe('grunt',110);else if(st===5)tutFoe('shield',110);
  else if(st===6)tutFoe('gunner',230);
  else if(st===7){G.soul=100;for(let k=0;k<3;k++){const a=k/3*TAU+.5;tutFoe('grunt',140,a)}}
  else if(st===8){
    // ⑥ 怨霊の手：SOULを2段目まで満タンにし、主人公のまわり一帯を血で塗っておく（寄ってくる敵が血の床に乗る）
    G.soul=SOUL_MAX;capFilling=true;for(let i=0;i<GN;i++){const t=tileRect(i);if(!BLOCK[i]&&!DONE[i]&&dist(t.x+t.w/2,t.y+t.h/2,P.x,P.y)<230)fillTile(i)}capFilling=false;
    for(let k=0;k<4;k++){const a=k/4*TAU+.4;tutFoe('grunt',150,a)}}
  else if(st===9){G.crewOut=true;queueSpawn('cleaner','mop')}
  else if(st===10){
    // ⑧：床をほぼ全部塗った状態にして、残り2マスだけを光らせる（近くに敵を多めに出す）
    const cand=[];for(let i=0;i<GN;i++){const cx=i%GC,cy=(i/GC)|0,t=tileRect(i);if(cx>0&&cy>=3&&cx<GC-1&&cy<GR-1&&dist(t.x+t.w/2,t.y+t.h/2,P.x,P.y)>140)cand.push(i)}
    cand.sort(()=>Math.random()-.5);T_.targets=cand.slice(0,2);
    capFilling=true;for(let i=0;i<GN;i++)if(!T_.targets.includes(i)&&!DONE[i])fillTile(i);capFilling=false;
    for(const i of T_.targets)if(DONE[i]){cleanTile(i,true)}for(const i of T_.targets)PAINT[i]=0;
  }
}
// 手順の達成：少し間を置いてから止める（同じ手順で何度呼ばれても1回だけ。待ち時間はゲーム内の時間で数える）
// 各手順を何回成功させるか（①の基本操作は1回、ほかは TUT_REPS 回）
const tutReps=st=>st===1?1:TUT_REPS;
function tutComplete(from,delay){const T_=G.tut;if(!T_||T_.step!==from||T_.later)return;T_.later=true;T_.doneAt=T_.t+(delay||0)}
function tutChoice(next){
  const T_=G.tut;if(!T_)return;state='tutintro';stateT=0;SFX.ui();T_.rep=0;
  if(!next){tutSetup(T_.step);return}
  // 全手順を終えたら締めのメッセージを出し、タップでタイトルへ
  if(T_.step>=TUT_STEPS){tutDone=true;lsSet('dg_tut','1');state='tutend';G.banner=null;G.callout=null;SFX.clear();return}
  T_.step++;tutSetup(T_.step);
}
// 練習用の敵を、主人公の前方（または指定の向き）に出す
function tutFoe(type,d,a){
  const an=a==null?P.face:a,x=clamp(P.x+Math.cos(an)*d,AX0+30,AX1-30),y=clamp(P.y+Math.sin(an)*d,AY0+40,AY1-30);
  const e=makeEnemy(type,x,y);e.state='chase';if(type==='gunner'){e.cd=.6;G.aimer=null;G.shotGap=0}if(a==null)G.tut.foe=e;return e;
}
// 囲いの練習用に、内側2×2・外周8マスのうち7マスを塗った輪を用意する（残り1マスが光る）
function tutRing(){
  let best=null,bd=1e9;
  for(let r=2;r<=GR-4;r++)for(let c=2;c<=GC-4;c++){
    const inn=[[c,r],[c+1,r],[c,r+1],[c+1,r+1]].map(([x,y])=>y*GC+x);if(inn.some(i=>DONE[i]))continue;
    const t=tileRect(inn[0]),cx=t.x+TS,cy=t.y+TS,d=Math.abs(dist(cx,cy,P.x,P.y)-170);if(d<bd){bd=d;best=[c,r]}
  }
  if(!best){washFloor();return tutRing()}
  const [c,r]=best,ring=[[c-1,r],[c-1,r+1],[c+2,r],[c+2,r+1],[c,r-1],[c+1,r-1],[c,r+2],[c+1,r+2]].map(([x,y])=>y*GC+x);
  let gap=ring[0],gd=1e9;for(const i of ring){const t=tileRect(i),d=dist(t.x+t.w/2,t.y+t.h/2,P.x,P.y);if(d<gd&&!DONE[i]){gd=d;gap=i}}
  capFilling=true;for(const i of ring)if(i!==gap&&!DONE[i])fillTile(i);capFilling=false;
  if(DONE[gap]){cleanTile(gap,true);PAINT[gap]=0}
  G.tut.gap=gap;G.tut.ring=ring;const g_=tileRect(gap);
  {const e=makeEnemy('grunt',g_.x+g_.w/2+rand(-20,20),g_.y+g_.h/2+rand(-20,20));e.state='chase'}
}
// 壁際の練習：主人公に一番近い角の2×2を、壁と血のL字で囲む形にし、L字の1マスだけ空けて光らせる
function tutCorner(){
  let best=null,bd=1e9;
  for(const [sx,sy] of [[0,0],[GC-1,0],[0,GR-1],[GC-1,GR-1]]){const t=tileRect(sy*GC+sx),d=dist(t.x+t.w/2,t.y+t.h/2,P.x,P.y);if(d<bd){bd=d;best=[sx,sy]}}
  const [sx,sy]=best,dx=sx?-1:1,dy=sy?-1:1,at=(i,j)=>(sy+j*dy)*GC+(sx+i*dx);
  const inner=[at(0,0),at(1,0),at(0,1),at(1,1)],wall=[at(2,0),at(2,1),at(1,2),at(0,2)]; // 囲いの中に接するマスだけ（外側の角は不要）
  for(const i of inner)if(DONE[i]){cleanTile(i,true);PAINT[i]=0}
  let gap=wall[0],gd=1e9;for(const i of wall){const t=tileRect(i),d=dist(t.x+t.w/2,t.y+t.h/2,P.x,P.y);if(d<gd){gd=d;gap=i}}
  capFilling=true;for(const i of wall)if(i!==gap&&!DONE[i])fillTile(i);capFilling=false;
  if(DONE[gap]){cleanTile(gap,true);PAINT[gap]=0}
  G.tut.gap=gap;G.tut.ring=wall;const g_=tileRect(gap);
  {const e=makeEnemy('grunt',clamp(g_.x+g_.w/2+rand(-20,20),AX0+20,AX1-20),clamp(g_.y+g_.h/2+rand(-20,20),AY0+24,AY1-20));e.state='chase'}
}
function updateTut(dt){
  const T_=G.tut;if(!T_)return;T_.t+=dt;
  if(T_.backT!=null){T_.backT-=dt;if(T_.backT<=0){resetRun();state='tutsel';stateT=0}return}
  if(T_.doneAt!=null&&T_.t>=T_.doneAt){T_.doneAt=null;T_.rep=(T_.rep||0)+1;
    // 3回成功するまでは、その場で準備をやり直して続ける
    const reps=tutReps(T_.step);
    if(T_.rep<reps){callout('ナイス！','あと'+(reps-T_.rep)+'回','#ffd54a');G.callout.dur=1.2;SFX.ui();tutSetup(T_.step);return}
    // 個別に選んだ手順：クリアを知らせて、少ししたら選択画面へ戻る
    if(T_.single){callout(tutText(T_.step)[0]+' クリア！','手順の選択に戻ります','#ffd54a');G.callout.dur=1.4;SFX.just();T_.backT=1.5;T_.later=true;return}
    // 最後の手順は「タイトルへ／もう一度」を出さず、そのまま締めのメッセージへ
    if(T_.step>=TUT_STEPS){tutChoice(true);return}
    state='tutmenu';stateT=0;SFX.just();return}
  if(T_.step===1){const d=Math.hypot(P.x-T_.lx,P.y-T_.ly);T_.mv+=d;T_.lx=P.x;T_.ly=P.y;if(P.atk&&P.atk!==T_.lastAtk){T_.lastAtk=P.atk;T_.atks++}if(T_.mv>200&&T_.atks>=4&&T_.t>1)tutComplete(1,.4)}
  if(T_.step===2&&painted>=T_.base+3&&T_.t>1)tutComplete(2,.3);
  // 練習相手を先に倒してしまったら出し直す
  if((T_.step===4||T_.step===5||T_.step===6)&&T_.t>1&&!T_.later&&(!T_.foe||T_.foe.dead))tutFoe(T_.step===6?'gunner':'grunt',T_.step===6?230:110);
  if(T_.step===7&&G.soul<100&&T_.t>1&&!T_.later)G.soul=100;
  if(T_.step===8&&G.soul<SOUL_MAX&&T_.t>1&&!T_.later&&!HANDS.length)G.soul=SOUL_MAX;
  if(T_.step===8&&T_.t>1&&!T_.later&&!E.length&&!MARKS.length)for(let k=0;k<4;k++){const a=k/4*TAU+.4;tutFoe('grunt',150,a)}
  if(T_.step===9&&T_.t>1.5&&!E.some(e=>e.type==='cleaner')&&!MARKS.some(m=>m.type==='cleaner'))tutComplete(9,.3);
  if(T_.step===10&&T_.targets&&T_.targets.every(i=>DONE[i]))tutComplete(10,.6);
  // 塗るための相手：①は1体ずつ、②は光るマスの近くに1体、⑦は光るマスの近くに同時に最大5体
  const foes=E.filter(e=>e.type!=='cleaner').length+MARKS.length;
  if(T_.step===2&&foes<1&&T_.t>.6)tutFoe('grunt',150,rand(0,TAU));
  if(T_.step===3&&foes<1&&T_.gap>=0&&!DONE[T_.gap]&&T_.t>.6){const g_=tileRect(T_.gap);const e=makeEnemy('grunt',g_.x+g_.w/2+rand(-20,20),g_.y+g_.h/2+rand(-20,20));e.state='chase'}
  if(T_.step===10&&!T_.later&&foes<5&&(T_.spawnCd-=dt)<=0){T_.spawnCd=.45;const tg=(T_.targets||[]).filter(i=>!DONE[i]);
    if(tg.length){const t=tileRect(pick(tg)),a=rand(0,TAU),r=rand(40,90);const e=makeEnemy('grunt',clamp(t.x+t.w/2+Math.cos(a)*r,AX0+20,AX1-20),clamp(t.y+t.h/2+Math.sin(a)*r,AY0+30,AY1-20));e.state='chase'}}
}

function screenAction(p,key){
  if(state==='ad')return;
  // エンディング：タップで次の場面へ（最後の場面なら結果画面へ）
  if(state==='epilogue'){if(stateT<.6)return;const nx=EPI.find(sc=>sc.t0>stateT+.05);SFX.ui();if(nx)stateT=nx.t0;else stateT=EPI_END+.01;return} // 最後の場面では、曲を締めてから結果画面へ
  // ボーナス集計：並べている途中なら一気に全部出す。出し終わっていれば次へ
  if(state==='bres'){const r=G.bres;if(r.doneT<0){r.n=r.items.length;r.tick=0}else if(r.doneT>.6)finishBonus();return}
  if(state==='pick'){if(p&&G.devRun&&inR(p,SCR.pdev)){openDev();return}if(p){const i=cardAt(p);if(i>=0)pickCard(i)}else pickCard(G.cardSel);return}

  if(state==='tutintro'){if(stateT>.3){state='play';stateT=0;SFX.ui()}return}
  if(state==='tutend'){if(stateT>.8){state='title';stateT=0;resetRun();skipPrologue();SFX.ui()}return}
  if(state==='stintro'){if(stateT>.3){SFX.ui();stateT=0;if(++G.cardI>=G.cards.length){G.cards=null;state='play'}}return}
  if(state==='tutmenu'){if(stateT<.3)return;if(p){if(inR(p,SCR.tnext))tutChoice(true);else if(inR(p,SCR.tretry))tutChoice(false);else if(inR(p,SCR.tquit))tutQuit();return}if(key==='quit'){tutQuit();return}tutChoice(key!=='retry');return}
  if(state==='tutsel'){
    if(p){if(inR(p,TUT_ALL)){newGame(true);return}if(tutDone)for(let n=1;n<=TUT_STEPS;n++)if(inR(p,TUTSEL(n))){startTutAt(n,true);return}if(inR(p,SCR.tsback)){state='title';stateT=0;skipPrologue();SFX.ui()}return}
    if(key==='title'){state='title';stateT=0;skipPrologue()}return}
  // タイトル：音がまだ鳴らせない状態なら、最初の1回は「音をONにするだけ」（BGMを聴かせるため）。2回目で開始
  // プロローグ中のタップ（クリック・キー）は読み飛ばし：すぐロゴとボタンを出す（音の準備もこのタップで済ませる）
  if(state==='title'&&stateT<LOGO_T+.6){skipPrologue();return}
  if(state==='title'){if(p&&inR(p,SCR.tlang)&&stateT>LOGO_T){setLang(LANG==='en'?'ja':'en');SFX.ui();return}
    if(!muted&&!(AC&&AC.state==='running')&&!G.titleTap){G.titleTap=1;return}
    if(p){if(inR(p,SCR.tstart)){if(DEVSHIFT)openDev();else devHold={t:performance.now()}}else if(inR(p,SCR.ttut)){state='tutsel';stateT=0;SFX.ui()}else if(inR(p,SCR.tendless)){if(endlessOpen())newEndless();else SFX.wall()}return}
    if(key==='tut'){state='tutsel';stateT=0;SFX.ui();return}
    newGame(key==='tut');return}
  if(state==='dev'){
    if(!p){if(key==='title'){state='title';stateT=0;skipPrologue()}return}
    for(let n=1;n<=20;n++)if(inR(p,DEV_BTN(n))){devStart(n);return}
    for(let k=0;k<3;k++)if(inR(p,DEV_BON(k))){devBonus(k);return}
    for(let n=1;n<=TUT_STEPS;n++)if(inR(p,DEV_TUT(n))){devTut(n);return}
    if(inR(p,DEV_UI.endless)){devStart(21);return}
    if(inR(p,DEV_UI.ikei)){devFinal('ikei');return}
    if(inR(p,DEV_UI.ending)){devFinal('ending');return}
    if(inR(p,DEV_UI.god)){DEV.god=!DEV.god;SFX.ui();return}
    // 誤って押さないよう、3秒以内にもう一度押した時だけ実行
    if(inR(p,DEV_UI.reset)){if(DEV.rstAsk&&performance.now()-DEV.rstAsk<3000)factoryReset();else{DEV.rstAsk=performance.now();SFX.ui()}return}
    if(inR(p,DEV_UI.close)){state='title';stateT=0;skipPrologue();SFX.ui()}return}
  if(state==='over'){if(stateT<.9)return;
    if(p){if(G.devRun&&inR(p,SCR.pdev)){openDev();return}if(canRevive()&&inR(p,SCR.orevive)){rewardAd(revive);return}
      if(inR(p,SCR.oshare)){shareResult();return}
      if(inR(p,SCR.otitle)){state='title';stateT=0;resetRun();skipPrologue();return}
      if(inR(p,SCR.oretry))restartRun();return}
    if(key==='title'){state='title';stateT=0;resetRun();skipPrologue();return}
    restartRun();return}
  if(state==='pause'){
    if(p&&inR(p,SCR.presume)){state='play';SFX.ui();return}
    if(p&&G.devRun&&inR(p,SCR.ppdev)){openDev();return} // 開発者画面から始めたステージだけ
    if((p&&inR(p,SCR.ptitle))||key==='title'){state='title';stateT=0;resetRun();return}

    if(!p||inR(p,SCR.endless)||key==='go')goEndless();
  }
}

/* マウス固定（PC）：プレイ中はカーソルをゲーム画面の中に閉じ込めて、画面の外へ出て操作が効かなくなるのを防ぐ。
   ESCキーで解除できる（解除されたら自動でポーズ）。メニューやカード選びの間はカーソルを戻す。上部のボタンで機能そのものを切り替えられる */

function startAttack(ix,iy){
  const st=P.comboWin>0?P.stage:0,S=STAGES[st];
  // 自動追尾なし：入力方向（無ければ今向いている方向）へ攻撃し、その方向へ少しだけ踏み込む
  if(P.atkA!=null){P.face=P.atkA;P.atkA=null}else if(Math.hypot(ix,iy)>.3)P.face=Math.atan2(iy,ix);

  if(st===3){P.lx=P.ly=0;P.lt=0}else{P.lx=Math.cos(P.face)*140;P.ly=Math.sin(P.face)*140;P.lt=.1}

  P.crit=false;P.stage=(st+1)%STAGES.length;P.atkBuf=0;

function doHit(a){

  let n=0;
  for(const e of [...E]){
    const d=dist(P.x,P.y,e.x,e.y);if(d>range+e.r)continue;
    const an=Math.atan2(e.y-P.y,e.x-P.x);
    if(S.arc<TAU&&Math.abs(angDiff(P.face,an))>S.arc/2&&d>e.r+P.r+4)continue;
    const sm=!a.crit&&e.smoked>0&&!e.boss; // むせている敵への攻撃は、クリティカルになる
    hitEnemy(e,sm?dmg*2.5:dmg,an,S.kb*(a.crit||sm?1.4:1),{fin:fin||sm,crit:a.crit||sm,spin:a.st===3,melee:true});n++;
  }

  }

  for(const pr of PROPS){const d=dist(P.x,P.y,pr.x,pr.y);if(d>range+pr.r)continue;const an=Math.atan2(pr.y-P.y,pr.x-P.x);

  // 4段目は見た目の衝撃波を必ず出す（当たり判定は回転攻撃のみ）。強化カード「衝撃波」があれば、さらに遠くまで届く本物の衝撃波
  if(a.st===3)SHOCKS.push(lv('shock')?{x:P.x,y:P.y,r:range*.6,R:range+63,hit:new Set()}:{x:P.x,y:P.y,r:range*.4,R:range+14,hit:new Set(),vis:true});

 P.guardFx-=dt;P.gT=P.guard?Math.min(1,(P.gT||0)+dt*9):0;

  {

function mv(e,a,s,dt){if(e.boss&&e.onBlood)s*=.75; // 血溜まりの上のボスは足を取られて遅い

        if(b.hits&&b.hits.has(e))continue;if(dist(b.x,b.y,e.x,e.y)>=e.r+8)continue;
        const kill=!e.armor&&!e.boss;if(b.hits)b.hits.add(e);
        hitEnemy(e,kill?e.hp+1:(b.big?16:4)*(b.perfect?2:1)*(1+.5*lv('payback')),Math.atan2(b.vy,b.vx),520,{fin:true,shot:true});
        if(!kill||b.noPierce){b.life=0;if(kill)popText(e.x,e.y-28,'SHOT KILL',b.perfect?'#ffd54a':'#7ff3ff',15,.8);break}
        b.kills=(b.kills||0)+1;G.score+=150*b.kills;G.hitstop=Math.max(G.hitstop,.06);G.zoom=Math.max(G.zoom,.03);addShake(9);
        popText(e.x,e.y-28,b.kills>1?'PIERCE ×'+b.kills:'SHOT KILL',b.perfect?'#ffd54a':'#7ff3ff',b.kills>1?19:15,.8);
      }
    }
    else if(!P.dead&&dist(b.x,b.y,P.x,P.y)<P.r+(b.big?9:5)){
      if(P.inv<=0){hurtPlayer(b.dmg,b.x-b.vx*.1,b.y-b.vy*.1);b.life=0;if(b.rocket)explode(b.x,b.y,70,false)}
    }
  }
  B=B.filter(b=>b.life>0&&b.x>-30&&b.x<W+30&&b.y>AY0-30&&b.y<H+30);
  // fx
  for(const f of FX){
    f.life-=dt;f.x+=f.vx*dt||0;f.y+=f.vy*dt||0;
    if(f.k==='dustc'||f.k==='wmist'){const k=Math.exp(-3.2*dt);f.vx*=k;f.vy=f.vy*k-8*dt}else if(f.k==='chip')f.vy+=600*dt;
    if(f.k==='b'){const k=Math.exp(-7*dt);f.vx*=k;f.vy*=k;if(f.life<=0&&Math.random()<.25){decG.fillStyle='rgba(110,0,15,.6)';decG.beginPath();decG.arc(f.x,f.y,f.sz*.7,0,TAU);decG.fill();if(!f.np){const pk=PAINT_K;PAINT_K=f.pk||1;paint(f.x,f.y,5,.04);PAINT_K=pk}}}
    else if(f.k==='fire'||f.k==='smoke'||f.k==='gold'||f.k==='powder'){const k=Math.exp(-4*dt);f.vx*=k;f.vy*=k}
    else if(f.k==='ash'){const k=Math.exp(-2.2*dt);f.vx*=k;f.vy=f.vy*k-30*dt;f.rot+=f.vr*dt}
    else if(f.k==='paper'){const k=Math.exp(-5*dt);f.vx*=k;f.vy=f.vy*k+40*dt;f.rot+=f.vr*dt}
  }
  FX=FX.filter(f=>f.life>0);
  for(const r of RINGS)r.t+=dt;RINGS=RINGS.filter(r=>r.t<r.dur);
  if(G.csWait&&G.csWait.t>=G.csWait.ad)G.csWait=null; // 台詞を読み終えたら、場面を進める
  for(const t of TEXTS){t.t+=rdt;t.y+=t.vy*rdt;t.vy*=Math.exp(-3*rdt);if(t.follow){t.x=t.follow.x;t.y=figTop(t.follow)-14}}
  TEXTS=TEXTS.filter(t=>t.t<t.dur);
  updateWave(dt);
}

// プレイ中の文字は一段階大きく（TXT_SCALE倍）。画面からはみ出す長さの文字は、画面内に収まるよう横幅を詰めて描く
let TXT_SCALE=1;
function txt(s,x,y,size,col,align,font,stroke,italic,weight,fitW){
  s=tr(s);align=align||'left';
  g.font=(italic?'italic ':'')+(weight||900)+' '+(size*TXT_SCALE)+'px '+(font||EN);g.textAlign=align;g.textBaseline='alphabetic';
  // 原点を動かして描いている文字（中央の大きな告知・コンボ数など）は、x が画面の座標ではないので詰めない
  const tf=g.getTransform(),moved=Math.abs(tf.e/(cv.width/W))>20||Math.abs(tf.f/(cv.height/H))>20;
  let mw=fitW||(moved?undefined:align==='center'?Math.max(40,2*Math.min(x,W-x)-12):align==='right'?Math.max(40,x-6):Math.max(40,W-x-6));
  // 枠の中の文字は、その枠の内側に収める（一番内側の枠を使う）
  if(!moved&&BOXES.length&&uiXf()){const cy=y-size*TXT_SCALE*.35;let bx=null;for(const b of BOXES)if(x>=b.x&&x<=b.x+b.w&&cy>=b.y&&cy<=b.y+b.h&&(!bx||b.w*b.h<bx.w*bx.h))bx=b;
    if(bx){const lim=align==='center'?2*Math.min(x-bx.x,bx.x+bx.w-x)-14:align==='right'?x-bx.x-8:bx.x+bx.w-x-8;if(lim>10)mw=Math.min(mw||1e9,lim)}}
  if(stroke){g.lineJoin='round';g.lineWidth=stroke[1];g.strokeStyle=stroke[0];mw?g.strokeText(s,x,y,mw):g.strokeText(s,x,y)}
  g.fillStyle=col;mw?g.fillText(s,x,y,mw):g.fillText(s,x,y);
}
function rrPath(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
let BOXES=[];
const uiXf=()=>{const m=g.getTransform(),k=cv.width/W;return Math.abs(m.a-k)<.01&&Math.abs(m.d-cv.height/H)<.01&&Math.abs(m.b)<.001&&Math.abs(m.c)<.001&&Math.abs(m.e)<.5&&Math.abs(m.f)<.5}; // 画面そのものの座標で描いているか
function rr(x,y,w,h,r,col){g.fillStyle=col;rrPath(x,y,w,h,r);g.fill();if(w>=40&&h>=18&&uiXf())BOXES.push({x,y,w,h})}
function circ(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}
function shadow(x,y,r){g.fillStyle='rgba(0,0,0,.45)';g.beginPath();g.ellipse(x,y+r*.35,r*1.15,r*.62,0,0,TAU);g.fill()}

function drawFrame(anim,dir,idx,x,y,alpha,flip,tint,tintA){

// 現在の状態から使うアニメ・向き・コマを決める
function girlPose(face){
  let anim='walk',idx=0,dir=dirOf(face),flip=false;
  const a=P.atk,sp=Math.hypot(P.vx,P.vy);
  if(P.dead){anim='die';idx=G.deathT<.35?0:1}
  else if(a){anim='atk';idx=Math.min(2,Math.floor(clamp(a.t/a.dur,0,.999)*3.4));
    // 4段目の回転攻撃：斬撃の軌跡と同じ速さで体の向きを一周させる
    if(a.st===3){const p=clamp(a.t/a.dur,0,1),e=1-Math.pow(1-Math.min(1,p*1.6),3);face=P.face+a.S.from+(a.S.to-a.S.from)*e;dir=dirOf(face)}
    // 素材の攻撃モーションはどの行も右向きなので、左は反転、上下は専用行を使う
    if(dir==='left'){dir='right';flip=true}else if(dir==='down'||dir==='up')flip=Math.cos(face)<0}
  else if(sp>30&&!P.guard){anim='run';idx=Math.floor(P.walk*.55)}
  else if(sp>12){anim='walk';idx=Math.floor(P.walk*1)}
  // 素材の「右向き」の行は実際には左を向いているため、右は左向きの絵を左右反転して使う
  if(anim!=='atk'&&dir==='right'){dir='left';flip=true}
  return{anim,idx,dir,flip};
}

// 防御だと一目で分かるよう、枝の中を青白く光る脈が走り、隙間に淡い青の霞、枝先が光る。防いだ瞬間は白く弾けて外へ波紋。
// part='back' は主人公より奥の部分（主人公の前に描く）、'front' は手前の部分（主人公の後に描く）
function drawShield(x,y,f,A,fx,k,part){
  const hit=fx>0,h=hit?fx/.25:0,e=1-Math.pow(1-k,3),aA=A*(.55+.45*e),a0=f-aA,a1=f+aA,tm=G.time;
  const R=14+22*e,Hs=66,by=y+10,NB=11,isFront=a=>Math.sin(a)>0;
  const Pt=(a,v,r)=>[x+Math.cos(a)*(r==null?R:r)*(1+.06*v),by+Math.sin(a)*(r==null?R:r)*.55-v*Hs];
  const pulse=.6+Math.sin(tm*5)*.25+(hit?.6*h:0);
  const bark=hit?'#cfeff8':'#3a2630',dark='#0b0608',vein=`rgba(90,220,255,${Math.min(1,.55*pulse)})`;
  const stroke=(pts,w0,w1,col)=>{for(let q=1;q<pts.length;q++){const t=q/(pts.length-1);g.strokeStyle=col;g.lineWidth=w0+(w1-w0)*t;g.beginPath();g.moveTo(pts[q-1][0],pts[q-1][1]);g.lineTo(pts[q][0],pts[q][1]);g.stroke()}};
  const limb=(pts,w0,w1)=>{stroke(pts,w0+2.4,w1+2,dark);stroke(pts,w0,w1,bark);g.globalCompositeOperation='lighter';stroke(pts,Math.max(1.2,w0*.38),.7,vein);g.globalCompositeOperation='source-over'};
  // 曲がりながら進む線（2点の間を、こぶのように揺らして結ぶ）
  const bend=(p,q,n,amp,sd)=>{const out=[],dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
    for(let k2=0;k2<=n;k2++){const t=k2/n,w=Math.sin(t*Math.PI)*amp*Math.sin(sd+t*4)+Math.sin(tm*1.8+sd)*1.2*t;out.push([p[0]+dx*t+nx*w,p[1]+dy*t+ny*w])}return out};
  g.save();g.lineCap='round';g.lineJoin='round';
  // 盾の範囲の淡い青の霞
  g.globalCompositeOperation='lighter';
  for(let s2=0;s2<12;s2++){const b0=a0+(a1-a0)*s2/12,b1=a0+(a1-a0)*(s2+1)/12,m=(b0+b1)/2;if((part==='front')!==isFront(m))continue;
    const p00=Pt(b0,.08),p10=Pt(b1,.08),p11=Pt(b1,.92),p01=Pt(b0,.92),gr=g.createLinearGradient(0,p00[1],0,p01[1]);
    gr.addColorStop(0,'rgba(60,200,255,0)');gr.addColorStop(.5,`rgba(60,200,255,${(isFront(m)?.32:.2)*pulse*e})`);gr.addColorStop(1,'rgba(60,200,255,0)');g.fillStyle=gr;
    g.beginPath();g.moveTo(p00[0],p00[1]);g.lineTo(p10[0],p10[1]);g.lineTo(p11[0],p11[1]);g.lineTo(p01[0],p01[1]);g.closePath();g.fill()}
    g.strokeStyle=`rgba(110,225,255,${.42*pulse*e})`;g.lineWidth=2;
  for(let s2=0;s2<12;s2++){const b0=a0+(a1-a0)*s2/12,b1=a0+(a1-a0)*(s2+1)/12,m=(b0+b1)/2;if((part==='front')!==isFront(m))continue;const p=Pt(b0,.96),q=Pt(b1,.96);g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke()}
  for(const a of [a0,a1])if((part==='front')===isFront(a)){const p=Pt(a,.05),q=Pt(a,.96);g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke()}
  g.globalCompositeOperation='source-over';
  // 両腕：肩から前へ伸びる樹皮の前腕（向きで奥・手前が決まる）
  const hand=sd=>Pt(f+sd*.55,.5,11),sh=sd=>Pt(f+sd*1.25,.62,7);
  for(const sd of [-1,1]){if((part==='front')!==isFront(f+sd*.55))continue;limb(bend(sh(sd),hand(sd),5,1.5,sd*2),7,6)}
  // 手の先から扇状に分かれる枝（指のように）。行き先は盾の湾曲面の上の、高さの違う点
  const VT=[.92,.38,.72,.16,.84,.5,.28,.66,.95,.22,.8];

    const hp=hand(sd),tp=Pt(a+Math.sin(tm*1.5+i)*.03*e,vt),br=bend(hp,tp,9,4+i%3,i*1.7);limb(br,6.5,2);
    // 隣の枝へ伸びて絡む小枝

    const m2=br[7],nb2=Pt(a+(i%2?-1:1)*(a1-a0)/NB,Math.max(.05,vt-.22));limb(bend(m2,nb2,4,2.5,i+5),2.4,1);
    // とげ
    g.fillStyle=dark;for(const q of [3,7]){const p=br[q],s3=(i+q)%2?1:-1;g.beginPath();g.moveTo(p[0],p[1]-2);g.lineTo(p[0]+s3*6,p[1]-4);g.lineTo(p[0],p[1]+2);g.closePath();g.fill()}
    glow(tp[0],tp[1],10,'#5ad8ff',.5*pulse*e);circ(tp[0],tp[1],1.4,'#d8f8ff')}
  // 防いだ瞬間：中ほどの高さで外へ広がる光の輪
  if(hit&&part==='front'){const rr=R+6+(1-h)*30;g.strokeStyle=`rgba(150,245,255,${h})`;g.lineWidth=2+3*h;g.beginPath();g.ellipse(x,by-Hs*.5,rr,rr*.55,0,a0-.15,a1+.15);g.stroke()}
  g.restore();
}

function drawSlash(){
  const a=P.atk;if(!a||P.dead)return;
  const S=a.S,p=clamp(a.t/a.dur,0,1),e=1-Math.pow(1-Math.min(1,p*1.6),3);
  const a0=P.face+S.from,a1=P.face+S.from+(S.to-S.from)*e,R=S.range*(1+.105*lv('reach'));
  const alpha=p<.6?1:1-(p-.6)/.4,dir=Math.sign(S.to-S.from)||1,tail=a1-dir*Math.min(Math.abs(a1-a0),2.6);
  if(a.st===3){drawSpin(a,p,a0,a1,R,alpha);return}
  const col=a.crit?'255,210,80':'255,70,100';
  g.save();g.globalCompositeOperation='lighter';
  g.fillStyle=`rgba(${col},${.38*alpha})`;g.beginPath();g.arc(P.x,P.y,R,tail,a1,dir<0);g.arc(P.x,P.y,R*.42,a1,tail,dir>0);g.closePath();g.fill();
  g.fillStyle=`rgba(255,255,255,${.25*alpha})`;g.beginPath();g.arc(P.x,P.y,R,a1-dir*Math.min(Math.abs(a1-a0),.9),a1,dir<0);g.arc(P.x,P.y,R*.8,a1,a1-dir*Math.min(Math.abs(a1-a0),.9),dir>0);g.closePath();g.fill();
  // 爪痕：3本の平行な斬撃
  const span=Math.min(Math.abs(a1-a0),1.5);
  for(const k of [.62,.78,.94]){g.strokeStyle=`rgba(255,255,255,${.85*alpha})`;g.lineWidth=k===.78?3.5:2.2;g.beginPath();g.arc(P.x,P.y,R*k,a1-dir*span,a1,dir<0);g.stroke()}
  g.restore();
}

// 4段目の回転斬り：紫の怨念の渦＋残像の輪＋白熱した刃先＋金の爪痕＋外へ飛ぶ棘
function drawSpin(a,p,a0,a1,R,alpha){
  const sweep=Math.min(a1-a0,TAU*.98),tail=a1-sweep;
  g.save();g.globalCompositeOperation='lighter';
  glow(P.x,P.y,R*1.15,'#b040ff',.32*alpha);
  // 残像の輪：紫→赤の3層を少しずつ遅らせて重ねる
  for(let k=0;k<3;k++){const rr_=R*(1-k*.13),t0=Math.min(a1,tail+k*.35);g.fillStyle=`rgba(${k===1?'255,40,90':'180,60,255'},${alpha*(.42-k*.1)})`;
    g.beginPath();g.arc(P.x,P.y,rr_,t0,a1);g.arc(P.x,P.y,rr_*.45,a1,t0,true);g.closePath();g.fill()}
  // 刃先（白熱）
  const lead=Math.min(sweep,.8);g.fillStyle=`rgba(255,240,255,${.55*alpha})`;g.beginPath();g.arc(P.x,P.y,R*1.02,a1-lead,a1);g.arc(P.x,P.y,R*.72,a1,a1-lead,true);g.closePath();g.fill();
  // 金の爪痕（3本）
  const span=Math.min(sweep,2.2);for(const k of [.6,.78,.96]){g.strokeStyle=`rgba(255,215,90,${.9*alpha})`;g.lineWidth=k===.78?4:2.5;g.beginPath();g.arc(P.x,P.y,R*k,a1-span,a1);g.stroke()}
  // 振り切る瞬間、外側へ棘が飛び散る
  if(p>.2&&p<.75){const q=(p-.2)/.55,n=14;g.strokeStyle=`rgba(220,150,255,${(1-q)*.9})`;g.lineWidth=3*(1-q)+1;g.beginPath();
    for(let i=0;i<n;i++){const an=i/n*TAU+a0*.5,r0=R*(.95+q*.2),r1=R*(1.1+q*.45);g.moveTo(P.x+Math.cos(an)*r0,P.y+Math.sin(an)*r0);g.lineTo(P.x+Math.cos(an)*r1,P.y+Math.sin(an)*r1)}g.stroke()}
  g.restore();
}

  if(G.zoom>.002){const z=G.zc||P;g.translate(z.x,z.y);g.scale(1+G.zoom,1+G.zoom);g.translate(-z.x,-z.y)}
  drawWorld();drawSmokes();drawTutWorld();drawAmbient();drawRebirth();drawDevour();drawSink();drawCsSpeech();drawReady();
  g.restore();
  drawOverlays();
  drawHUD();drawTutPanel();
  if(touchMode&&state==='play')drawControls();
  drawBonusHUD();drawSea();drawBanner();drawCallout();
  if(state==='pause')drawPause();else if(state==='over')drawOver();else if(state==='clear')drawClear();else if(state==='pick')drawPick();else if(state==='offer')drawOffer();else if(state==='tutmenu')drawTutMenu();else if(state==='tutintro')drawTutIntro();else if(state==='stintro')drawStIntro();else if(state==='tutend')drawTutEnd();else if(state==='ad')drawAd();else if(state==='bres')drawBres();
}
function loop(ts){
  const rdt=Math.min(.05,(ts-last)/1000||0);last=ts;
  pollPad();update(rdt);draw();
  requestAnimationFrame(loop);
}
resetRun();resize();requestAnimationFrame(loop);

// iPhoneは操作前に作ると音が出なくなることがあるため、従来どおり最初のタップで準備する
