const bgC=document.createElement('canvas'),bgG=bgC.getContext('2d');
const decC=document.createElement('canvas'),decG=decC.getContext('2d');
let decReady=false;
function resize(){
  // スマホを横にしたらプレイを止める（横向きの間は「縦にして」の表示で覆う）
  // 「縦にして」の表示が実際に出る条件（スマホの横向き）と揃える。タブレット等の横長画面では止めない
  if(touchMode&&window.matchMedia&&matchMedia('(orientation:landscape) and (pointer:coarse) and (max-height:600px)').matches&&typeof pauseGame==='function')try{pauseGame('rotate')}catch(e){}
  const s=Math.min(innerWidth/W,innerHeight/H),dpr=Math.min(window.devicePixelRatio||1,2);
  const cw=Math.round(W*s),ch=Math.round(H*s);
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  const bw=Math.max(1,Math.round(cw*dpr)),bh=Math.max(1,Math.round(ch*dpr));
  let old=null;
  if(decReady){old=document.createElement('canvas');old.width=decC.width;old.height=decC.height;old.getContext('2d').drawImage(decC,0,0)}
  cv.width=bw;cv.height=bh;bgC.width=bw;bgC.height=bh;decC.width=bw;decC.height=bh;
  bgG.setTransform(bw/W,0,0,bh/H,0,0);renderBG();
  decG.setTransform(1,0,0,1,0,0);if(old)decG.drawImage(old,0,0,bw,bh);
  decG.setTransform(bw/W,0,0,bh/H,0,0);decReady=true;
}

function pickType(n){
  const pool=[['grunt',10]];
  if(n>=2)pool.push(['runner',4+n*.3]);
  pool.push(['gunner',Math.min(8,1.1+(n-1)*.7)]); // 銃撃手はWAVE1から少しだけ（約9%）出て、WAVEごとに増える
  if(n>=4)pool.push(['brute',1.2+n*.15]);
  if(n>=6)pool.push(['bazooka',1.2+(n-6)*.25]); // バズーカ兵は後半から
  // 技が要る敵：盾持ち（6面〜）、狙撃手（8面〜）、ナイフ使い（9面〜）
  if(n>=6)pool.push(['shield',1.5+(n-6)*.2]);
  if(n>=8)pool.push(['sniper',1+(n-8)*.15]);
  if(n>=9)pool.push(['slasher',1.5+(n-9)*.2]);
  let r=Math.random()*pool.reduce((s,p)=>s+p[1],0);
  for(const p of pool){r-=p[1];if(r<=0)return p[0]}
  return 'grunt';
}

function pickCrests(){

      const i=irand(0,GN-1),cx=i%GC,cy=Math.floor(i/GC);
      if(cy<1||cy>=GR-1||BLOCK[i]||G.crests.some(c=>Math.abs(c.i%GC-cx)+Math.abs(Math.floor(c.i/GC)-cy)<4))continue;

function hitEnemy(e,dmg,ang,kb,o){
  o=o||{};if(e.dead)return;
  if(e.type==='shield'&&e.shieldUp&&!(e.smoked>0)){ // むせている盾持ちは盾を構えられない
    const fromFront=Math.abs(angDiff(e.ang,Math.atan2(P.y-e.y,P.x-e.x)))<1.25;

      spark(e.x+Math.cos(e.ang)*16,e.y+Math.sin(e.ang)*16,ka,true);tone(1800,900,.12,'square',.08);noise(.08,.3,'highpass',3000);addShake(4);popText(e.x,e.y-32,'ガキン！','#cfd6e4',14,.6);return}

  if((e.type==='slasher'||e.type==='shield')&&(e.state==='windup'||e.state==='strike')&&o.melee&&!o.fin&&!o.crit){e.hp-=dmg;e.flash=.11;G.chain++;G.chainT=chainWin();G.chainPop=1;SFX.hit(false);
    spark(e.x-Math.cos(ang)*e.r*.5,e.y-Math.sin(ang)*e.r*.5,ang,false);bloodBurst(e.x,e.y,ang,6,200);if(e.hp<=0)killEnemy(e,ang,360*(1+.08*lv('heavy'))*KO_K,o);return}
  if(e.boss&&e.state==='dizzy')dmg*=1.6;
  // ボスは血溜まりの上だと弱る
  if(e.boss&&e.onBlood)dmg*=1.5; // 白鷺も他のボスと同じ1.5倍（v1.17で2倍→1.5倍）
  if(e.boss)dmg*=1+.25*lv('slayer');
  e.hp-=dmg;e.flash=.11;let k=kb*(1+.08*lv('heavy'));
  if(e.armor){
    if(e.boss)k*=o.fin?.18:.06;
    else if(o.fin){k*=.6;e.stun=.6;if(e.state!=='enter')e.state='chase'}
    else k*=.15;
  }else{
    // 通常ヒットでは敵の予備動作をキャンセルしない（フィニッシュ/爆発/クリティカルのみ潰せる）
    const busy=e.state==='windup'||e.state==='aim'||e.state==='fuse'||e.state==='strike';
    e.stun=Math.max(e.stun,o.fin?.55:.2);if(e.state!=='enter'&&(o.fin||!busy))e.state='chase';
    if(k>=420&&!o.crash){e.fly=.45;e.bset=new Set([e])} // ぶつけられた敵はさらに次へは飛ばない（連鎖は直後の1体まで）
  }
  e.vx=Math.cos(ang)*k;e.vy=Math.sin(ang)*k;
  G.chain++;G.chainT=chainWin();G.chainPop=1;G.maxChain=Math.max(G.maxChain,G.chain);G.wchain=Math.max(G.wchain||0,G.chain);
  G.mult=1+Math.min(4,Math.floor(G.chain/10)*.5);
  if([10,25,50,100,150,200,300].includes(G.chain))callout(rankOf(G.chain)+'!',G.chain+' HITS  x'+G.mult.toFixed(1));
  G.soul=Math.min(SOUL_MAX,G.soul+soulMul()*(o.fin?2:1)); // 普通に殴った分は少なめ（技で多くたまる）
  const big=o.fin||o.crit||dmg>=3;
  if(e.shiki)paperBurst(e.x,e.y,ang,big?6:4);else if(G.cause!=='rage'&&!e.burning){const pk=PAINT_K;if(o.spin)PAINT_K=SPIN_PAINT;bloodBurst(e.x,e.y,ang,big?14:8,big?340:230);PAINT_K=pk}
  spark(e.x-Math.cos(ang)*e.r*.5,e.y-Math.sin(ang)*e.r*.5,ang,big);
  // ダメージ数字はクリティカルの時だけ（床を見やすくするため）
  if(o.crit&&!o.wall)TEXTS.push({x:e.x+rand(-6,6),y:figTop(e)-8,txt:String(Math.round(dmg*10)),col:'#ffd54a',size:20,t:0,dur:.55,vy:-90});
  SFX.hit(big);

// 跳ね返した弾は雑魚を貫通し続ける（装甲・ボスに当たると止まる）
function reflect(b){
  tutComplete(6,.6);
  if(G.bonus&&!G.bonus.end&&!b.friendly&&G.bonus.kind!=='shiki'){G.bonus.ref++;G.bonus.got.push(b.axe?'axe':'bullet');if(G.bonus.ref>=G.bonus.need)bonusEnd(true)}

  b.friendly=true;b.life=2;b.perfect=pf;b.kills=0;b.hits=new Set();b.trail=[];let t=null,bd=1e9;
  for(const e of E){const d=dist(b.x,b.y,e.x,e.y);if(d<bd){bd=d;t=e}}
  const sp=Math.hypot(b.vx,b.vy)*(pf?2.6:2.1)*(lv('perfect')?1.14:1),a=t?Math.atan2(t.y-b.y,t.x-b.x):Math.atan2(-b.vy,-b.vx);
  b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;

  if(lv('split')&&!b.rocket)for(const da of [-.3,.3])B.push({...b,vx:Math.cos(a+da)*sp,vy:Math.sin(a+da)*sp,hits:new Set(),trail:[],kills:0,noPierce:true});
  spark(b.x,b.y,a,true);spark(b.x,b.y,a+.6,true);spark(b.x,b.y,a-.6,true);SFX.reflect(pf);if(pf)SFX.just();
  RINGS.push({x:b.x,y:b.y,r:6,R:pf?80:52,t:0,dur:.26,col:pf?'255,215,90':'127,243,255',w:pf?9:6});
  G.hitstop=Math.max(G.hitstop,pf?.13:.08);slow(pf?.55:.3,pf?.2:.35);
  G.flash=Math.max(G.flash,pf?.45:.25);G.flashCol=pf?'255,230,140':'150,240,255';G.zoom=Math.max(G.zoom,pf?.06:.04);addShake(pf?13:8);
  popText(b.x,b.y-18,pf?'PERFECT REFLECT!!':'REFLECT!!',pf?'#ffd54a':'#7ff3ff',pf?22:19,.85);
  G.score+=pf?300:100;
  G.chain++;G.chainT=chainWin();G.chainPop=1;G.soul=Math.min(SOUL_MAX,G.soul+soulMul()*(pf?18:6));G.wpf=(G.wpf||0)+(pf?1:0);

const JG_WIN=.2;
function justGuard(foe,a){

function breakShield(e){e.shieldUp=false;addShake(8);SFX.glass();popText(e.x,figTop(e)-8,'盾破壊！','#ffd54a',16,.9);

function hurtPlayer(dmg,sx,sy){
  if(P.dead||state!=='play'||DEV.god)return; // 開発者モードの無敵
  if(P.inv>0)return;
  dmg*=ENEMY_DMG;const atk=dmg;dmg*=1-.1*lv('armor'); // atk：敵の攻撃力（鎧で減る前）
  const a=Math.atan2(P.y-sy,P.x-sx);
  // ガードは正面（向いている方向±GUARD_ARC）からの攻撃だけ防げる
  const front=Math.abs(angDiff(P.face,a+Math.PI))<guardArc();
  if(P.guard&&!front)popText(P.x,P.y-50,'背後を取られた！','#ffb44a',13,.8);
  if(P.guard&&front){
    // ガード：ダメージを完全に防ぎ、敵の攻撃力と同じ数値だけライフが回復し、SOULもたまる。ノックバック小、連撃は途切れない
    const heal=atk*GUARD_HEAL*(1+.5*lv('guardh'));P.hp=Math.min(P.maxhp,P.hp+heal);P.guardLock=true;tutComplete(4,.6);
    G.soul=Math.min(SOUL_MAX,G.soul+heal);popText(P.x+26,P.y-30,'+'+Math.round(heal),'#7fd8ff',12,.6);
    // ジャストガード：攻撃が当たる直前（JG_WIN秒以内）にガードを押していた。相手を大きくよろけさせ、次の一撃は必ずクリティカル
    const just=G.time-(P.gStart||-9)<JG_WIN;
    if(lv('counter')&&!P.crit){P.crit=.7;popText(P.x,P.y-48,'COUNTER!','#7fd8ff',15,.7)}
    // 防いだ相手（近接攻撃なら攻撃元の近くの敵）を弾き飛ばして少し怯ませ、間合いを作る
    let foe=null,fd=48;for(const e of E){if(e.boss)continue;const dd=dist(e.x,e.y,sx,sy);if(dd<fd){fd=dd;foe=e}}
    if(foe){const ka=Math.atan2(foe.y-P.y,foe.x-P.x);foe.vx+=Math.cos(ka)*(foe.armor?220:380);foe.vy+=Math.sin(ka)*(foe.armor?220:380);foe.stun=Math.max(foe.stun,foe.armor?.25:.45);if(foe.state!=='enter')foe.state='chase';foe.wait=false}P.inv=.3;P.guardFx=.25;P.kx=Math.cos(a)*150;P.ky=Math.sin(a)*150;

  G.chain=0;G.mult=1;
  if(P.hp<=0)die(a);
}

    const pr=(24*grow+6)*R;drawRift(h.x,h.y+4,pr,h.seed,h.t,fade);
    if(h.t<.25&&Math.random()<.5)fx({k:'b',x:h.x+rand(-pr,pr),y:h.y+4,vx:rand(-60,60),vy:rand(-160,-60),life:.35,max:.35,sz:rand(1.5,3),col:pick(['#2a1a10','#3a0a0c','#1a1208'])});
    if(!h.deco){glow(h.x,h.y,46,'#5a20b0',.4*fade);
      // 沼の中で、沈んだ亡者たちの青白い指先がうごめく
      if(h.t>.1){g.globalAlpha=fade*.7;for(let k=0;k<5;k++){const ax=h.x+Math.cos(k*1.3+h.seed)*12,ay=h.y+5+Math.sin(k*1.7+h.seed)*3,ln=2+Math.abs(Math.sin(h.t*9+k))*3;
        g.strokeStyle='#120a18';g.lineWidth=1.4;g.lineCap='round';g.beginPath();g.moveTo(ax,ay);g.lineTo(ax+Math.sin(h.t*7+k),ay-ln);g.stroke()}g.globalAlpha=fade}}
    // 飾りの手（獲物のいない血の床）：沼から真上へ伸び、宙をかきむしる。腕は人物と一緒に後で描く（drawHandArms）
    // 立ちのぼる瘴気
    if(Math.random()<.3)fx({k:'powder',x:h.x+rand(-12,12),y:h.y,vx:rand(-10,10),vy:rand(-70,-30),life:.6,max:.6,sz:rand(2,4),col:'#5a3a70'});
    g.restore()}
}
// 怨霊の腕：人物より後（手前）に描く。獲物の手は沼の縁の左右・手前から伸びて、体（腰・胸・肩）をつかむ
function drawHandArms(){
  for(const h of HANDS){if(h.t<0)continue;const p=clamp(h.t/h.dur,0,1),grow=easeOut(Math.min(1,h.t/.3)),fade=p>.82?(1-p)/.18:1;
    g.save();g.globalAlpha=fade;
    if(h.deco){const R=1.15,tw=Math.sin(h.t*12+h.seed)*3,L=(30+(h.seed*7)%12)*grow;
      for(let k=0;k<h.n;k++){const a=-Math.PI/2+(k-(h.n-1)/2)*.5+Math.sin(h.seed+k)*.2,bx=h.x+Math.cos(a+Math.PI/2)*4*(k-(h.n-1)/2),by=h.y+4;
        zArm(bx,by,bx+Math.cos(a)*L*.5+tw,by+Math.sin(a)*L*.5,bx+Math.cos(a)*L+tw,by+Math.sin(a)*L,R,Math.min(1,h.t/.5)*.45,h.seed+k,.6)}}
    else{const R=1.25,n=h.e&&h.e.boss?3:2+((h.seed*10|0)%2);
      // 左右（3本なら手前も）の沼の縁から、斜め上へ伸びて敵の肩・胴をつかむ
      for(let k=0;k<n;k++){const side=n===3&&k===2?0:(k?1:-1),tw=Math.sin(h.t*16+k*1.7)*1.5,rise=grow;
        const bx=h.x+side*20,by=h.y+8,tx=h.x+side*7+tw,ty=h.y+8-(26*rise)+(side?0:-4),mx=h.x+side*19,my=h.y-6*rise;
        zArm(bx,by,mx,my,tx,ty,R,Math.min(1,h.t/.45),h.seed+k,1)}}
    g.restore()}
}
// 手が出てくる裂け目：床が割れて開いた、いびつな穴。ふちはギザギザに欠け、外へ向かってひびが走る。
// 奥は真っ黒で、ふちだけ紫にくすぶる（形は穴ごとに違い、開ききるまで少しずつ広がる）
function drawRift(x,y,r,sd,t,fade){
  const rn=k=>{const v=Math.sin(sd*91.7+k*12.31)*43758.5453;return v-Math.floor(v)},N=18,pts=[];
  for(let k=0;k<N;k++){const a=k/N*TAU,j=(rn(k)<.3?.5:.78)+rn(k+100)*.42,rr=r*j*(1+Math.sin(t*14+k)*.03);pts.push([x+Math.cos(a)*rr*1.15,y+Math.sin(a)*rr*.5])}
  // 外へ走るひび（床の割れ目）
  g.strokeStyle=`rgba(10,4,14,${.85*fade})`;g.lineWidth=1.6;g.lineCap='round';g.beginPath();
  for(let k=0;k<5;k++){const a=rn(k+40)*TAU,l=r*(.9+rn(k+50)*.9);let px=x+Math.cos(a)*r*.8,py=y+Math.sin(a)*r*.36;g.moveTo(px,py);
    for(let m=0;m<3;m++){const aa=a+(rn(k*7+m)-.5)*.9;px+=Math.cos(aa)*l/3;py+=Math.sin(aa)*l/3*.45;g.lineTo(px,py)}}
  g.stroke();
  // 割れた床のふち（少し持ち上がった欠片の明るい縁）
  g.fillStyle=`rgba(80,60,90,${.5*fade})`;g.beginPath();pts.forEach(([px,py],k)=>{const q=[x+(px-x)*1.18,y+(py-y)*1.18+1];k?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])});g.closePath();g.fill();
  // 穴：奥ほど暗い
  g.beginPath();pts.forEach(([px,py],k)=>k?g.lineTo(px,py):g.moveTo(px,py));g.closePath();
  const gr=g.createRadialGradient(x,y,0,x,y,r*1.1);gr.addColorStop(0,'rgba(0,0,0,.98)');gr.addColorStop(.7,'rgba(8,0,14,.95)');gr.addColorStop(1,'rgba(40,10,60,.9)');g.fillStyle=gr;g.fill();
  // ふちでくすぶる紫の光
  g.strokeStyle=`rgba(160,70,235,${(.45+Math.sin(t*18+sd)*.15)*fade})`;g.lineWidth=1.2;g.lineJoin='round';g.stroke();
}
function drawHandDark(){if(handDark<=0)return;const a=Math.min(1,handDark*1.4);
  const vg=g.createRadialGradient(W/2,H/2,H*.18,W/2,H/2,H*.7);vg.addColorStop(0,`rgba(10,0,18,${.12*a})`);vg.addColorStop(1,`rgba(8,0,14,${.78*a})`);g.fillStyle=vg;g.fillRect(0,0,W,H)}
// 200Lドラム缶：少し上から見た鋼の円筒。金属の映り込み・ふたの縁と2つの栓・胴の2本の輪（盛り上がり）・塗装のはがれと錆・へこみ・「火気厳禁」の表示。
// 殴られて穴が開くと少し傾き、穴から黒い油が垂れる
function drawDrum(pr){
  const R=14,Hh=36,top=-21,bot=top+Hh,ey=4.6,sd=(pr.x*7+pr.y*3)%10/10; // sd：ドラムごとの汚れ方の違い
  // 床の影と、足元にこぼれた油じみ
  g.fillStyle='rgba(0,0,0,.5)';g.beginPath();g.ellipse(pr.x+3,pr.y+bot+1,R+5,ey+2.4,0,0,TAU);g.fill();
  if(pr.used){g.fillStyle='rgba(18,10,4,.75)';g.beginPath();g.ellipse(pr.x+9,pr.y+bot+3,10,3.4,0,0,TAU);g.fill();g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.ellipse(pr.x+7,pr.y+bot+2,4,1,0,0,TAU);g.fill()}
  g.save();g.translate(pr.x,pr.y);if(pr.used)g.rotate(.12);
  // 胴：左右の端は暗く、左寄りに光の帯（円筒の映り込み）
  const body=g.createLinearGradient(-R,0,R,0);
  [[0,'#3a0a07'],[.12,'#7a1810'],[.3,'#c8402e'],[.38,'#e06a52'],[.48,'#b0281c'],[.75,'#7e1a12'],[1,'#2e0805']].forEach(([o,c])=>body.addColorStop(o,c));
  g.fillStyle=body;g.beginPath();g.moveTo(-R,top);g.lineTo(-R,bot);g.ellipse(0,bot,R,ey,0,Math.PI,0,true);g.lineTo(R,top);g.closePath();g.fill();
  // 胴の2本の輪：上側に光、下側に影を入れて盛り上がりを出す
  for(const y of [top+Hh*.33,top+Hh*.67]){
    g.strokeStyle='rgba(0,0,0,.55)';g.lineWidth=1.6;g.beginPath();g.ellipse(0,y+1,R,ey,0,0,Math.PI);g.stroke();
    g.strokeStyle='rgba(255,170,150,.55)';g.lineWidth=1.1;g.beginPath();g.ellipse(0,y-.6,R,ey,0,.15,Math.PI-.15);g.stroke()}
  // 塗装のはがれ（下地の鉄）と、錆の垂れ筋
  g.fillStyle='rgba(70,62,58,.85)';for(let i=0;i<4;i++){const x=-R+3+((sd*9+i*7.3)%(R*2-6)),y=top+6+((sd*13+i*11)%(Hh-10));g.beginPath();g.ellipse(x,y,1.6+i%2,1.1,i,0,TAU);g.fill()}
  g.fillStyle='rgba(110,52,18,.55)';for(let i=0;i<3;i++){const x=-R+4+((sd*17+i*9)%(R*2-8));g.fillRect(x,top+3,1.2,6+((i*5+sd*10)%9))}
  // へこみ（右下の暗いくぼみ）
  g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(6,bot-7,3.6,2.4,.4,0,TAU);g.fill();g.fillStyle='rgba(255,140,120,.25)';g.beginPath();g.ellipse(4.8,bot-8.4,2,1,.4,0,TAU);g.fill();
  // 「火気厳禁」の表示：白地に赤い文字の札と、引火性の黄色い菱形
  rr(-8,top+Hh*.39,12,8,1,'rgba(235,228,214,.92)');g.fillStyle='#b01818';g.font='900 4.2px '+JP;g.textAlign='center';g.fillText('火気',-2,top+Hh*.39+3.8);g.fillText('厳禁',-2,top+Hh*.39+7.6);g.textAlign='left';
  g.save();g.translate(8,top+Hh*.5);g.rotate(Math.PI/4);g.fillStyle='#e8b81a';g.fillRect(-3,-3,6,6);g.strokeStyle='#1a1a1a';g.lineWidth=.6;g.strokeRect(-3,-3,6,6);g.restore();
  g.fillStyle='#1a1a1a';g.beginPath();g.moveTo(8,top+Hh*.5-2.2);g.quadraticCurveTo(9.6,top+Hh*.5,8,top+Hh*.5+1.8);g.quadraticCurveTo(6.4,top+Hh*.5,8,top+Hh*.5-2.2);g.fill();
  // ふた：縁（巻き締め）の厚み、少しへこんだ面、大小2つの栓
  const lid=g.createLinearGradient(-R,top-ey,R,top+ey);lid.addColorStop(0,'#d05a44');lid.addColorStop(.5,'#9a2216');lid.addColorStop(1,'#5a100a');
  g.fillStyle=lid;g.beginPath();g.ellipse(0,top,R,ey,0,0,TAU);g.fill();
  g.strokeStyle='#3a0805';g.lineWidth=1.8;g.stroke();g.strokeStyle='rgba(255,190,170,.6)';g.lineWidth=.8;g.beginPath();g.ellipse(0,top-.4,R-1.2,ey-.9,0,Math.PI*1.05,Math.PI*1.95);g.stroke();
  g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(0,top+.6,R-3.4,ey-1.6,0,0,TAU);g.fill();
  for(const [x,r] of [[-6.5,2.4],[6,1.5]]){g.fillStyle='#6e6a66';g.beginPath();g.ellipse(x,top,r,r*.42,0,0,TAU);g.fill();g.fillStyle='#b8b4ae';g.beginPath();g.ellipse(x-.3,top-.3,r*.6,r*.25,0,0,TAU);g.fill()}
  // 底の縁
  g.strokeStyle='rgba(0,0,0,.6)';g.lineWidth=1.4;g.beginPath();g.ellipse(0,bot,R,ey,0,.1,Math.PI-.1);g.stroke();
  // 輪郭
  g.strokeStyle='rgba(10,2,2,.85)';g.lineWidth=1.2;g.beginPath();g.moveTo(-R,top);g.lineTo(-R,bot);g.moveTo(R,top);g.lineTo(R,bot);g.stroke();
  // 穴と、そこから垂れる油
  if(pr.used){const hx=-5,hy=top+Hh*.78;g.fillStyle='#0c0603';g.beginPath();g.ellipse(hx,hy,2.6,2,0,0,TAU);g.fill();g.strokeStyle='rgba(200,190,180,.7)';g.lineWidth=.7;g.beginPath();g.arc(hx,hy,2.8,-2.4,-.4);g.stroke();
    const dr=(G.time*1.4+sd)%1;g.fillStyle='rgba(20,12,4,.9)';g.fillRect(hx-.8,hy+1.5,1.6,bot-hy+2);g.beginPath();g.arc(hx,hy+2+dr*(bot-hy),1.5,0,TAU);g.fill()}
  g.restore();
}
function drawGimmicks(){

    if(!w.done){const p=clamp(w.t/w.dur,0,1),rr_=w.r*(1.3-p*.3);
      g.fillStyle=`rgba(0,0,0,${.25+p*.4})`;g.beginPath();g.ellipse(w.x,w.y,rr_,rr_*.6,0,0,TAU);g.fill();

      txt('鉄骨落下',w.x,w.y+4,12,`rgba(255,210,70,${.6+Math.sin(G.time*20)*.3})`,'center',JP,['#000',3],false,900);

        drawBeam(w.x,yy,an,sc,.35+q*.65)}}

    rr(0,-sp.w/2,L,sp.w,sp.w/2,sp.lit?'rgba(255,110,20,.28)':sp.oil?'rgba(24,16,10,.72)':'rgba(190,130,40,.5)');

    g.restore();g.globalAlpha=1;
    if(sp.lit){const c=Math.cos(sp.a),sn=Math.sin(sp.a);for(let l=10;l<L;l+=36)glow(sp.x+c*l,sp.y+sn*l,sp.w*.85,'#ff6a1a',.32*f)}}
  for(const pr of PROPS){
    const ready=!pr.used&&!pr.lit&&pr.k!=='cart';
    if(ready){const pl=.25+Math.sin(G.time*4+pr.x)*.15;g.strokeStyle=`rgba(255,255,255,${pl})`;g.lineWidth=1.2;g.beginPath();g.arc(pr.x,pr.y,pr.r+9,0,TAU);g.stroke()}
    if(pr.k==='dyn'){if(pr.used)continue;
      // ダイナマイト1本：赤い筒＋導火線。点火すると導火線の先が火花を散らし、本体が点滅する

      g.fillStyle='#2a1810';g.fillRect(-6,-6,12,2);g.fillRect(-6,4,12,2);
      g.strokeStyle='#d8c8a0';g.lineWidth=1.6;g.beginPath();g.moveTo(0,-14);g.quadraticCurveTo(5,-20,2,-25);g.stroke();
      if(pr.lit){glow(2,-25,18,'#ffb030',.9);circ(2,-25,2.2,'#fff3b0')}

        g.fillStyle='rgba(255,255,255,.3)';g.fillRect(-5,-8,2.5,20);g.fillStyle='#d8cdb0';g.beginPath();g.moveTo(-3,-22);g.lineTo(3,-22);g.lineTo(5,-31);g.lineTo(-1,-28);g.closePath();g.fill();

    if(sh.vis){g.strokeStyle=`rgba(255,255,255,${.6*f})`;g.lineWidth=2;g.beginPath();g.arc(sh.x,sh.y,sh.r*.82,0,TAU);g.stroke()}}

/* ---------------- ステージごとの空気（見た目と音だけ。遊び方は変えない） ----------------

const AMB={

/* ---------------- 囲い込み制圧 ----------------
   塗ったマスでぐるりと囲まれ、外周に通じていない未塗りの領域は、一気に血で染まる。
   3マス以上の制圧では、中にいた雑魚も血の海に沈む（用心棒・ボスには大ダメージ） */
// 判定するのは「今塗られたマス」の上下左右から始まる未塗り領域だけ。
// 掃除屋が塗り地帯の中に開けた穴は、プレイヤーがその隣を塗って閉じるまで穴のまま残る
let capNew=[],capFilling=false;
const EDGE_CAP=8;
function captureCheck(){
  const starts=capNew;capNew=[];if(G.isBossWave||G.phase!=='fight'||state!=='play')return;
  for(const r of enclosed(starts)){if(G.phase!=='fight')break;capture(r)}
}
// starts（塗られたマス）の隣から始まる未塗り領域のうち、囲いが成立しているものを返す
function enclosed(starts){
  const seen=new Uint8Array(GN),regions=[],from=[];
  for(const i of starts){const cx=i%GC,cy=(i/GC)|0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx>=0&&ny>=0&&nx<GC&&ny<GR)from.push(ny*GC+nx)}}
  for(const i of from){if(DONE[i]||seen[i])continue;
    const comp=[],st=[i];seen[i]=1;let edge=false;
    while(st.length){const j=st.pop();comp.push(j);const cx=j%GC,cy=(j/GC)|0;if(cx===0||cy===0||cx===GC-1||cy===GR-1)edge=true;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=GC||ny>=GR)continue;const k=ny*GC+nx;if(!DONE[k]&&!seen[k]){seen[k]=1;st.push(k)}}}
    // 壁に接する範囲も、小さければ（EDGE_CAPマス以下）壁を囲いの一部として制圧できる
    if(!edge||comp.length<=EDGE_CAP)regions.push(comp);
  }
  return regions;
}
// 「あと1マスで囲える」予告：未塗りのマスを1つ塗ったと仮定して囲いが成立するかを試し、取れるマスの多い順に最大2か所を光らせる
// 偶然の制圧を「狙って取る」ものにするため。塗りの状態が変わった時だけ計算し直す
let CAPPV=[],pvVer=-1,pvT=0;
function updateCapPreview(dt){
  pvT-=dt;
  if(G.isBossWave||G.tutMode||G.phase!=='fight'){CAPPV=[];return}
  if(pvVer===paintVer||pvT>0||CAPQ.length)return;
  pvVer=paintVer;pvT=.15;const c=[];
  for(let i=0;i<GN;i++){if(DONE[i])continue;
    DONE[i]=1;const rs=enclosed([i]);DONE[i]=0;
    const tiles=[].concat(...rs);if(tiles.length>=2)c.push({i,tiles,n:tiles.length+1})}
  // 同じ囲いを別のマスから閉じる候補は、取れる数の多い方だけ残す
  c.sort((a,b)=>b.n-a.n);CAPPV=[];const used=new Set();
  for(const v of c){if(CAPPV.length>=2)break;if(v.tiles.some(j=>used.has(j))||used.has(v.i))continue;CAPPV.push(v);for(const j of v.tiles)used.add(j);used.add(v.i)}
}
// マスの集まりの外周だけを線で描く
function tileOutline(set){
  g.beginPath();
  for(const j of set){const t=tileRect(j),cx=j%GC,cy=(j/GC)|0;
    if(cy===0||!set.has(j-GC)){g.moveTo(t.x,t.y);g.lineTo(t.x+t.w,t.y)}
    if(cy===GR-1||!set.has(j+GC)){g.moveTo(t.x,t.y+t.h);g.lineTo(t.x+t.w,t.y+t.h)}
    if(cx===0||!set.has(j-1)){g.moveTo(t.x,t.y);g.lineTo(t.x,t.y+t.h)}
    if(cx===GC-1||!set.has(j+1)){g.moveTo(t.x+t.w,t.y);g.lineTo(t.x+t.w,t.y+t.h)}}
  g.stroke();
}
function drawCapPreview(){
  const pl=.5+Math.sin(G.time*6)*.5;

    const set=new Set(c.tiles);

    g.fillStyle=`rgba(255,30,60,${.07+pl*.07})`;for(const j of c.tiles){const t=tileRect(j);g.fillRect(t.x,t.y,t.w,t.h)}

    g.strokeStyle=`rgba(255,${150+pl*105|0},${170+pl*85|0},${.75+pl*.25})`;g.lineWidth=3;g.strokeRect(t.x+3,t.y+3,t.w-6,t.h-6);
    if(PAINT[c.i]>0){g.fillStyle='rgba(255,230,235,.85)';g.fillRect(t.x+6,t.y+t.h-9,(t.w-12)*clamp(PAINT[c.i],0,1),3)}

}
// 制圧は、輪を閉じたマスの隣から波紋のように順番に染まっていく（中の敵は波が届いた瞬間に倒れる）
let CAPQ=[];
function capture(tiles){
  const n=tiles.length,set=new Set(tiles);let sx=0,sy=0;G.wcap=(G.wcap||0)+n;
  for(const j of tiles){const t=tileRect(j);sx+=t.x+t.w/2;sy+=t.y+t.h/2}
  const cx=sx/n,cy=sy/n,dd=new Map([[tiles[0],0]]),q=[tiles[0]];
  while(q.length){const j=q.shift(),x=j%GC,y=(j/GC)|0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const k=(y+dy)*GC+(x+dx);if(x+dx<0||x+dx>=GC||y+dy<0||y+dy>=GR||!set.has(k)||dd.has(k))continue;dd.set(k,dd.get(j)+1);q.push(k)}}
  for(const j of tiles){const k=dd.get(j)||0;CAPQ.push({i:j,at:G.time+k*.045,k,n,cx,cy})}
  const pts=100*n*G.wave;G.score+=pts;tutComplete(3,.7);
  // 囲った範囲の外周を光らせて、「どこを・なぜ取れたか」を見せる
  fx({k:'capline',set,cx,cy,R:Math.sqrt(n)*TS*.8+30,life:1,max:1});
  if(n>=3){
    callout('制 圧 ！',n+'マスを一気に血で染めた　+'+pts,'#ff2f5f');G.callout.dur=1.6;
    SFX.boom();SFX.tile();addShake(Math.min(22,8+n));G.flash=Math.max(G.flash,.3);G.flashCol='255,20,50';G.hitstop=Math.max(G.hitstop,.06);

// まだ囲われているか：未塗りのマスをたどって、壁際に出ても小さければ（EDGE_CAP以下）囲われているとみなす

}

// a: 攻撃する向き（タッチでタップした方向）。省略時は移動入力／今の向き
function pressAttack(a){P.atkBuf=.25;P.atkA=a==null?null:a}
function screenAction(p,key){
  if(state==='ad')return;
  // エンディング：タップで次の場面へ（最後の場面なら結果画面へ）
  if(state==='epilogue'){if(stateT<.6)return;const nx=EPI.find(sc=>sc.t0>stateT+.05);SFX.ui();if(nx)stateT=nx.t0;else{state='clear';stateT=0}return}
  // ボーナス集計：並べている途中なら一気に全部出す。出し終わっていれば次へ
  if(state==='bres'){const r=G.bres;if(r.doneT<0){r.n=r.items.length;r.tick=0}else if(r.doneT>.6)finishBonus();return}
  if(state==='pick'){if(p){const i=cardAt(p);if(i>=0)pickCard(i)}else pickCard(G.cardSel);return}
  if(state==='offer'){if(stateT<.4)return;if(p&&inR(p,SCR.oad)){rewardAd(()=>{G.pickAdUsed=true;openPick(true)});return}if(!p||inR(p,SCR.onext)){SFX.ui();afterPick()}return}
  if(state==='tutintro'){if(stateT>.3){state='play';stateT=0;SFX.ui()}return}
  if(state==='tutend'){if(stateT>.8){state='title';stateT=0;resetRun();skipPrologue();SFX.ui()}return}
  if(state==='stintro'){if(stateT>.3){SFX.ui();stateT=0;if(++G.cardI>=G.cards.length){G.cards=null;state='play'}}return}
  if(state==='tutmenu'){if(stateT<.3)return;if(p){if(inR(p,SCR.tnext))tutChoice(true);else if(inR(p,SCR.tretry))tutChoice(false);else if(inR(p,SCR.tquit))tutQuit();return}if(key==='quit'){tutQuit();return}tutChoice(key!=='retry');return}
  if(state==='tutsel'){
    if(p){if(inR(p,TUT_ALL)){newGame(true);return}if(tutDone)for(let n=1;n<=TUT_STEPS;n++)if(inR(p,TUTSEL(n))){startTutAt(n,true);return}if(inR(p,SCR.tsback)){state='title';stateT=0;skipPrologue();SFX.ui()}return}
    if(key==='title'){state='title';stateT=0;skipPrologue()}return}
  // タイトル：音がまだ鳴らせない状態なら、最初の1回は「音をONにするだけ」（BGMを聴かせるため）。2回目で開始
  // プロローグ中のタップ（クリック・キー）は読み飛ばし：すぐロゴとボタンを出す（音の準備もこのタップで済ませる）
  if(state==='title'&&stateT<LOGO_T+.6){skipPrologue();return}
  if(state==='title'){if(!muted&&!(AC&&AC.state==='running')&&!G.titleTap){G.titleTap=1;return}
    if(p){if(inR(p,SCR.tstart)){if(DEVSHIFT)openDev();else devHold={t:performance.now()}}else if(inR(p,SCR.ttut)){state='tutsel';stateT=0;SFX.ui()}else if(inR(p,SCR.tendless)){if(endlessOpen())newEndless();else SFX.wall()}return}
    if(key==='tut'){state='tutsel';stateT=0;SFX.ui();return}
    newGame(key==='tut');return}
  if(state==='dev'){
    if(!p){if(key==='title'){state='title';stateT=0;skipPrologue()}return}
    for(let n=1;n<=20;n++)if(inR(p,DEV_BTN(n))){devStart(n);return}
    for(let k=0;k<3;k++)if(inR(p,DEV_BON(k))){devBonus(k);return}
    for(let n=1;n<=TUT_STEPS;n++)if(inR(p,DEV_TUT(n))){devTut(n);return}
    if(inR(p,DEV_UI.endless)){devStart(21);return}
    if(inR(p,DEV_UI.god)){DEV.god=!DEV.god;SFX.ui();return}
    // 誤って押さないよう、3秒以内にもう一度押した時だけ実行
    if(inR(p,DEV_UI.reset)){if(DEV.rstAsk&&performance.now()-DEV.rstAsk<3000)factoryReset();else{DEV.rstAsk=performance.now();SFX.ui()}return}
    if(inR(p,DEV_UI.close)){state='title';stateT=0;skipPrologue();SFX.ui()}return}
  if(state==='over'){if(stateT<.9)return;
    if(p){if(canRevive()&&inR(p,SCR.orevive)){rewardAd(revive);return}
      if(inR(p,SCR.oshare)){shareResult();return}
      if(inR(p,SCR.otitle)){state='title';stateT=0;resetRun();skipPrologue();return}
      if(inR(p,SCR.oretry))restartRun();return}
    if(key==='title'){state='title';stateT=0;resetRun();skipPrologue();return}
    restartRun();return}
  if(state==='pause'){
    if((p&&inR(p,SCR.ptitle))||key==='title'){state='title';stateT=0;resetRun();return}
    state='play';return;
  }
  if(state==='clear'){
    if(stateT<1.2)return;

function startAttack(ix,iy){
  const st=P.comboWin>0?P.stage:0,S=STAGES[st];
  // 自動追尾なし：入力方向（無ければ今向いている方向）へ攻撃し、その方向へ少しだけ踏み込む
  if(P.atkA!=null){P.face=P.atkA;P.atkA=null}else if(Math.hypot(ix,iy)>.3)P.face=Math.atan2(iy,ix);
  // 4段目の回転攻撃は踏み込まず、その場で回る（背後の敵にも届くように）
  if(st===3){P.lx=P.ly=0;P.lt=0}else{P.lx=Math.cos(P.face)*140;P.ly=Math.sin(P.face)*140;P.lt=.1}

function doHit(a){
  const S=a.S,range=S.range*(1+.105*lv('reach')),dmg=S.dmg*(a.crit?(a.crit===true?2.5:1+1.5*a.crit):1)*powMul(),fin=a.st===3||a.crit;
  let n=0;
  for(const e of [...E]){
    const d=dist(P.x,P.y,e.x,e.y);if(d>range+e.r)continue;
    const an=Math.atan2(e.y-P.y,e.x-P.x);
    if(S.arc<TAU&&Math.abs(angDiff(P.face,an))>S.arc/2&&d>e.r+P.r+4)continue;
    const sm=!a.crit&&e.smoked>0&&!e.boss; // むせている敵への攻撃は、クリティカルになる
    hitEnemy(e,sm?dmg*2.5:dmg,an,S.kb*(a.crit||sm?1.4:1),{fin:fin||sm,crit:a.crit||sm,spin:a.st===3,melee:true});n++;

 P.guardFx-=dt;P.gT=P.guard?Math.min(1,(P.gT||0)+dt*9):0;

/* ---------------- enemies ---------------- */
const inside=e=>e.x>AX0+e.r&&e.x<AX1-e.r&&e.y>AY0+e.r&&e.y<AY1-e.r;

const MAX_MELEE=3;
// WAVE1だけ易しく：敵の出現数と攻撃の頻度を75%に（同時に出る数の上限×0.75と出現間隔×1.15で、画面上の数が約75%に。攻撃は1サイクル全体が÷0.75の長さになるよう休みを延ばす）
const waveEase=()=>G.wave===1?.75:1;
function meleeBusy(){let n=0;for(const o of E)if((o.type==='grunt'||o.type==='runner'||o.type==='shield'||o.type==='slasher')&&(o.state==='windup'||o.state==='strike'))n++;return n}
function mv(e,a,s,dt){if(e.boss&&e.onBlood)s*=.75; // 血溜まりの上のボスは足を取られて遅い

  if(nx&&G.gim==='edge'&&!e.boss&&sp>260){const pc=G.cause;G.cause='edge';popText(e.x,e.y-30,'転落！','#ffd54a',17,.9);G.score+=Math.round(150*G.mult);killEnemy(e,Math.atan2(0,-nx),0,{fall:true});G.cause=pc;return true}

    RA={hi:mk('highpass',2200,.5,0),lo:mk('bandpass',800,.45,2.3),gust:1,tgt:1,gt:0,lag:1,dt:0,t:0}}

      const tr=b.trail||(b.trail=[]);tr.push({x:b.x,y:b.y});if(tr.length>10)tr.shift();
      for(const e of [...E]){
        if(b.hits&&b.hits.has(e))continue;if(dist(b.x,b.y,e.x,e.y)>=e.r+8)continue;
        const kill=!e.armor&&!e.boss;if(b.hits)b.hits.add(e);
        hitEnemy(e,kill?e.hp+1:(b.big?16:4)*(b.perfect?2:1)*(1+.5*lv('payback')),Math.atan2(b.vy,b.vx),520,{fin:true,shot:true});
        if(!kill||b.noPierce){b.life=0;if(kill)popText(e.x,e.y-28,'SHOT KILL',b.perfect?'#ffd54a':'#7ff3ff',15,.8);break}
        b.kills=(b.kills||0)+1;G.score+=150*b.kills;G.hitstop=Math.max(G.hitstop,.06);G.zoom=Math.max(G.zoom,.03);addShake(9);
        popText(e.x,e.y-28,b.kills>1?'PIERCE ×'+b.kills:'SHOT KILL',b.perfect?'#ffd54a':'#7ff3ff',b.kills>1?19:15,.8);
      }
    }
    else if(!P.dead&&dist(b.x,b.y,P.x,P.y)<P.r+(b.big?9:5)){
      if(P.inv<=0){hurtPlayer(b.dmg,b.x-b.vx*.1,b.y-b.vy*.1);b.life=0;if(b.rocket)explode(b.x,b.y,70,false)}
    }
  }
  B=B.filter(b=>b.life>0&&b.x>-30&&b.x<W+30&&b.y>AY0-30&&b.y<H+30);
  // fx
  for(const f of FX){
    f.life-=dt;f.x+=f.vx*dt||0;f.y+=f.vy*dt||0;
    if(f.k==='dustc'){const k=Math.exp(-3.2*dt);f.vx*=k;f.vy=f.vy*k-8*dt}else if(f.k==='chip')f.vy+=600*dt;
    if(f.k==='b'){const k=Math.exp(-7*dt);f.vx*=k;f.vy*=k;if(f.life<=0&&Math.random()<.25){decG.fillStyle='rgba(110,0,15,.6)';decG.beginPath();decG.arc(f.x,f.y,f.sz*.7,0,TAU);decG.fill();if(!f.np){const pk=PAINT_K;PAINT_K=f.pk||1;paint(f.x,f.y,5,.04);PAINT_K=pk}}}
    else if(f.k==='fire'||f.k==='smoke'||f.k==='gold'||f.k==='powder'){const k=Math.exp(-4*dt);f.vx*=k;f.vy*=k}
    else if(f.k==='ash'){const k=Math.exp(-2.2*dt);f.vx*=k;f.vy=f.vy*k-30*dt;f.rot+=f.vr*dt}
    else if(f.k==='paper'){const k=Math.exp(-5*dt);f.vx*=k;f.vy=f.vy*k+40*dt;f.rot+=f.vr*dt}
  }
  FX=FX.filter(f=>f.life>0);
  for(const r of RINGS)r.t+=dt;RINGS=RINGS.filter(r=>r.t<r.dur);
  for(const t of TEXTS){t.t+=rdt;t.y+=t.vy*rdt;t.vy*=Math.exp(-3*rdt);if(t.follow){t.x=t.follow.x;t.y=figTop(t.follow)-14}}
  TEXTS=TEXTS.filter(t=>t.t<t.dur);
  updateWave(dt);
}

// プレイ中の文字は一段階大きく（TXT_SCALE倍）。画面からはみ出す長さの文字は、画面内に収まるよう横幅を詰めて描く
let TXT_SCALE=1;
function txt(s,x,y,size,col,align,font,stroke,italic,weight,fitW){
  align=align||'left';
  g.font=(italic?'italic ':'')+(weight||900)+' '+(size*TXT_SCALE)+'px '+(font||EN);g.textAlign=align;g.textBaseline='alphabetic';
  // 原点を動かして描いている文字（中央の大きな告知・コンボ数など）は、x が画面の座標ではないので詰めない
  const tf=g.getTransform(),moved=Math.abs(tf.e/(cv.width/W))>20||Math.abs(tf.f/(cv.height/H))>20;
  const mw=fitW||(moved?undefined:align==='center'?Math.max(40,2*Math.min(x,W-x)-12):align==='right'?Math.max(40,x-6):Math.max(40,W-x-6));
  if(stroke){g.lineJoin='round';g.lineWidth=stroke[1];g.strokeStyle=stroke[0];mw?g.strokeText(s,x,y,mw):g.strokeText(s,x,y)}
  g.fillStyle=col;mw?g.fillText(s,x,y,mw):g.fillText(s,x,y);
}
function rrPath(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function rr(x,y,w,h,r,col){g.fillStyle=col;rrPath(x,y,w,h,r);g.fill()}
function circ(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}
function shadow(x,y,r){g.fillStyle='rgba(0,0,0,.45)';g.beginPath();g.ellipse(x,y+r*.35,r*1.15,r*.62,0,0,TAU);g.fill()}

function dirOf(a){const c=Math.cos(a),s=Math.sin(a);return Math.abs(c)>=Math.abs(s)*.85?(c>0?'right':'left'):(s>0?'down':'up')}
// 足元(x,y)を基準に1フレーム描く。tintで色を被せる（被弾フラッシュ・残像・怨念モード）
function drawFrame(anim,dir,idx,x,y,alpha,flip,tint,tintA){
  const fl=AS&&AS.frames[anim+'_'+dir];if(!fl||!imgOK(SPR))return false;
  const r=fl[((idx%fl.length)+fl.length)%fl.length],sc=SPRSC[anim],w=r[2]*sc,h=r[3]*sc;
  let srcI=SPR,sx=r[0],sy=r[1];
  if(tint){tg.globalCompositeOperation='source-over';tg.globalAlpha=1;tg.clearRect(0,0,256,256);tg.drawImage(SPR,r[0],r[1],r[2],r[3],0,0,r[2],r[3]);
    tg.globalCompositeOperation='source-atop';tg.globalAlpha=tintA==null?1:tintA;tg.fillStyle=tint;tg.fillRect(0,0,r[2],r[3]);srcI=TMP;sx=0;sy=0}

// 現在の状態から使うアニメ・向き・コマを決める
function girlPose(face){
  let anim='walk',idx=0,dir=dirOf(face),flip=false;
  const a=P.atk,sp=Math.hypot(P.vx,P.vy);
  if(P.dead){anim='die';idx=G.deathT<.35?0:1}
  else if(a){anim='atk';idx=Math.min(2,Math.floor(clamp(a.t/a.dur,0,.999)*3.4));
    // 4段目の回転攻撃：斬撃の軌跡と同じ速さで体の向きを一周させる
    if(a.st===3){const p=clamp(a.t/a.dur,0,1),e=1-Math.pow(1-Math.min(1,p*1.6),3);face=P.face+a.S.from+(a.S.to-a.S.from)*e;dir=dirOf(face)}
    // 素材の攻撃モーションはどの行も右向きなので、左は反転、上下は専用行を使う
    if(dir==='left'){dir='right';flip=true}else if(dir==='down'||dir==='up')flip=Math.cos(face)<0}
  else if(sp>30&&!P.guard){anim='run';idx=Math.floor(P.walk*.55)}
  else if(sp>12){anim='walk';idx=Math.floor(P.walk*1)}
  // 素材の「右向き」の行は実際には左を向いているため、右は左向きの絵を左右反転して使う
  if(anim!=='atk'&&dir==='right'){dir='left';flip=true}
  return{anim,idx,dir,flip};
}
// SOUL満タン中の金色のオーラ（炎のように揺らめく光＋立ちのぼる光の粒＋ときどき走る稲妻）
// ガードの盾：厚みのある弧の刃。両端は尖らせ、中は区切り線でパネル状に。光の筋が左右に走り、防いだ瞬間は白く光って波紋が出る
// fx：防いだ直後の残り時間（P.guardFx）、k：構えた瞬間の広がり（0→1）
function drawShield(x,y,f,A,fx,k){
  // エネルギーの盾：薄い光の膜に六角形の格子が浮かび、外縁だけが鋭く光る。両端は切り欠いた形で締め、防いだ瞬間は白く弾ける
  const hit=fx>0,h=hit?fx/.25:0,e=1-Math.pow(1-k,3),aA=A*(.55+.45*e);
  const r0=24,r1=r0+6+6*e,rm=(r0+r1)/2,a0=f-aA,a1=f+aA,al=hit?1:.8+Math.sin(G.time*9)*.1;
  const band=()=>{g.beginPath();g.arc(x,y,r1,a0,a1);g.lineTo(x+Math.cos(a1+.09)*rm,y+Math.sin(a1+.09)*rm);g.lineTo(x+Math.cos(a1)*r0,y+Math.sin(a1)*r0);g.arc(x,y,r0,a1,a0,true);g.lineTo(x+Math.cos(a0-.09)*rm,y+Math.sin(a0-.09)*rm);g.closePath()};
  g.save();g.globalCompositeOperation='lighter';g.lineCap='round';g.lineJoin='round';
  // 膜：内側は透けて、外縁へ向かって明るく
  const gr=g.createRadialGradient(x,y,r0-2,x,y,r1+1);
  gr.addColorStop(0,`rgba(20,90,220,${.06*al})`);gr.addColorStop(.55,`rgba(50,170,255,${.22*al})`);gr.addColorStop(.9,`rgba(140,235,255,${.42*al})`);gr.addColorStop(1,`rgba(220,255,255,${.55*al})`);
  g.fillStyle=gr;band();g.fill();
  // 六角形の格子（膜の中に浮かぶ）
  g.save();band();g.clip();g.strokeStyle=`rgba(170,240,255,${.28*al})`;g.lineWidth=.8;g.beginPath();
  const hx=5.2;for(let ri=0;ri<3;ri++){const rr_=r0+1+ri*hx*.87,n=Math.ceil((a1-a0)*rr_/(hx*1.5))+1;
    for(let q=0;q<n;q++){const a=a0+(q+(ri%2)*.5)*(hx*1.5)/rr_,cx=x+Math.cos(a)*rr_,cy=y+Math.sin(a)*rr_;
      for(let v=0;v<6;v++){const t=v/6*TAU+a,px=cx+Math.cos(t)*hx*.5,py=cy+Math.sin(t)*hx*.5;v?g.lineTo(px,py):g.moveTo(px,py)}g.closePath()}}
  g.stroke();g.restore();
  // 外縁の発光：太くぼかした光の上に、細く鋭い白い線
  g.strokeStyle=`rgba(80,200,255,${.35*al})`;g.lineWidth=6;g.beginPath();g.arc(x,y,r1,a0+.03,a1-.03);g.stroke();
  g.strokeStyle=hit?'#ffffff':`rgba(235,255,255,${.95*al})`;g.lineWidth=hit?2.5+2*h:1.4;g.beginPath();g.arc(x,y,r1,a0,a1);g.stroke();
  // 内縁は細く淡く
  g.strokeStyle=`rgba(120,220,255,${.45*al})`;g.lineWidth=.9;g.beginPath();g.arc(x,y,r0,a0+.05,a1-.05);g.stroke();
  // 両端の切り欠きの光
  for(const [a,d] of [[a0,-1],[a1,1]]){g.strokeStyle=`rgba(220,255,255,${.85*al})`;g.lineWidth=1.4;g.beginPath();g.moveTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1);g.lineTo(x+Math.cos(a+d*.09)*rm,y+Math.sin(a+d*.09)*rm);g.lineTo(x+Math.cos(a)*r0,y+Math.sin(a)*r0);g.stroke()}
  // 外縁を走る光（端から端へ往復）
  const sw=a0+(a1-a0)*(.5-.5*Math.cos(G.time*3.2));
  g.strokeStyle=`rgba(255,255,255,${.9*al})`;g.lineWidth=2.6;g.beginPath();g.arc(x,y,r1,Math.max(a0,sw-.12),Math.min(a1,sw+.12));g.stroke();
  // 防いだ瞬間：全体が白く弾け、外へ波紋
  if(hit){g.fillStyle=`rgba(255,255,255,${.5*h})`;band();g.fill();
    const rr=r1+4+(1-h)*26;g.strokeStyle=`rgba(150,245,255,${h})`;g.lineWidth=2+3*h;g.beginPath();g.arc(x,y,rr,a0-.1,a1+.1);g.stroke()}
  g.restore();
}

  if(e.type==='slasher'&&(e.state==='windup'||e.state==='strike')){g.strokeStyle='rgba(255,60,80,.6)';g.lineWidth=2;g.beginPath();g.arc(e.x,e.y,52,e.aim-.8,e.aim+.8);g.stroke();for(let k=0;k<=e.combo;k++)circ(e.x-8+k*8,figTop(e)-12,2.4,'#ff4060')}
  if(e.type==='sniper'&&e.state==='aim'){const p=clamp(t/1.35,0,1),blink=p>.8&&Math.floor(G.time*20)%2;g.strokeStyle=`rgba(255,20,40,${.3+p*.6})`;g.lineWidth=.8+p*3.5;g.beginPath();g.moveTo(e.x,e.y);g.lineTo(e.x+Math.cos(e.aim)*900,e.y+Math.sin(e.aim)*900);g.stroke();
    if(blink){g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=1;g.stroke()}circ(e.x+Math.cos(e.aim)*30,e.y+Math.sin(e.aim)*30,2+p*2,'#ff2040');txt('狙撃',e.x,figTop(e)-16,10,'#ff6070','center',JP,['#000',3],false,900)}
  if(e.type==='gunner'&&e.state==='aim'){
    const p=clamp(t/.78,0,1);g.strokeStyle=`rgba(255,30,60,${.25+p*.6})`;g.lineWidth=p>.85?3:1.2;g.beginPath();g.moveTo(e.x,e.y);g.lineTo(e.x+Math.cos(e.aim)*700,e.y+Math.sin(e.aim)*700);g.stroke();
  }
  if(e.type==='brute'&&e.state==='windup'){
    const p=clamp(t/.7,0,1);g.strokeStyle='rgba(255,50,60,.8)';g.lineWidth=2;g.beginPath();g.arc(e.tx,e.ty,64,0,TAU);g.stroke();
    g.fillStyle='rgba(255,40,60,.25)';g.beginPath();g.arc(e.tx,e.ty,64*p,0,TAU);g.fill();
  }
  if(e.boss&&e.state==='grab'){const p=clamp(t/.5,0,1);g.strokeStyle=`rgba(255,40,70,${.5+p*.5})`;g.lineWidth=3+p*3;g.beginPath();g.arc(e.x,e.y,e.r+P.r+30,0,TAU);g.stroke();
    g.fillStyle=`rgba(255,40,70,${.08+p*.18})`;g.beginPath();g.arc(e.x,e.y,e.r+P.r+30,0,TAU);g.fill();txt('掴み！',e.x,figTop(e)-26,15,'#ff6080','center',JP,['#000',4],false,900)}
  if(e.type==='kirishima'){
    if(e.state==='chargeAim'){const p=clamp(t/.9,0,1);g.save();g.translate(e.x,e.y);g.rotate(e.aim);g.fillStyle=`rgba(255,30,60,${.12+p*.3})`;g.fillRect(0,-e.r,900,e.r*2);g.strokeStyle=`rgba(255,80,100,${.5+p*.5})`;g.lineWidth=2;g.strokeRect(0,-e.r,900,e.r*2);g.restore()}
    if(e.state==='slashWind'){g.fillStyle='rgba(255,40,60,.25)';g.beginPath();g.moveTo(e.x,e.y);g.arc(e.x,e.y,105,e.ang-.75,e.ang+.75);g.closePath();g.fill()}
    if(e.state==='slash'&&e.st<.12){g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=4;g.beginPath();g.arc(e.x,e.y,80,e.aim-1,e.aim+1);g.stroke()}
    if(e.state==='dizzy'){for(let i=0;i<3;i++){const a=G.time*5+i*TAU/3;circ(e.x+Math.cos(a)*18,figTop(e)-12+Math.sin(a)*6,3,'#ffe066')}}
  }
  // 刃・ナイフの扇投げ：飛んでくる方向を細い線で予告
  if(e.state==='ofudaAim'||e.state==='throwAim'||e.state==='knifeAim'){const n=e.state==='ofudaAim'?3:e.hp<e.max*.5?7:5,sp=e.state==='ofudaAim'?.25:e.type==='shirasagi'?.22:.2,p=clamp(t/.55,0,1);g.strokeStyle=`rgba(230,240,255,${.2+p*.5})`;g.lineWidth=1.5;g.beginPath();
    for(let i=0;i<n;i++){const a=e.aim+(i-(n-1)/2)*sp;g.moveTo(e.x,e.y);g.lineTo(e.x+Math.cos(a)*170,e.y+Math.sin(a)*170)}g.stroke()}
  if(e.type==='shirasagi'){
    if(e.state==='gunAim'){const p=clamp(t/.6,0,1);g.strokeStyle=`rgba(255,40,70,${.25+p*.6})`;g.lineWidth=p>.85?3:1.2;g.beginPath();g.moveTo(e.x,e.y);g.lineTo(e.x+Math.cos(e.aim)*700,e.y+Math.sin(e.aim)*700);g.stroke()}
    if(e.state==='washAim'){const p=clamp(t/1,0,1);g.save();g.translate(e.x,e.y);g.rotate(e.aim);g.fillStyle=`rgba(90,184,255,${.1+p*.25+(Math.floor(G.time*12)%2?.06:0)})`;g.fillRect(0,-TS/2,WASH_LEN,TS);g.strokeStyle='rgba(150,220,255,.8)';g.lineWidth=2;g.strokeRect(0,-TS/2,WASH_LEN,TS);g.restore()}
    if(e.state==='bleachAim'){const p=clamp(t/1.1,0,1);g.strokeStyle='rgba(235,245,255,.85)';g.lineWidth=2.5;g.beginPath();g.arc(e.tx,e.ty,70,0,TAU);g.stroke();g.fillStyle=`rgba(235,245,255,${.08+p*.22})`;g.beginPath();g.arc(e.tx,e.ty,70*p,0,TAU);g.fill()}
    if(e.state==='sweepWind'){g.fillStyle='rgba(255,40,60,.25)';g.beginPath();g.moveTo(e.x,e.y);g.arc(e.x,e.y,100,e.ang-1.3,e.ang+1.3);g.closePath();g.fill()}
    if(e.state==='scrub'){const p=clamp(t/1.05,0,1);g.strokeStyle='#7fe0ff';g.lineWidth=3;g.beginPath();g.arc(e.x,figTop(e)-16,9,-Math.PI/2,-Math.PI/2+p*TAU);g.stroke();txt('掃除中——今だ！',e.x,figTop(e)-34,12,'#b8ff5a','center',JP,['#000',3],false,900)}
  }
  if(e.type==='kito'){
    if(e.state==='shotAim'){const p=clamp(t/.78,0,1);g.strokeStyle=`rgba(255,40,70,${.25+p*.6})`;g.lineWidth=p>.85?5:2;g.beginPath();g.moveTo(e.x,e.y);g.lineTo(e.x+Math.cos(e.aim)*600,e.y+Math.sin(e.aim)*600);g.stroke()}
    if(e.state==='slamWind'){const p=clamp(t/.9,0,1);g.strokeStyle='rgba(255,50,60,.85)';g.lineWidth=3;g.beginPath();g.arc(e.x,e.y,118,0,TAU);g.stroke();g.fillStyle='rgba(255,40,60,.22)';g.beginPath();g.arc(e.x,e.y,118*p,0,TAU);g.fill()}
  }
  if(wantsBang(e)){const by=figTop(e)-16+Math.sin(G.time*30)*1.5;txt('!',e.x,by,20,'#ffdd33','center',EN,['#a00010',4])}
}
function wantsBang(e){return (e.state==='windup'&&e.st<.3)||(e.state==='aim'&&e.st<.3)||e.state==='slamWind'||e.state==='chargeAim'||e.state==='shotAim'||e.state==='fuse'||
  e.state==='chant'||e.state==='ofudaAim'||e.state==='throwAim'||e.state==='knifeAim'||e.state==='gunAim'||e.state==='washAim'||e.state==='bleachAim'||e.state==='sweepWind'}

/* ---------------- world draw ---------------- */
function drawWorld(){
  g.drawImage(bgC,0,0,W,H);
  // ステージクリア後の休憩中は、床の血をゆっくり薄くしていく（次のステージは新しい床から始まるため。雨とは関係ない）
  g.globalAlpha=G.phase==='break'?clamp(G.breakT/1.2,0,1):1;g.drawImage(decC,0,0,W,H);g.globalAlpha=1;
  drawRainSplash();
  if(!G.isBossWave&&G.phase==='fight'&&state==='play'){
    // まだ塗られていないタイルは床を明るく浮かせ、角マークでも示す（終盤ほど強く点滅）
    // 屋外は地面をタイル張りに見せないよう、序盤は浮かせず角マークも薄く（75%を超えたら屋内と同じく強調）
    const pg=prog(),out=!!(theme.ground||theme.floor)&&pg<=.75,al=pg>.75?.45+Math.sin(G.time*7)*.25:(.3+pg*.15)*(out?.55:1);
    if(!out){g.fillStyle=`rgba(${theme.hi},${pg>.75?.13+Math.sin(G.time*7)*.05:.11})`;
    for(let i=0;i<GN;i++){if(DONE[i])continue;const t=tileRect(i);g.fillRect(t.x+1,t.y+1,t.w-2,t.h-2)}}
    g.strokeStyle=`rgba(${theme.hi},${al})`;g.lineWidth=1.5;g.beginPath();
    for(let i=0;i<GN;i++){if(DONE[i])continue;const t=tileRect(i),m=5,L=8;
      g.moveTo(t.x+m,t.y+m+L);g.lineTo(t.x+m,t.y+m);g.lineTo(t.x+m+L,t.y+m);
      g.moveTo(t.x+t.w-m-L,t.y+t.h-m);g.lineTo(t.x+t.w-m,t.y+t.h-m);g.lineTo(t.x+t.w-m,t.y+t.h-m-L)}
    g.stroke();
    drawCapPreview();
  }
  drawBlocks();drawPillarWarn();drawRageFx();
  // 代紋：床に描かれた鬼頭組の紋（ただの飾り。光らせず、血で塗られると暗く沈む）
  for(const c of G.crests){
    const t=tileRect(c.i),x=t.x+t.w/2,y=t.y+t.h/2,col=DONE[c.i]?'rgba(70,0,12,.55)':'rgba(200,165,90,.32)';
    g.strokeStyle=col;g.lineWidth=2;g.beginPath();g.arc(x,y,17,0,TAU);g.stroke();
    g.lineWidth=1;g.beginPath();g.arc(x,y,13,0,TAU);g.stroke();
    txt('鬼',x,y+7,18,col,'center',JP);
  }
  drawGimmicks();drawHands();
  for(const m of MARKS){const p=1-m.t/.7;g.strokeStyle=`rgba(255,40,70,${.4+p*.6})`;g.lineWidth=2;g.beginPath();g.arc(m.x,m.y,16-p*6,0,TAU);g.stroke();glow(m.x,m.y,30,'#ff2040',.3+p*.4)}
  for(const e of E)drawTele(e);
  for(const c of CORPSES){const a=c.t>.8?1-(c.t-.8)/.4:1;drawThug(c.e,c.rot+.001,clamp(a,0,1)*.9)}
  for(const t of P.trail){drawGirl(t.x,t.y,t.face,(t.t/.22)*(t.red?.35:.45),t.red?'red':'cyan')}
  for(const f of FX)if(f.k==='ghost'){g.globalAlpha=f.life/f.max*.4;g.fillStyle='#ffffff';g.beginPath();g.arc(f.x,f.y,f.e.r,0,TAU);g.fill();g.globalAlpha=1}
  // entities sorted by y
  const list=E.concat(TIRES);list.push(null);
  // 高さのある障害物も、マスの下端を足元として一緒に並べる
  if(nBlock&&!blockFlat())for(let i=0;i<GN;i++)if(BLOCK[i]){const t=tileRect(i);list.push({blk:i,y:t.y+t.h-.5})}
  list.sort((a,b)=>(a?a.y:P.y)-(b?b.y:P.y));
  for(const e of list){
    if(e&&e.blk!=null){drawBlockTile(e.blk);continue}
    if(e&&e.tire){drawTire(e.x,e.y,e.z,e.hd,e.lean,e.rot,e.sd,e.ph==='flat'?clamp((2.4-e.ft)/.6,0,1):1);continue}
    if(e===null){
      glow(P.x,P.y,46,'#48f1d2',.12);
      if(P.dead){g.save();g.globalAlpha=.85;drawGirl(P.x,P.y,P.face,.85);g.restore()}
      else{
        const rdy=G.soul>=100;
        if(rdy)drawGoldAura(P.x,P.y,G.soul>=SOUL_MAX);
        const blink=P.blinkT>0&&Math.floor(G.time*30)%2===0;drawGirl(P.x,P.y,P.face,blink?.35:1);
        if(P.guardLock&&(inp.guardKey||inp.guardMouse||inp.guardTouch!=null||inp.padGuard))txt('離して押し直し',P.x,P.y-56,12,'#7ff3ff','center',JP,['#000',4],false,900);
        if(rdy&&!(G.ready>0)){const pl=.5+Math.sin(G.time*8)*.5,p2=G.soul>=SOUL_MAX;g.globalAlpha=.75+pl*.25;txt(p2?(touchMode?'タップで怨霊の手！':'怨霊の手 OK!（L／E）'):(touchMode?'タップで怨念解放！':'怨念解放 OK!'),P.x,P.y-70-pl*3,15,p2?'#e0c0ff':'#ffe27a','center',JP,[p2?'#2a0040':'#3a1a00',4],false,900);g.globalAlpha=1}
      }
      if(P.guard&&!P.dead){
        glow(P.x+Math.cos(P.face)*24,P.y+Math.sin(P.face)*24,46,'#40d8ff',P.guardFx>0?.5:.22);
        drawShield(P.x,P.y,P.face,guardArc(),P.guardFx,P.gT||0);
      }
    }else{
      if(e.boss)glow(e.x,e.y,e.r*2.6,e.type==='kito'?'#8a3cff':e.type==='shirasagi'?'#40c8ff':'#ff3355',.18);
      if(e.boss&&e.onBlood)glow(e.x,e.y+e.r*.6,e.r*2,'#ff1030',.35+Math.sin(G.time*10)*.1);
      if(e.drag!=null){const k=clamp(e.drag/HAND_T,0,1),jt=(1-k)*2.5;g.save();g.globalAlpha=1-k*.85;g.translate(e.x+rand(-jt,jt),e.y+k*10);g.scale(1-k*.35,1-k*.55);g.translate(-e.x,-e.y);}
      if(e.shiki)drawShiki(e);else{drawThug(e);if(e.type==='onmyo')drawOnmyo(e)}
      if(e.drag!=null)g.restore();
      if(e.ashT!=null)drawBurning(e);
      if(!e.boss&&e.hp<e.max&&e.max>2){const w=e.r*2;g.fillStyle='rgba(0,0,0,.6)';g.fillRect(e.x-w/2,figTop(e)-8,w,4);g.fillStyle='#ff4060';g.fillRect(e.x-w/2,figTop(e)-8,w*clamp(e.hp/e.max,0,1),4)}
    }
  }
  if(!P.dead&&state!=='title')drawPlayerGauges();
  drawHandArms(); // 怨霊の腕は人物の手前に重ねる
  // bullets
  for(const b of B){
    if(b.friendly){
      // 跳ね返した弾：太く光る尾を引く（PERFECTは金色）
      const tr=b.trail||[],rgb=b.perfect?'255,213,74':'127,243,255';g.lineCap='round';
      for(let i=1;i<tr.length;i++){const k=i/tr.length;g.strokeStyle=`rgba(${rgb},${k*.85})`;g.lineWidth=2+k*8;g.beginPath();g.moveTo(tr[i-1].x,tr[i-1].y);g.lineTo(tr[i].x,tr[i].y);g.stroke()}
      glow(b.x,b.y,b.big?36:26,b.perfect?'#ffcc33':'#40e0ff',.9);circ(b.x,b.y,b.big?8:5,'#fff');continue;
    }
    if(b.rocket){const a=Math.atan2(b.vy,b.vx);g.save();g.translate(b.x,b.y);g.rotate(a);rr(-12,-4,18,8,3,'#5a6a3a');g.fillStyle='#ff4020';g.beginPath();g.moveTo(6,-4);g.lineTo(13,0);g.lineTo(6,4);g.fill();g.restore();
      glow(b.x-Math.cos(a)*14,b.y-Math.sin(a)*14,22+Math.random()*6,'#ff8a30',.8);continue}
    // 呪符：紫の光をまとった紙の札
    if(b.orb){glow(b.x,b.y,24,'#a040ff',.85);circ(b.x,b.y,5.5,'#f0d8ff');circ(b.x,b.y,3,'#ffffff');continue}
    if(b.ofuda){const a=Math.atan2(b.vy,b.vx);glow(b.x,b.y,16,'#b46cff',.6);g.save();g.translate(b.x,b.y);g.rotate(a+Math.sin(G.time*20)*.2);rr(-7,-3,14,6,1,'#f4efe2');g.fillStyle='#c81e1e';g.fillRect(-3,-2,6,4);g.restore();continue}
    // 投げ斧：回りながら飛ぶ（木の柄＋鉄の刃）
    if(b.axe){g.save();g.translate(b.x,b.y);g.rotate(G.time*14+b.y*.03);g.fillStyle='#7a4a24';g.fillRect(-11,-1.8,20,3.6);g.fillStyle='#c8ccd4';g.beginPath();g.moveTo(5,-2);g.lineTo(12,-9);g.quadraticCurveTo(15,0,12,9);g.lineTo(5,2);g.closePath();g.fill();g.restore();continue}
    // 投げナイフ：回りながら飛ぶ銀の刃
    if(b.knife){g.save();g.translate(b.x,b.y);g.rotate(G.time*18+b.x*.05);g.fillStyle='#e8eef5';g.beginPath();g.moveTo(-9,0);g.lineTo(3,-3);g.lineTo(10,0);g.lineTo(3,3);g.closePath();g.fill();
      g.fillStyle='#3a2a20';g.fillRect(-12,-1.6,5,3.2);g.restore();glow(b.x,b.y,14,'#cfe6ff',.45);continue}
    const col='#ffcc55';g.strokeStyle=col;g.lineWidth=3;g.lineCap='round';g.beginPath();g.moveTo(b.x-b.vx*.035,b.y-b.vy*.035);g.lineTo(b.x,b.y);g.stroke();circ(b.x,b.y,b.big?7:3,'#fff');glow(b.x,b.y,b.big?26:12,b.friendly?'#40e0ff':'#ff8a30',.6)}
  drawSlash();
  // fx
  for(const f of FX){
    const a=clamp(f.life/f.max,0,1);
    if(f.k==='b'){g.globalAlpha=Math.min(1,a*1.5);circ(f.x,f.y,f.sz*(.4+a*.6),f.col)}
    else if(f.k==='s'){g.globalAlpha=a;g.strokeStyle='#fff6c8';g.lineWidth=2;g.beginPath();g.moveTo(f.x,f.y);g.lineTo(f.x-f.vx*.03,f.y-f.vy*.03);g.stroke()}
    else if(f.k==='f'){g.globalAlpha=1;glow(f.x,f.y,f.r,'#fff3d0',a);g.save();g.translate(f.x,f.y);g.rotate(f.a);g.fillStyle=`rgba(255,255,255,${a})`;g.beginPath();const r=f.r*.8;for(let i=0;i<8;i++){const rr2=i%2?r*.18:r;const an=i*Math.PI/4;g.lineTo(Math.cos(an)*rr2,Math.sin(an)*rr2)}g.closePath();g.fill();g.restore()}
    else if(f.k==='fire'){glow(f.x,f.y,f.sz*(1.4-a*.4),f.blue?(a>.5?'#d8f4ff':'#2f6dff'):(a>.5?'#ffd27a':'#ff5a1a'),a)}
    else if(f.k==='gold'){glow(f.x,f.y,f.sz*1.6,'#ffd23a',a*.9);circ(f.x,f.y,Math.max(.6,f.sz*.22*a),'#fff6c8')}
    else if(f.k==='wash'){g.fillStyle=`rgba(120,200,255,${a*.4})`;g.fillRect(f.x,f.y,f.w,f.h)}
    else if(f.k==='drop'){g.globalAlpha=a;circ(f.x,f.y,2,'#9fd8ff')}
    else if(f.k==='oild'){g.globalAlpha=a;circ(f.x,f.y,2.4,'#24160c')}
    else if(f.k==='suds'){g.globalAlpha=a*.8;g.strokeStyle='#f2f8ff';g.lineWidth=1.3;g.beginPath();g.arc(f.x,f.y,f.sz*(1.4-a*.4),0,TAU);g.stroke();g.globalAlpha=a*.25;circ(f.x,f.y,f.sz*(1.4-a*.4),'#ffffff')}
    else if(f.k==='ash'){g.globalAlpha=Math.min(1,a*1.3)*.85;g.save();g.translate(f.x,f.y);g.rotate(f.rot);g.fillStyle=a>.75?'#ff9a40':'#6a6670';g.fillRect(-f.sz,-f.sz*.6,f.sz*2,f.sz*1.2);g.restore()}
    else if(f.k==='husk'){const p=1-a;glow(f.x,f.y-f.r*p,f.r*3,'#ff6a1a',a*.8);g.globalAlpha=a*.8;g.fillStyle='#120806';g.beginPath();g.ellipse(f.x,f.y-p*6,f.r*.9*(1-p*.5),f.r*1.3*(1-p*.3),0,0,TAU);g.fill()}
    else if(f.k==='paper'){g.globalAlpha=Math.min(1,a*1.6);g.save();g.translate(f.x,f.y);g.rotate(f.rot);g.scale(1,Math.abs(Math.cos(f.rot*1.7))*.8+.2);g.fillStyle=f.col||(f.red?'#d42a2a':'#f4efe2');g.fillRect(-f.sz,-f.sz*.6,f.sz*2,f.sz*1.2);g.restore()}
    else if(f.k==='mist'){glow(f.x,f.y,8,'#ff1838',a*.5)}
    else if(f.k==='tile'){g.fillStyle=`rgba(255,40,70,${a*.5})`;g.fillRect(f.x,f.y,f.w,f.h);
      if(!f.cap){const e=(1-a)*5;g.strokeStyle=`rgba(255,235,240,${a})`;g.lineWidth=3*a+1;g.strokeRect(f.x+3-e,f.y+3-e,f.w-6+e*2,f.h-6+e*2)}}
    else if(f.k==='capline'){g.strokeStyle=`rgba(255,${200*a|0},${210*a|0},${a})`;g.lineWidth=2+4*a;glow(f.cx,f.cy,f.R,'#ff2848',a*.35);tileOutline(f.set)}
    else if(f.k==='smoke'){g.globalAlpha=a*.45;circ(f.x,f.y,f.sz*(1.6-a*.6),'#2a2a30')}

function drawSlash(){
  const a=P.atk;if(!a||P.dead)return;
  const S=a.S,p=clamp(a.t/a.dur,0,1),e=1-Math.pow(1-Math.min(1,p*1.6),3);
  const a0=P.face+S.from,a1=P.face+S.from+(S.to-S.from)*e,R=S.range*(1+.105*lv('reach'));
  const alpha=p<.6?1:1-(p-.6)/.4,dir=Math.sign(S.to-S.from)||1,tail=a1-dir*Math.min(Math.abs(a1-a0),2.6);
  if(a.st===3){drawSpin(a,p,a0,a1,R,alpha);return}
  const col=a.crit?'255,210,80':'255,70,100';
  g.save();g.globalCompositeOperation='lighter';
  g.fillStyle=`rgba(${col},${.38*alpha})`;g.beginPath();g.arc(P.x,P.y,R,tail,a1,dir<0);g.arc(P.x,P.y,R*.42,a1,tail,dir>0);g.closePath();g.fill();
  g.fillStyle=`rgba(255,255,255,${.25*alpha})`;g.beginPath();g.arc(P.x,P.y,R,a1-dir*Math.min(Math.abs(a1-a0),.9),a1,dir<0);g.arc(P.x,P.y,R*.8,a1,a1-dir*Math.min(Math.abs(a1-a0),.9),dir>0);g.closePath();g.fill();
  // 爪痕：3本の平行な斬撃
  const span=Math.min(Math.abs(a1-a0),1.5);
  for(const k of [.62,.78,.94]){g.strokeStyle=`rgba(255,255,255,${.85*alpha})`;g.lineWidth=k===.78?3.5:2.2;g.beginPath();g.arc(P.x,P.y,R*k,a1-dir*span,a1,dir<0);g.stroke()}
  g.restore();
}

// 4段目の回転斬り：紫の怨念の渦＋残像の輪＋白熱した刃先＋金の爪痕＋外へ飛ぶ棘
function drawSpin(a,p,a0,a1,R,alpha){
  const sweep=Math.min(a1-a0,TAU*.98),tail=a1-sweep;
  g.save();g.globalCompositeOperation='lighter';
  glow(P.x,P.y,R*1.15,'#b040ff',.32*alpha);
  // 残像の輪：紫→赤の3層を少しずつ遅らせて重ねる
  for(let k=0;k<3;k++){const rr_=R*(1-k*.13),t0=Math.min(a1,tail+k*.35);g.fillStyle=`rgba(${k===1?'255,40,90':'180,60,255'},${alpha*(.42-k*.1)})`;
    g.beginPath();g.arc(P.x,P.y,rr_,t0,a1);g.arc(P.x,P.y,rr_*.45,a1,t0,true);g.closePath();g.fill()}
  // 刃先（白熱）
  const lead=Math.min(sweep,.8);g.fillStyle=`rgba(255,240,255,${.55*alpha})`;g.beginPath();g.arc(P.x,P.y,R*1.02,a1-lead,a1);g.arc(P.x,P.y,R*.72,a1,a1-lead,true);g.closePath();g.fill();
  // 金の爪痕（3本）
  const span=Math.min(sweep,2.2);for(const k of [.6,.78,.96]){g.strokeStyle=`rgba(255,215,90,${.9*alpha})`;g.lineWidth=k===.78?4:2.5;g.beginPath();g.arc(P.x,P.y,R*k,a1-span,a1);g.stroke()}
  // 振り切る瞬間、外側へ棘が飛び散る
  if(p>.2&&p<.75){const q=(p-.2)/.55,n=14;g.strokeStyle=`rgba(220,150,255,${(1-q)*.9})`;g.lineWidth=3*(1-q)+1;g.beginPath();
    for(let i=0;i<n;i++){const an=i/n*TAU+a0*.5,r0=R*(.95+q*.2),r1=R*(1.1+q*.45);g.moveTo(P.x+Math.cos(an)*r0,P.y+Math.sin(an)*r0);g.lineTo(P.x+Math.cos(an)*r1,P.y+Math.sin(an)*r1)}g.stroke()}
  g.restore();
}

    g.strokeStyle='rgba(170,190,220,.35)';g.lineWidth=1;g.beginPath();for(let i=0;i<70;i++){const x=(i*97+t*60)%W,y=(i*131+t*900)%H;g.moveTo(x,y);g.lineTo(x-3,y+16)}g.stroke();
  }else if(sc.bg==='dawn'){
    // 夜明けの空、ビル街の影、屋上の縁に立つ主人公
    const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0a0e24');gr.addColorStop(.45,'#3a2a4a');gr.addColorStop(.62,'#c8604a');gr.addColorStop(.7,'#f0a060');gr.addColorStop(.71,'#1a1418');gr.addColorStop(1,'#08080a');g.fillStyle=gr;g.fillRect(0,0,W,H);
    glow(W/2,560,140+lt*6,'#ffb070',.35);
    g.fillStyle='#120e14';for(let i=0;i<14;i++){const bw=24+(i*37)%30,bh=60+(i*53)%110,bx=i*34-10;g.fillRect(bx,568-bh,bw,bh+4);g.fillStyle='rgba(255,210,140,.5)';for(let k=0;k<4;k++)if((i+k)%3===0)g.fillRect(bx+5+k*5,568-bh+12+k*9,2,3);g.fillStyle='#120e14'}
    g.fillStyle='#050406';g.fillRect(0,640,W,160);
    drawFrame('walk','up',0,W/2,650,fade,false);
  }else if(sc.bg==='art'){
    if(titleArt()){const ta=titleArt(),h=560,w=h*ta.width/ta.height;g.drawImage(ta,W/2-w/2,190+Math.sin(t)*3,w,h)}
    const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'rgba(0,0,0,.92)');gr.addColorStop(.45,'rgba(0,0,0,.5)');gr.addColorStop(1,'rgba(0,0,0,.95)');g.fillStyle=gr;g.fillRect(0,0,W,H);
    glow(W/2,470,160,'#ff1030',.15+Math.sin(t*2)*.05);
  }else{
    txt('DEAD GIRL',W/2,330,54,'#ff2f5f','center',EN,['#000',6],true);
    txt('— ZOMBIE REVENGE —',W/2,368,13,'#c9cfdc','center',EN,null,true);
    if(lt>1.2){g.globalAlpha=fade*Math.min(1,(lt-1.2)/.8);txt('THE END',W/2,470,26,'#fff','center',EN,null,true)}
    if(lt>2.4){g.globalAlpha=fade*Math.min(1,(lt-2.4)/.8);txt('Thank you for playing',W/2,520,14,'#8b93a8','center',EN,null,true)}
  }
  // 文章：1行ずつ浮かび上がる（『』の行は赤く）
  sc.lines.forEach((l,i)=>{const a=clamp((lt-.6-i*1.4)/.8,0,1);if(a<=0)return;g.globalAlpha=fade*a;const red=l.startsWith('『');
    txt(l,W/2,(sc.bg==='art'?120:150)+i*34,red?22:16,red?'#ff2f5f':'#e6e9f0','center',JP,['#000',4],false,red?900:700)});
  g.globalAlpha=1;
  if(t>1.5)txt(touchMode?'タップで次へ':'クリック / Enter で次へ',W/2,H-30,11,'rgba(200,205,220,.5)','center',JP,null,false,700);
}
function drawClear(){
  const a=clamp(stateT/1,0,1);dim(.85*a);g.globalAlpha=a;
  txt('復讐、完了。',W/2,190,40,'#fff','center',JP,null,false,900);
  txt('鬼頭組は、一夜にして壊滅した。',W/2,232,14,'#c9cfdc','center',JP,null,false,700);
  txt('……それでも、この渇きは消えない。',W/2,256,14,'#ff4d6d','center',JP,null,false,700);
  drawStats(320);
  if(stateT>1.2){button(SCR.cshare,'結果をシェア','rgba(20,80,110,.95)');button(SCR.endless,'ENDLESS MODE ▶','rgba(160,20,45,.92)',EN);button(SCR.title,'タイトルへ','rgba(30,32,44,.92)')}
  g.globalAlpha=1;
}

/* ---------------- main draw / loop ---------------- */
function draw(){
  g.setTransform(cv.width/W,0,0,cv.height/H,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';
  if(state==='title'){TXT_SCALE=1;drawTitle();return}
  if(state==='dev'){TXT_SCALE=1;drawDev();return}
  if(state==='epilogue'){TXT_SCALE=1;drawEpilogue();return}
  if(state==='tutsel'){TXT_SCALE=1;drawTutSel();return}
  TXT_SCALE=1.2;
  g.save();
  const sh=G.shake;if(sh>.3)g.translate(rand(-sh,sh),rand(-sh,sh));
  g.translate(0,VY0);g.scale(VS,VS);g.translate(-AX0,-AY0);
  if(G.zoom>.002){const z=G.zc||P;g.translate(z.x,z.y);g.scale(1+G.zoom,1+G.zoom);g.translate(-z.x,-z.y)}
  drawWorld();drawSmokes();drawTutWorld();drawAmbient();drawRebirth();drawReady();
  g.restore();
  drawOverlays();
  drawHUD();drawTutPanel();
  if(touchMode&&state==='play')drawControls();
  drawBonusHUD();drawSea();drawBanner();drawCallout();
  if(state==='pause')drawPause();else if(state==='over')drawOver();else if(state==='clear')drawClear();else if(state==='pick')drawPick();else if(state==='offer')drawOffer();else if(state==='tutmenu')drawTutMenu();else if(state==='tutintro')drawTutIntro();else if(state==='stintro')drawStIntro();else if(state==='tutend')drawTutEnd();else if(state==='ad')drawAd();else if(state==='bres')drawBres();
}
function loop(ts){
  const rdt=Math.min(.05,(ts-last)/1000||0);last=ts;
  pollPad();update(rdt);draw();
  requestAnimationFrame(loop);
}
resetRun();resize();requestAnimationFrame(loop);
// 読み込み時点で音の準備を試す。ブラウザが許可していれば（再訪問時のPCなど）、操作なしでロゴと同時にBGMが鳴る
// iPhoneは操作前に作ると音が出なくなることがあるため、従来どおり最初のタップで準備する
if(!IOS)initAudio();
})();
</script></body></html>
